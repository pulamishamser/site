<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Letterpad System</title>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
  font-family:'Nirmala UI',sans-serif;
  background:#eef2f7;
  margin:0;
  padding:20px;
}
.container{
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  margin-bottom:20px;
}
input,textarea{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  margin:5px 5px 0 0;
  cursor:pointer;
}
.generate{background:#2c74b3;color:white;}
.print{background:#2b7a4b;color:white;}
.pdf{background:#7b4b9a;color:white;}
.clear{background:#c44536;color:white;}

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  padding:25mm;
  margin:auto;
  margin-top:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
  font-family:'Times New Roman',serif;
  position:relative;
}
.header{
  display:flex;
  align-items:center;
  gap:15px;
}
.logo{
  max-height:70px;
}
.org-name{
  font-size:22px;
  font-weight:bold;
}
.date{text-align:right;margin-top:10px;}
.subject{
  font-weight:bold;
  border-bottom:1px solid #000;
  margin:15px 0;
}
.body{
  line-height:1.6;
  text-align:justify;
  white-space:pre-line;
}
.signature-img{
  max-height:70px;
}
.footer{
  position:absolute;
  bottom:20mm;
  width:calc(100% - 50mm);
  text-align:center;
  border-top:1px solid #ccc;
  padding-top:5px;
  font-size:12px;
}
.qr-box{
  margin-top:5px;
  display:flex;
  justify-content:center;
}
@media print{
  body *{visibility:hidden;}
  #output, #output *{visibility:visible;}
  #output{position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h2>School Letterpad Generator</h2>

<label>School Logo</label>
<input type="file" id="logoFile" accept="image/*">

<label>School Name</label>
<input type="text" id="org" value="श्री डिम जनता मा.वि.">

<label>Address</label>
<input type="text" id="address" value="लालबन्दी-१६, सर्लाही">

<label>Letter Start Number</label>
<input type="number" id="letterNo" value="1">

<label>Subject</label>
<input type="text" id="subject" value="आमन्त्रण बारे">

<label>Receivers (one per line)</label>
<textarea id="receivers">राम बहादुर
श्याम अधिकारी</textarea>

<label>Letter Body</label>
<textarea id="body">[नाम] ज्यू,

कार्यक्रममा उपस्थितिको लागि हार्दिक अनुरोध गर्दछौँ।

धन्यवाद।</textarea>

<label>Sender Name</label>
<input type="text" id="sender" value="ध्रुवबहादुर भण्डारी">

<label>Position</label>
<input type="text" id="position" value="प्रधानाध्यापक">

<label>Digital Signature</label>
<input type="file" id="signatureFile" accept="image/*">

<br>
<button class="generate" onclick="generate()">Generate</button>
<button class="print" onclick="window.print()">Print</button>
<button class="pdf" onclick="downloadPDF()">Download PDF</button>
<button class="clear" onclick="location.reload()">Clear</button>

</div>

<div id="output"></div>

</div>

<script>
let logoData="",signatureData="";

document.getElementById("logoFile").onchange=e=>{
  let reader=new FileReader();
  reader.onload=ev=>logoData=ev.target.result;
  reader.readAsDataURL(e.target.files[0]);
};

document.getElementById("signatureFile").onchange=e=>{
  let reader=new FileReader();
  reader.onload=ev=>signatureData=ev.target.result;
  reader.readAsDataURL(e.target.files[0]);
};

function generate(){
  let org=document.getElementById("org").value;
  let address=document.getElementById("address").value;
  let subject=document.getElementById("subject").value;
  let body=document.getElementById("body").value;
  let sender=document.getElementById("sender").value;
  let position=document.getElementById("position").value;
  let receivers=document.getElementById("receivers").value.split("\n");
  let letterNo=parseInt(document.getElementById("letterNo").value);

  let output="";
  receivers.forEach((rec,i)=>{
    let content=body.replace(/\[नाम\]/g,rec);
    output+=`
    <div class="page">
      <div class="header">
        ${logoData?`<img src="${logoData}" class="logo">`:''}
        <div class="org-name">${org}<br><span style="font-size:14px;">${address}</span></div>
      </div>
      <div class="date">पत्र संख्या: ${letterNo+i}</div>
      <div><strong>प्रति: ${rec}</strong></div>
      <div class="subject">विषय: ${subject}</div>
      <div class="body">${content}</div>
      <br><br>
      <div style="text-align:right;">
        ${signatureData?`<img src="${signatureData}" class="signature-img"><br>`:''}
        <strong>${sender}</strong><br>${position}
      </div>
      <div class="footer">
        ${org} | ${address}
        <div class="qr-box" id="qr${i}"></div>
      </div>
    </div>`;
  });

  document.getElementById("output").innerHTML=output;

  setTimeout(()=>{
    receivers.forEach((rec,i)=>{
      new QRCode(document.getElementById("qr"+i),{
        text:org+" | "+rec,
        width:60,
        height:60
      });
    });
  },300);
}

async function downloadPDF(){
  const {jsPDF}=window.jspdf;
  let pdf=new jsPDF('p','mm','a4');
  let pages=document.querySelectorAll(".page");
  for(let i=0;i<pages.length;i++){
    if(i>0)pdf.addPage();
    let canvas=await html2canvas(pages[i],{scale:1});
    let img=canvas.toDataURL("image/jpeg",0.9);
    pdf.addImage(img,'JPEG',0,0,210,297);
  }
  pdf.save("letters.pdf");
}
</script>

</body>
</html>
