<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Official Multi Letterpad Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{font-family:Arial;padding:20px;background:#f4f6fb}
.page{width:210mm;min-height:297mm;background:white;margin:20px auto;padding:20mm;box-shadow:0 0 10px rgba(0,0,0,0.1)}
.sender-details{text-align:right;margin-top:20px}
.contact-footer{text-align:center;margin-top:20px;font-size:12px}
#output{margin-top:30px}
@media print{
body *{visibility:hidden}
#output,#output *{visibility:visible}
#output{position:absolute;left:0;top:0;width:100%}
.page{box-shadow:none;margin:0}
}
</style>
</head>
<body>

<h2>Official Multi Letterpad Pro</h2>

<label>AD Date:</label>
<input type="date" id="adDate" onchange="convertToBS()"><br><br>

<label>BS Date:</label>
<input type="text" id="letterDate"><br><br>

<label>Institution:</label>
<input type="text" id="org" value="श्री डिम जनता मा.वि."><br><br>

<label>Address:</label>
<input type="text" id="address" value="लालबन्दी-१६, सर्लाही"><br><br>

<label>Subject:</label>
<input type="text" id="subject" value="आमन्त्रण बारे"><br><br>

<label>Receivers (one per line):</label><br>
<textarea id="receivers" rows="4">गणेशबहादुर, अध्यक्ष
राजु बुढाथोकी, व्यवसायी</textarea><br><br>

<label>Letter Body:</label><br>
<textarea id="letterBody" rows="6">[महोदय],

कार्यक्रममा उपस्थित हुन हार्दिक अनुरोध गर्दछौं ।

धन्यवाद ।</textarea><br><br>

<label>Sender:</label>
<input type="text" id="sender" value="ध्रुवबहादुर भण्डारी"><br><br>

<label>Position:</label>
<input type="text" id="position" value="प्रधानाध्यापक"><br><br>

<label>Digital Signature:</label>
<input type="file" id="signatureFile" accept="image/*" onchange="uploadSignature()"><br><br>

<button onclick="generateLetters()">Generate</button>
<button onclick="downloadAsPDF()">Download PDF</button>
<button onclick="printLetters()">Print</button>

<div id="output"></div>

<script>

let signatureData = "";

// BS Converter
function convertToBS(){
const adDate=document.getElementById('adDate').value;
if(!adDate)return;
const ad=new Date(adDate);
const adBase=new Date("2020-04-13");
let bsYear=2077,bsMonth=1,bsDay=1;
const diffDays=Math.floor((ad-adBase)/(1000*60*60*24));
bsDay+=diffDays;
const monthDays=[31,31,32,31,31,30,30,29,30,29,30,30];
while(bsDay>monthDays[bsMonth-1]){
bsDay-=monthDays[bsMonth-1];
bsMonth++;
if(bsMonth>12){bsMonth=1;bsYear++;}
}
document.getElementById('letterDate').value=
`${bsYear}-${String(bsMonth).padStart(2,'0')}-${String(bsDay).padStart(2,'0')}`;
}

// Auto Increment Letter No
function getNextLetterNo(){
let last=localStorage.getItem("lastLetterNo");
if(!last){last=1;}else{last=parseInt(last)+1;}
localStorage.setItem("lastLetterNo",last);
return last;
}

// Signature Upload
function uploadSignature(){
const file=document.getElementById("signatureFile").files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(e){signatureData=e.target.result;}
reader.readAsDataURL(file);
}

// Generate Letters
function generateLetters(){

const org=document.getElementById('org').value;
const address=document.getElementById('address').value;
const subject=document.getElementById('subject').value;
const receivers=document.getElementById('receivers').value.split('\n').filter(r=>r.trim());
const body=document.getElementById('letterBody').value;
const sender=document.getElementById('sender').value;
const position=document.getElementById('position').value;
const date=document.getElementById('letterDate').value;
const letterNo=getNextLetterNo();

let output="";
receivers.forEach(rec=>{
const personalized=body.replace(/\[महोदय\]/g,rec.trim()).replace(/\n/g,'<br>');
output+=`
<div class="page">
<h3>${org}</h3>
<p>${address}</p>
<p style="text-align:right">मिति: ${date}</p>
<p>पत्र नं: ${letterNo}</p>
<p><strong>प्रति: ${rec}</strong></p>
<hr>
<p>${personalized}</p>
<div class="sender-details">
${signatureData?`<img src="${signatureData}" style="max-height:80px;"><br>`:''}
<strong>${sender}</strong><br>${position}
</div>
<div class="contact-footer">
<div id="qr_${rec.replace(/\s/g,'')}"></div>
</div>
</div>
`;
});
document.getElementById('output').innerHTML=output;

// Generate QR
receivers.forEach(rec=>{
new QRCode(document.getElementById(`qr_${rec.replace(/\s/g,'')}`),{
text:`${org}|${subject}|${date}|${rec}`,
width:70,height:70
});
});
}

// Print
function printLetters(){
if(!document.getElementById('output').innerHTML.trim()){
alert('पहिला Generate गर्नुहोस्');return;}
window.print();
}

// PDF Download
async function downloadAsPDF(){
const pages=document.querySelectorAll('.page');
if(!pages.length){alert('पहिला Generate गर्नुहोस्');return;}
const {jsPDF}=window.jspdf;
const pdf=new jsPDF('p','mm','a4');
for(let i=0;i<pages.length;i++){
if(i>0)pdf.addPage();
const canvas=await html2canvas(pages[i],{scale:1});
const img=canvas.toDataURL('image/jpeg',0.9);
pdf.addImage(img,'JPEG',0,0,210,297);
}
pdf.save("letters.pdf");
}

</script>
</body>
</html>
