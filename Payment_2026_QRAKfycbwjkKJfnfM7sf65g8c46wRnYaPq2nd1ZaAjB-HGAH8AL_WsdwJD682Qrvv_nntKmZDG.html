<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Donation</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 18px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        h2 { margin: 0 0 10px; font-size: 22px; }
        p  { margin: 0 0 22px; opacity: 0.85; font-size: 14px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(17,153,142,0.4);
            transition: transform 0.25s;
        }
        .btn:hover { transform: translateY(-2px); }
        .spinner {
            margin-top: 20px;
            width: 28px; height: 28px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h2>📚 Educational Donation</h2>
        <p>You are being redirected to the donation dashboard...</p>
        <a class="btn" href="https://script.google.com/macros/s/AKfycbwjkKJfnfM7sf65g8c46wRnYaPq2nd1ZaAjB-HGAH8AL_WsdwJD682Qrvv_nntKmZDG/exec">
            Open Donation Form →
        </a>
        <div class="spinner"></div>
    </div>

    <script>
        // Auto-redirect after 1.2 seconds — looks like a dashboard transition
        setTimeout(function () {
            window.location.href =
              "https://script.google.com/macros/s/AKfycbwjkKJfnfM7sf65g8c46wRnYaPq2nd1ZaAjB-HGAH8AL_WsdwJD682Qrvv_nntKmZDG/exec";
        }, 1200);
    </script>
</body>
</html>
