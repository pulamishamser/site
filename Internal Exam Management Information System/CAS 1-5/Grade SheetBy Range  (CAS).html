<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Sheet Generator (CAS)</title>
</head>
<body>
        
<!-- Google Apps Script Web App -->
<div class="apps-script-container">
  <iframe src="https://script.google.com/macros/s/AKfycbyOtI99w1OKFb4k_VsB8c02FQ9cPoBvtyxEfCCRvtLGuRdFbJ03sgv81maMSoE_CwT6/exec"
    title="Google Apps Script Web App"
    loading="lazy"
    allow="clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>

<style>
  .apps-script-container {
    width: 100%;
    max-width: 1200px;
    margin: 20px auto;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  }

  .apps-script-container iframe {
    display: block;
    width: 100%;
    height: 700px;
    border: 0;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .apps-script-container {
      margin: 10px 0;
      border-radius: 8px;
    }

    .apps-script-container iframe {
      height: 850px;
    }
  }

  /* Small phones */
  @media (max-width: 480px) {
    .apps-script-container iframe {
      height: 900px;
    }
  }
</style>


        
</body>
</html>
