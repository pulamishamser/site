            userName = document.getElementById('userName').value;
            userAddress = document.getElementById('userAddress').value;
            userContact = document.getElementById('userContact').value;
            
            if (!userName || !userAddress || !userContact) {
                showNotification("कृपया सबै व्यक्तिगत विवरणहरू भर्नुहोस्", "error");
                return;
            }
            
            startTime = new Date();
            userAnswers = [];
            
            registrationSection.classList.remove('active');
            quizSection.classList.add('active');
            
            // Start timer
            timer = setInterval(updateTimer, 1000);
            
            showQuestion();
        }

        // Update timer function
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes < 10 ? '०' + minutes : minutes}:${seconds < 10 ? '०' + seconds : seconds}`;
            
            // Update progress bar
            const progressPercent = ((1800 - timeLeft) / 1800) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                endQuiz();
            } else {
                timeLeft--;
            }
        }

        // Show question function
        function showQuestion() {
            const question = questions[currentQuestion];
            questionCounter.textContent = `प्रश्न ${currentQuestion + 1}/${totalQuestions}`;
            questionElement.textContent = question.question;
            
            optionsElement.innerHTML = '';
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.classList.add('option');
                optionElement.innerHTML = `
                    <div class="option-prefix">${String.fromCharCode(65 + index)}</div>
                    <div class="option-text">${option}</div>
                `;
                optionElement.addEventListener('click', () => selectAnswer(option));
                optionsElement.appendChild(optionElement);
            });
            
            explanationElement.style.display = 'none';
            nextBtn.style.display = 'none';
            submitBtn.style.display = 'none';
        }

        // Select answer function
        function selectAnswer(selected) {
            if (quizCompleted) return;
            
            const options = document.querySelectorAll('.option');
            
            // Store user's answer
            userAnswers[currentQuestion] = selected;
            
            // Mark selected option
            options.forEach(option => {
                const optionText = option.querySelector('.option-text').textContent;
                if (optionText === selected) {
                    option.classList.add('selected');
                }
                option.style.pointerEvents = 'none';
            });

            // Show next button or submit button
            if (currentQuestion < totalQuestions - 1) {
                nextBtn.style.display = 'inline-block';
            } else {
                submitBtn.style.display = 'inline-block';
            }
        }

        // Next question function
        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        // End quiz function
        function endQuiz() {
            quizCompleted = true;
            clearInterval(timer);
            
            // Calculate score
            score = 0;
            questions.forEach((question, index) => {
                if (userAnswers[index] === question.answer) {
                    score++;
                }
            });
            
            const endTime = new Date();
            const timeTaken = Math.floor((endTime - startTime) / 1000);
            const minutesTaken = Math.floor(timeTaken / 60);
            const secondsTaken = timeTaken % 60;
            
            // Update result section
            finalScore.textContent = `${score}/${totalQuestions}`;
            scoreText.textContent = `तपाईंले ${totalQuestions} मध्ये ${score} प्रश्नहरूको सही उत्तर दिनुभयो!`;
            resultName.textContent = userName;
            resultAddress.textContent = userAddress;
            resultContact.textContent = userContact;
            resultTime.textContent = `${minutesTaken} मिनेट ${secondsTaken} सेकेण्ड`;
            
            // Show detailed results
            showDetailedResults();
            
            // Show result section
            quizSection.classList.remove('active');
            resultSection.classList.add('active');
            
            // Save results to Google Sheets
            saveResultsToGoogleSheets(minutesTaken, secondsTaken);
        }

        // Show detailed results function
        function showDetailedResults() {
            detailedResults.innerHTML = '<h3><i class="fas fa-list-ol"></i> प्रश्नहरूको विस्तृत विवरण</h3>';
            
            questions.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === question.answer;
                
                const resultItem = document.createElement('div');
                resultItem.className = `result-item ${isCorrect ? 'correct' : 'incorrect'}`;
                
                const status = document.createElement('div');
                status.className = `result-status ${isCorrect ? 'status-correct' : 'status-incorrect'}`;
                status.textContent = isCorrect ? 'सही उत्तर' : 'गलत उत्तर';
                
                const questionText = document.createElement('div');
                questionText.className = 'result-question';
                questionText.textContent = `${index + 1}. ${question.question}`;
                
                resultItem.appendChild(status);
                resultItem.appendChild(questionText);
                
                // Show all options with highlighting
                question.options.forEach((option, optionIndex) => {
                    const optionElement = document.createElement('div');
                    const isUserAnswer = option === userAnswer;
                    const isCorrectAnswer = option === question.answer;
                    
                    let className = 'result-answer';
                    if (isCorrectAnswer) {
                        className += ' correct-answer';
                    }
                    if (isUserAnswer) {
                        className += ' user-answer';
                        className += isCorrect ? ' correct' : ' incorrect';
                    }
                    
                    optionElement.className = className;
                    
                    const optionLabel = document.createElement('div');
                    optionLabel.className = 'result-answer-label';
                    optionLabel.textContent = String.fromCharCode(65 + optionIndex) + '.';
                    
                    const optionText = document.createElement('div');
                    optionText.textContent = option;
                    
                    optionElement.appendChild(optionLabel);
                    optionElement.appendChild(optionText);
                    resultItem.appendChild(optionElement);
                });
                
                // Add explanation
                const explanation = document.createElement('div');
                explanation.className = 'result-explanation';
                explanation.innerHTML = `<strong>व्याख्या:</strong> ${question.explanation}`;
                resultItem.appendChild(explanation);
                
                detailedResults.appendChild(resultItem);
            });
        }

        // Save results to Google Sheets with proper headers
        function saveResultsToGoogleSheets(minutes, seconds) {
            // Use the provided Google Apps Script URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzxN-pLWX22nVudPcT0egxvPslmckS13Kq8O5MI4XD5NL6zxpaLUVV2ybcu5o2taorU/exec';
            
            // Prepare data with proper header names
            const data = {
                'नाम': userName,
                'ठेगाना': userAddress,
                'सम्पर्क नम्बर': userContact,
                'Score': `${score}/${totalQuestions}`,
                'Timestamp': new Date().toLocaleString('ne-NP')
            };
            
            // Create form data
            const formData = new FormData();
            formData.append('नाम', data['नाम']);
            formData.append('ठेगाना', data['ठेगाना']);
            formData.append('सम्पर्क नम्बर', data['सम्पर्क नम्बर']);
            formData.append('Score', data['Score']);
            formData.append('Timestamp', data['Timestamp']);
            
            // Send request
            fetch(scriptURL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('Network response was not ok.');
            })
            .then(data => {
                showNotification("तपाईंको परिणाम सफलतापूर्वक बचत गरियो!", "success");
            })
            .catch(error => {
                console.error('Error saving results:', error);
                showNotification("परिणाम बचत गर्दा त्रुटि भयो: " + error.message, "error");
            });
        }

        // Show notification function
        function showNotification(message, type) {
            // Clear previous content
            notification.innerHTML = '';
            
            // Create icon
            const icon = document.createElement('i');
            icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            
            // Create message div
            const messageDiv = document.createElement('div');
            messageDiv.id = 'notificationMessage';
            messageDiv.textContent = message;
            
            // Append elements
            notification.appendChild(icon);
            notification.appendChild(messageDiv);
            
            // Set notification type
            notification.className = 'notification active ' + type;
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                notification.classList.remove('active');
            }, 5000);
        }
    </script>
</body>
</html>
