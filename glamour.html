  <style>
    * {

      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #f8f9fc 0%, #f0f2f5 100%);
      padding: 2rem 1.5rem;
      color: #1a1a2e;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* header / title */
    .gallery-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .gallery-header h1 {
      font-size: 2.8rem;
      background: linear-gradient(135deg, #c31432, #240b36);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .gallery-header p {
      color: #2c3e66;
      font-weight: 500;
      font-size: 1.1rem;
      border-top: 2px solid #ffb347;
      display: inline-block;
      padding-top: 0.6rem;
    }

    /* responsive grid (improved) */
    .responsive {
      padding: 0 12px;
      float: left;
      width: 25%;
      margin-bottom: 28px;
    }

    .gallery {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,240,0.6);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .gallery:hover {
      transform: translateY(-8px);
      box-shadow: 0 28px 36px -14px rgba(0, 0, 0, 0.25);
      border-color: #ffb34760;
    }

    .gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }

    .gallery:hover img {
      transform: scale(1.02);
    }

    .desc {
      padding: 16px 14px 18px;
      text-align: center;
      background: #ffffff;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quote-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: #2c3e50;
      line-height: 1.4;
      background: #fef5e8;
      padding: 8px 10px;
      border-radius: 40px;
      margin-top: 4px;
      font-style: italic;
    }

    /* custom like button with counter */
    .like-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7f7fc;
      padding: 8px 12px;
      border-radius: 60px;
      margin-top: 6px;
      border: 1px solid #eceef5;
    }

    .like-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 40px;
      transition: all 0.2s;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .like-btn i {
      font-style: normal;
      font-size: 1.3rem;
      transition: transform 0.2s;
    }

    .like-btn.liked {
      background: #ffecf0;
      color: #e0245e;
    }

    .like-btn.liked i {
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .like-counter {
      font-size: 0.9rem;
      font-weight: 700;
      background: #eef2ff;
      padding: 4px 12px;
      border-radius: 50px;
      color: #1e2f5e;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .fb-save-wrapper, .comments-area {
      background: white;
      border-radius: 32px;
      padding: 20px 28px;
      margin-top: 50px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      text-align: center;
    }

    .clearfix:after {
      content: "";
      display: table;
      clear: both;
    }

    .more-link {
      display: inline-block;
      margin: 20px 0 10px;
      background: #ff6b4a;
      padding: 10px 24px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .more-link:hover {
      background: #e05538;
      transform: scale(1.02);
    }

    .info-card {
      background: #fff3e0;
      border-radius: 28px;
      padding: 16px 20px;
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    @media only screen and (max-width: 1024px) {
      .responsive { width: 33.333%; }
    }

    @media only screen and (max-width: 700px) {
      .responsive { width: 50%; }
      .gallery-header h1 { font-size: 2rem; }
    }

    @media only screen and (max-width: 500px) {
      .responsive { width: 100%; }
      body { padding: 1rem; }
    }

    hr {
      margin: 20px 0;
      border: none;
      height: 2px;
      background: linear-gradient(to right, transparent, #ffb347, transparent);
    }
  </style>
</head>

    "🌼 " + "Jasmine breeze — fresh, free, fabulous.",

    "🌸 " + "Cherry blossom season — soft power.",

  ];

  // ensure we have statements for all images (if more images than statements, repeat last but we match exactly)
  // Our imageList length = 36? Let's count: from 1..10 (10 images), 12,14,15..38 => actual count: 1-10 = 10, then 12(11),14(12),15(13),16(14),17(15),18(16),19(17),20(18),21(19),22(20),23(21),24(22),25(23),26(24),27(25),28(26),29(27),30(28),31(29),32(30),33(31),34(32),35(33),36(34),37(35),38(36) => total 36 items. statements length = 36 exactly! Perfect.
  
  // -------- PERMANENT LIKE COUNTER using localStorage --------
  // key: "glamourLikes_v2" stores an object { imageIndex: likeCount, ... }
  // also store which images current user liked in current session? we store liked status per image using another key "glamourUserLiked"
  // but to keep permanent counter (increments every time anyone clicks, and it's global), we need to increment total likes for each image.
  // Since it's a front-end demo, we simulate permanent counter via localStorage that persists across browser sessions.
  // Each like button increases the counter for that specific image, and that count remains forever (unless cleared).
  
  function loadLikeCounts() {
    const stored = localStorage.getItem("glamour_permanent_likes");
    if (stored) {
      return JSON.parse(stored);
    } else {
      // initialize all zeros (36 images)
      const initial = {};
      for (let i = 0; i < imageList.length; i++) {
        initial[i] = 0;
      }
      return initial;
    }
  }
  
  function saveLikeCounts(countsObj) {
    localStorage.setItem("glamour_permanent_likes", JSON.stringify(countsObj));
  }
  
  // track which images the current user has liked in this browser (to avoid double-like from same person? but we want permanent counter per click.
  // For realism: each click increments counter only once per user per image? but since it's gallery and permanent, we allow each visitor to like once per image.
  // We'll store userLikedStatus to prevent multiple increments from same device.
  function loadUserLikedStatus() {
    const liked = localStorage.getItem("glamour_user_liked_map");
    if (liked) return JSON.parse(liked);
    else return {};
  }
  
  function saveUserLikedStatus(status) {
    localStorage.setItem("glamour_user_liked_map", JSON.stringify(status));
  }
  
  let likeCounts = loadLikeCounts();
  let userLiked = loadUserLikedStatus();
  
  // helper: increment like for image index, but only if not already liked by this user.
  function incrementLike(index, buttonEl, counterSpan) {
    if (userLiked[index]) {
      // already liked: maybe show a subtle toast? but we'll just do nothing.
      // but we also add little shake effect? just prevent multiple likes.
      buttonEl.style.transform = "scale(0.98)";
      setTimeout(() => { buttonEl.style.transform = ""; }, 150);
      return false;
    }
    // increase permanent counter
    likeCounts[index] = (likeCounts[index] || 0) + 1;
    saveLikeCounts(likeCounts);
    // mark as liked by this user
    userLiked[index] = true;
    saveUserLikedStatus(userLiked);
    // update UI
    counterSpan.innerText = likeCounts[index];
    // add liked class & animation
    buttonEl.classList.add("liked");
    const iconSpan = buttonEl.querySelector(".like-icon");
    if (iconSpan) iconSpan.innerHTML = "❤️";
    // optional effect
    return true;
  }
  
  // render entire gallery with fresh counters and dynamic like buttons
  function renderGallery() {
    const gridContainer = document.getElementById("galleryGrid");
    if (!gridContainer) return;
    gridContainer.innerHTML = "";
    
    for (let i = 0; i < imageList.length; i++) {
      const img = imageList[i];
      const statement = uniqueStatements[i % uniqueStatements.length];
      const currentLikes = likeCounts[i] !== undefined ? likeCounts[i] : 0;
      const isLikedByUser = userLiked[i] || false;
      
      const galleryDiv = document.createElement("div");
      galleryDiv.className = "responsive";
      
      const innerGallery = document.createElement("div");
      innerGallery.className = "gallery";
      
      // image link
      const anchor = document.createElement("a");
      anchor.target = "_blank";
      anchor.href = img.src;
      const imageEl = document.createElement("img");
      imageEl.src = img.src;
      imageEl.alt = img.alt;
      imageEl.loading = "lazy";
      imageEl.width = 600;
      imageEl.height = 400;
      anchor.appendChild(imageEl);
      
      // desc container
      const descDiv = document.createElement("div");
      descDiv.className = "desc";
      
      // unique statement (different for each image!)
      const quoteSpan = document.createElement("div");
      quoteSpan.className = "quote-text";
      quoteSpan.innerHTML = `✨ ${statement} ✨`;
      
      // Like section with permanent counter
      const likeSection = document.createElement("div");
      likeSection.className = "like-section";
      
      const likeBtn = document.createElement("button");
      likeBtn.className = "like-btn";
      if (isLikedByUser) likeBtn.classList.add("liked");
      
      const iconSpan = document.createElement("i");
      iconSpan.className = "like-icon";
      iconSpan.style.fontStyle = "normal";
      iconSpan.innerHTML = isLikedByUser ? "❤️" : "🤍";
      iconSpan.style.fontSize = "1.4rem";
      
      const btnText = document.createElement("span");
      btnText.innerText = " Like";
      btnText.style.fontWeight = "600";
      
      likeBtn.appendChild(iconSpan);
      likeBtn.appendChild(btnText);
      
      const counterSpan = document.createElement("span");
      counterSpan.className = "like-counter";
      counterSpan.innerText = currentLikes;
      
      likeSection.appendChild(likeBtn);
      likeSection.appendChild(counterSpan);
      
      // optional additional info (hash)
      const hashSpan = document.createElement("div");
      hashSpan.style.fontSize = "0.7rem";
      hashSpan.style.marginTop = "6px";
      hashSpan.style.color = "#b87333";
      hashSpan.innerHTML = `#shamser.info.np  |  ${img.alt}`;
      
      descDiv.appendChild(quoteSpan);
      descDiv.appendChild(likeSection);
      descDiv.appendChild(hashSpan);
      
      innerGallery.appendChild(anchor);
      innerGallery.appendChild(descDiv);
      galleryDiv.appendChild(innerGallery);
      
      // attach like event
      likeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        incrementLike(i, likeBtn, counterSpan);
      });
      
      gridContainer.appendChild(galleryDiv);
    }
    
    // Add clearfix after grid for proper float clearing
    const clearfixDiv = document.createElement("div");
    clearfixDiv.className = "clearfix";
    gridContainer.appendChild(clearfixDiv);
  }
  
  // init rendering and sync any external changes
  renderGallery();
