<script>
    // ======================= AUTO-LOGOUT SYSTEM ==========================
    // Session timeout in milliseconds (5 minutes)
    const SESSION_TIMEOUT_MS = 5 * 60 * 1000;   // 5 minutes
    let logoutTimer = null;
    let countdownInterval = null;
    
    // Reset inactivity timer
    function resetInactivityTimer() {
        if (logoutTimer) {
            clearTimeout(logoutTimer);
        }
        if (countdownInterval) {
            clearInterval(countdownInterval);
        }
        // start new timer
        logoutTimer = setTimeout(() => {
            // auto logout due to inactivity
            if (sessionStorage.getItem("converterLoggedUser")) {
                console.log("Auto-logout due to inactivity");
                performAutoLogout();
            }
        }, SESSION_TIMEOUT_MS);
        
        // start visual countdown (every second)
        updateCountdownDisplay();
        countdownInterval = setInterval(() => {
            updateCountdownDisplay();
        }, 1000);
    }
    
    function updateCountdownDisplay() {
        const timerSpan = document.getElementById('timerSeconds');
        if (!timerSpan) return;
        // if no timer active or no user -> hide or default
        if (!logoutTimer) {
            timerSpan.innerText = "05:00";
            return;
        }
        // calculate remaining time (rough approximation using stored deadline)
        const deadline = window._inactivityDeadline;
        if (deadline) {
            const remaining = Math.max(0, deadline - Date.now());
            const seconds = Math.floor(remaining / 1000);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerSpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            if (remaining <= 0) {
                if (timerSpan.innerText !== "00:00") timerSpan.innerText = "00:00";
            }
        } else {
            timerSpan.innerText = "05:00";
        }
    }
    
    function refreshDeadline() {
        window._inactivityDeadline = Date.now() + SESSION_TIMEOUT_MS;
        updateCountdownDisplay();
    }
    
    // function to extend session on any user activity
    function extendSession() {
        if (!sessionStorage.getItem("converterLoggedUser")) return;
        if (logoutTimer) {
            clearTimeout(logoutTimer);
        }
        refreshDeadline();
        logoutTimer = setTimeout(() => {
            if (sessionStorage.getItem("converterLoggedUser")) {
                performAutoLogout();
            }
        }, SESSION_TIMEOUT_MS);
        updateCountdownDisplay();
    }
    
    function performAutoLogout() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        if (logoutTimer) {
            clearTimeout(logoutTimer);
            logoutTimer = null;
        }
        if (sessionStorage.getItem("converterLoggedUser")) {
            sessionStorage.removeItem("converterLoggedUser");
            // hide protected content and show login
            const protectedDiv = document.getElementById('protectedContent');
            if (protectedDiv) protectedDiv.style.display = 'none';
            showLoginModal();
            // optional alert
            alert("⏰ Session expired due to inactivity. Please login again.");
        }
    }
    
    // attach activity listeners to track user interactions
    function attachActivityTracker() {
        const events = ['mousedown', 'keydown', 'scroll', 'touchstart', 'click', 'input'];
        const resetSession = () => {
            if (sessionStorage.getItem("converterLoggedUser")) {
                extendSession();
            }
        };
        events.forEach(ev => {
            document.addEventListener(ev, resetSession);
        });
        // also specific for inputs
        const numberInput = document.getElementById('numInput');
        if (numberInput) numberInput.addEventListener('input', resetSession);
        const convertBtn = document.getElementById('convertBtn');
        if (convertBtn) convertBtn.addEventListener('click', resetSession);
    }
    
    // clean logout for manual logout
    function logoutUser(manual = true) {
        if (manual && !confirm("Logout from converter?")) return;
        if (countdownInterval) clearInterval(countdownInterval);
        if (logoutTimer) clearTimeout(logoutTimer);
        sessionStorage.removeItem("converterLoggedUser");
        const protectedDiv = document.getElementById('protectedContent');
        if (protectedDiv) protectedDiv.style.display = 'none';
        showLoginModal();
        if (manual) {
            // optional reset fields
        }
    }
    
    // ======================== AUTH + MODAL LOGIC ==========================
    const DEMO_USERS = [
        { username: "Admin", password: "1234#" },
        { username: "user", password: "password123" },
        { username: "demo", password: "demo123" }
    ];
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQrWWm5yoRfc06iIXkJGIlA0Wz2ID5ezPsn66W1_uU67ETOQNOf-fRVLMNRLyMxN4/exec";

    function showLoginModal() {
        const modalContainer = document.getElementById('loginModalContainer');
        if (!modalContainer) return;
        modalContainer.innerHTML = `
            <div class="login-overlay" id="loginOverlayElem">
                <div class="login-card">
                    <div class="login-header">
                        <h3><i class="fas fa-clock"></i> Register your account</h3>
                        <p style="margin:5px 0 0; opacity:0.8;">Auto Login will be disabled after 15 days.</p>
                    </div>
                    <div class="login-body">
                        <div class="login-form-group">
                            <label><i class="fas fa-user"></i> Username</label>
                            <input type="text" id="loginUsername" placeholder="Admin / user / demo" value="Admin">
                        </div>
                        <div class="login-form-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="loginPassword" placeholder="••••••" value="1234#">
                                <i class="fas fa-eye toggle-eye" id="toggleLoginPass"></i>
                            </div>
                        </div>
                        <div class="login-form-group" style="margin-top: -8px;">
                            <label style="font-weight: normal;"><input type="checkbox" id="showPassCheckbox"> Show Password</label>
                        </div>
                        <button class="login-button" id="loginExecuteBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
                        <div id="loginMessageArea" class="login-message"></div>
                        <div class="login-links">
                            <a href="#" id="registerLinkBtn"><i class="fas fa-user-plus"></i> Register</a>
                            <a href="#" id="forgotLinkBtn"><i class="fas fa-key"></i> Forgot?</a>
                        </div>
                        <div style="margin-top:14px; text-align:center; font-size:12px; color:#7f8c8d;">It will auto-logout after 5 minute in Inactivity</div>
                    </div>
                </div>
            </div>
        `;
        const passInput = document.getElementById('loginPassword');
        const showCheck = document.getElementById('showPassCheckbox');
        const toggleEye = document.getElementById('toggleLoginPass');
        const syncPasswordVisibility = (isChecked) => {
            if (isChecked) {
                passInput.type = 'text';
                if (toggleEye) toggleEye.classList.remove('fa-eye');
                if (toggleEye) toggleEye.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                if (toggleEye) toggleEye.classList.remove('fa-eye-slash');
                if (toggleEye) toggleEye.classList.add('fa-eye');
            }
        };
        if (showCheck) {
            showCheck.addEventListener('change', (e) => syncPasswordVisibility(e.target.checked));
        }
        if (toggleEye) {
            toggleEye.addEventListener('click', () => {
                const current = passInput.type === 'password';
                if (current) {
                    passInput.type = 'text';
                    toggleEye.classList.remove('fa-eye');
                    toggleEye.classList.add('fa-eye-slash');
                    if (showCheck) showCheck.checked = true;
                } else {
                    passInput.type = 'password';
                    toggleEye.classList.remove('fa-eye-slash');
                    toggleEye.classList.add('fa-eye');
                    if (showCheck) showCheck.checked = false;
                }
            });
        }
        document.getElementById('loginExecuteBtn').onclick = () => performLogin();
        document.getElementById('registerLinkBtn').onclick = (e) => { e.preventDefault(); alert("📝 Demo accounts: Admin/1234#, user/password123, demo/demo123"); };
        document.getElementById('forgotLinkBtn').onclick = (e) => { e.preventDefault(); alert("🔐 For password reset, contact admin. Demo mode available."); };
        const pwdField = document.getElementById('loginPassword');
        const userField = document.getElementById('loginUsername');
        const loginHandler = (e) => { if(e.key === 'Enter') performLogin(); };
        if(pwdField) pwdField.addEventListener('keypress', loginHandler);
        if(userField) userField.addEventListener('keypress', loginHandler);
    }
    
    async function performLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const msgDiv = document.getElementById('loginMessageArea');
        if(!username || !password) {
            msgDiv.innerHTML = '<span style="color:#d32f2f;">❌ Please fill both fields</span>';
            return;
        }
        msgDiv.innerHTML = '<span>⏳ Authenticating...</span>';
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", username: username, password: password }),
                headers: { "Content-Type": "application/json" }
            });
            const data = await response.json();
            if(data && data.status === "success") {
                sessionStorage.setItem("converterLoggedUser", data.user || username);
                msgDiv.innerHTML = '<span style="color:#2e7d32;">✅ Login successful!</span>';
                setTimeout(() => finalizeLogin(data.user || username), 400);
                return;
            } else {
                throw new Error("remote fail");
            }
        } catch(err) {
            const validUser = DEMO_USERS.find(u => u.username === username && u.password === password);
            if(validUser) {
                sessionStorage.setItem("converterLoggedUser", validUser.username);
                msgDiv.innerHTML = '<span style="color:#2e7d32;">✅ Local login success!</span>';
                setTimeout(() => finalizeLogin(validUser.username), 400);
            } else {
                msgDiv.innerHTML = '<span style="color:#d32f2f;">❌ Invalid credentials. Try Admin/1234# or user/password123</span>';
            }
        }
    }
    
    function finalizeLogin(displayName) {
        document.getElementById('loginModalContainer').innerHTML = '';
        document.getElementById('protectedContent').style.display = 'block';
        document.getElementById('displayUserName').innerText = displayName;
        document.getElementById('numInput').value = '987654321';
        document.getElementById('engTextarea').value = '';
        document.getElementById('nepTextarea').value = '';
        performConversion();  // initial conversion
        
        // Initialize session timers and activity tracking
        if (logoutTimer) clearTimeout(logoutTimer);
        if (countdownInterval) clearInterval(countdownInterval);
        refreshDeadline();
        logoutTimer = setTimeout(() => {
            if (sessionStorage.getItem("converterLoggedUser")) performAutoLogout();
        }, SESSION_TIMEOUT_MS);
        countdownInterval = setInterval(() => updateCountdownDisplay(), 1000);
        attachActivityTracker();
    }
    
    // ==================== NUMBER TO WORDS ENGINE (ENGLISH + NEPALI) ===================
    function performConversion() {
        const inputElem = document.getElementById('numInput');
        let rawValue = inputElem.value.trim();
        if(rawValue === "") {
            document.getElementById('engTextarea').value = "Please enter a number.";
            document.getElementById('nepTextarea').value = "कृपया संख्या प्रविष्ट गर्नुहोस्।";
            return;
        }
        let cleanNumber = rawValue.replace(/,/g, '');
        if (!/^\d+$/.test(cleanNumber)) {
            document.getElementById('engTextarea').value = "Invalid number (digits only)";
            document.getElementById('nepTextarea').value = "अमान्य संख्या (केवल अंकहरू)";
            return;
        }
        if(cleanNumber.length > 21) {
            document.getElementById('engTextarea').value = "Number exceeds 21 digits limit.";
            document.getElementById('nepTextarea').value = "२१ अंक भन्दा बढी अनुमति छैन।";
            return;
        }
        const bigNum = BigInt(cleanNumber);
        const englishWords = convertEnglish(bigNum);
        const nepaliWords = convertToNepaliWords(cleanNumber);
        document.getElementById('engTextarea').value = englishWords;
        document.getElementById('nepTextarea').value = nepaliWords;
        // extend session on conversion action (manual trigger)
        extendSession();
    }
    
    function convertEnglish(num) {
        if (num === 0n) return "zero";
        const units = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
        const teens = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
        const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
        const scales = ["", "thousand", "million", "billion", "trillion", "quadrillion", "quintillion", "sextillion", "septillion", "octillion", "nonillion"];
        function chunkToWords(n) {
            if (n === 0n) return "";
            if (n < 10n) return units[Number(n)];
            if (n < 20n) return teens[Number(n - 10n)];
            if (n < 100n) {
                let ten = Number(n / 10n);
                let unit = Number(n % 10n);
                return tens[ten] + (unit ? "-" + units[unit] : "");
            }
            let hundred = Number(n / 100n);
            let remainder = n % 100n;
            let rest = remainder === 0n ? "" : " and " + chunkToWords(remainder);
            return units[hundred] + " hundred" + rest;
        }
        let result = [];
        let scaleIdx = 0;
        let remaining = num;
        while (remaining > 0n) {
            let chunk = remaining % 1000n;
            if (chunk !== 0n) {
                let chunkStr = chunkToWords(chunk);
                if (scaleIdx > 0) chunkStr += " " + scales[scaleIdx];
                result.unshift(chunkStr);
            }
            remaining = remaining / 1000n;
            scaleIdx++;
        }
        return result.join(", ");
    }
    
    function convertToNepaliWords(numStr) {
        let num = parseInt(numStr, 10);
        if (isNaN(num)) return "अमान्य संख्या";
        if (num === 0) return "शून्य";
        const units = ["", "एक", "दुई", "तीन", "चार", "पाँच", "छ", "सात", "आठ", "नौ"];
        const teens = ["दश", "एघार", "बाह्र", "तेह्र", "चौध", "पन्ध्र", "सोह्र", "सत्र", "अठार", "उन्नाइस"];
        const tens = ["", "दश", "बीस", "तीस", "चालीस", "पचास", "साठी", "सत्तरी", "अस्सी", "नब्बे"];
        const jointMap = {21:"एक्काइस",22:"बाइस",23:"तेइस",24:"चौबिस",25:"पच्चिस",26:"छब्बिस",27:"सत्ताइस",28:"अठ्ठाइस",29:"उनन्तिस",31:"एकत्तिस",32:"बत्तिस",33:"तेत्तिस",34:"चौँतिस",35:"पैँतिस",36:"छत्तिस",37:"सैँतीस",38:"अठ्ठाइस",39:"उनन्चालिस",41:"एकचालिस",42:"बयालिस",43:"त्रियालिस",44:"चवालिस",45:"पैँतालिस",46:"छयालिस",47:"सच्चालिस",48:"अठचालिस",49:"उनन्पचास",51:"एकाउन्न",52:"बाउन्न",53:"त्रिपन्न",54:"चउन्न",55:"पचपन्न",56:"छपन्न",57:"सन्ताउन्न",58:"अन्ठाउन्न",59:"उनन्साठी",61:"एकसट्ठी",62:"बैसट्ठी",63:"त्रिसट्ठी",64:"चौंसट्ठी",65:"पैंसट्ठी",66:"छयसट्ठी",67:"सतसट्ठी",68:"अठसट्ठी",69:"उनन्सत्तरी",71:"एकहत्तर",72:"बहत्तर",73:"त्रिहत्तर",74:"चौहत्तर",75:"पचहत्तर",76:"छयहत्तर",77:"सतहत्तर",78:"अठहत्तर",79:"उनासी",81:"एकासी",82:"बयासी",83:"त्रियासी",84:"चौरासी",85:"पचासी",86:"छयासी",87:"सतासी",88:"अठासी",89:"उनान्नब्बे",91:"एकान्नब्बे",92:"बयान्नब्बे",93:"त्रियान्नब्बे",94:"चौरान्नब्बे",95:"पन्चानब्बे",96:"छयान्नब्बे",97:"सन्तान्नब्बे",98:"अन्ठान्नब्बे",99:"उनान्सय"};
        function underHundred(n) { if (n===0) return ""; if (n<10) return units[n]; if (n<20) return teens[n-10]; if (jointMap[n]) return jointMap[n]; let ten = Math.floor(n/10); let unit = n%10; return tens[ten] + (unit ? " " + units[unit] : ""); }
        function underThousand(n) { if (n<100) return underHundred(n); let hundred = Math.floor(n/100); let rem = n%100; let base = units[hundred] + " सय"; if (rem) base += " " + underHundred(rem); return base; }
        function underLakh(n) { if (n<1000) return underThousand(n); let thousand = Math.floor(n/1000); let rem = n%1000; let part = underHundred(thousand) + " हजार"; if (rem) part += " " + underThousand(rem); return part; }
        if (num >= 100000) { let lakhs = Math.floor(num/100000); let rem = num%100000; let res = underHundred(lakhs) + " लाख"; if (rem>0) res += " " + (rem>=1000 ? underLakh(rem) : underThousand(rem)); return res; }
        else if (num >= 1000) return underLakh(num);
        else return underThousand(num);
    }
    
    window.formatEnglishText = function(type) {
        const ta = document.getElementById('engTextarea');
        let text = ta.value;
        if (!text) return;
        if (type === 'sentence') text = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
        else if (type === 'title') text = text.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
        else if (type === 'upper') text = text.toUpperCase();
        else if (type === 'lower') text = text.toLowerCase();
        ta.value = text;
        extendSession();
    };
    window.copyText = function(id) { let el=document.getElementById(id); el.select(); document.execCommand('copy'); alert('✓ Copied'); extendSession(); };
    
    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = sessionStorage.getItem("converterLoggedUser");
        if(savedUser) {
            document.getElementById('protectedContent').style.display = 'block';
            document.getElementById('displayUserName').innerText = savedUser;
            document.getElementById('loginModalContainer').innerHTML = '';
            performConversion();
            refreshDeadline();
            logoutTimer = setTimeout(() => { if(sessionStorage.getItem("converterLoggedUser")) performAutoLogout(); }, SESSION_TIMEOUT_MS);
            countdownInterval = setInterval(() => updateCountdownDisplay(), 1000);
            attachActivityTracker();
        } else {
            document.getElementById('protectedContent').style.display = 'none';
            showLoginModal();
        }
        const logoutBtn = document.getElementById('logoutBtnMain');
        if(logoutBtn) logoutBtn.onclick = () => logoutUser(true);
        const convertElem = document.getElementById('convertBtn');
        if(convertElem) convertElem.onclick = () => { performConversion(); extendSession(); };
        const numField = document.getElementById('numInput');
        if(numField) numField.addEventListener('input', () => extendSession());
    });
