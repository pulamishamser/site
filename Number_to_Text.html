    <script>
        function convertNumbers() {
            const number = document.getElementById("numberInput").value;
            const englishResult = document.getElementById("Number_inWords");
            const nepaliResult = document.getElementById("NumberinWords");

            if (isNaN(number) || number === "") {
                englishResult.value = "Please enter a valid number.";
                nepaliResult.value = "कृपया वैध नम्बर प्रविष्ट गर्नुहोस्।";
                return;
            }

            if (number.length > 21) {
                englishResult.value = "Number cannot exceed 21 digits.";
                nepaliResult.value = "नम्बर २१ अंक भन्दा बढी हुन सक्दैन।";
                return;
            }

            englishResult.value = englishNumberToWords(number);
            nepaliResult.value = nepaliNumberToWords(number);
        }

        function englishNumberToWords(n) {
            const num = BigInt(n);
            if (num === 0n) return "zero";

            const units = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
            const teens = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
            const tens = ["", "ten", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
            const scales = ["", "thousand", "million", "billion", "trillion", "quadrillion", "quintillion", "sextillion", "septillion", "octillion", "nonillion"];

            function convertLessThanOneThousand(num) {
                if (num === 0n) return "";
                if (num < 10n) return units[Number(num)];
                if (num < 20n) return teens[Number(num - 10n)];
                if (num < 100n) {
                    return tens[Number(num / 10n)] + (num % 10n !== 0n ? "-" + units[Number(num % 10n)] : "");
                }
                return units[Number(num / 100n)] + " hundred" + (num % 100n !== 0n ? " and " + convertLessThanOneThousand(num % 100n) : "");
            }

            let words = "";
            let scaleIndex = 0;
            let remaining = num;

            while (remaining > 0n) {
                const chunk = remaining % 1000n;
                if (chunk !== 0n) {
                    let chunkWords = convertLessThanOneThousand(chunk);
                    if (scaleIndex > 0) {
                        chunkWords += " " + scales[scaleIndex];
                    }
                    words = chunkWords + (words ? ", " + words : "");
                }
                remaining = remaining / 1000n;
                scaleIndex++;
            }

            return words;
        }

        function nepaliNumberToWords(n) {
            const num = parseInt(n);
            if (num === 0) return "शून्य";

            const units = ["", "एक", "दुई", "तीन", "चार", "पाँच", "छ", "सात", "आठ", "नौ"];
            const teens = ["दश", "एघार", "बाह्र", "तेह्र", "चौध", "पन्ध्र", "सोह्र", "सत्र", "अठार", "उन्नाइस"];
            const tens = ["", "दश", "बीस", "तीस", "चालीस", "पचास", "साठी", "सत्तरी", "अस्सी", "नब्बे"];
            const jointNumbers = {
                21: "एक्काइस", 22: "बाइस", 23: "तेइस", 24: "चौबिस", 25: "पच्चिस",
                26: "छब्बिस", 27: "सत्ताइस", 28: "अठ्ठाइस", 29: "उनन्तिस",
                31: "एकत्तिस", 32: "बत्तिस", 33: "तेत्तिस", 34: "चौँतिस", 35: "पैँतिस",
                36: "छत्तिस", 37: "सैँतीस", 38: "अठ्ठाइस", 39: "उनन्चालिस",
                41: "एकचालिस", 42: "बयालिस", 43: "त्रियालिस", 44: "चवालिस", 45: "पैँतालिस",
                46: "छयालिस", 47: "सच्चालिस", 48: "अठचालिस", 49: "उनन्पचास",
                51: "एकाउन्न", 52: "बाउन्न", 53: "त्रिपन्न", 54: "चउन्न", 55: "पचपन्न",
                56: "छपन्न", 57: "सन्ताउन्न", 58: "अन्ठाउन्न", 59: "उनन्साठी",
                61: "एकसट्ठी", 62: "बैसट्ठी", 63: "त्रिसट्ठी", 64: "चौंसट्ठी", 65: "पैंसट्ठी",
                66: "छयसट्ठी", 67: "सतसट्ठी", 68: "अठसट्ठी", 69: "उनन्सत्तरी",
                71: "एकहत्तर", 72: "बहत्तर", 73: "त्रिहत्तर", 74: "चौहत्तर", 75: "पचहत्तर",
                76: "छयहत्तर", 77: "सतहत्तर", 78: "अठहत्तर", 79: "उनासी",
                81: "एकासी", 82: "बयासी", 83: "त्रियासी", 84: "चौरासी", 85: "पचासी",
                86: "छयासी", 87: "सतासी", 88: "अठासी", 89: "उनान्नब्बे",
                91: "एकान्नब्बे", 92: "बयान्नब्बे", 93: "त्रियान्नब्बे", 94: "चौरान्नब्बे", 95: "पन्चानब्बे",
                96: "छयान्नब्बे", 97: "सन्तान्नब्बे", 98: "अन्ठान्नब्बे", 99: "उनान्सय"
            };

            function convertLessThanOneHundred(num) {
                if (num === 0) return "";
                if (num < 10) return units[num];
                if (num < 20) return teens[num - 10];
                if (jointNumbers[num]) return jointNumbers[num];
                return tens[Math.floor(num / 10)] + (num % 10 !== 0 ? " " + units[num % 10] : "");
            }

            function convertLessThanOneThousand(num) {
                if (num < 100) return convertLessThanOneHundred(num);
                return units[Math.floor(num / 100)] + " सय" + (num % 100 !== 0 ? " " + convertLessThanOneHundred(num % 100) : "");
            }

            function convertLessThanTenThousand(num) {
                if (num < 1000) return convertLessThanOneThousand(num);
                return convertLessThanOneHundred(Math.floor(num / 1000)) + " हजार" + (num % 1000 !== 0 ? " " + convertLessThanOneThousand(num % 1000) : "");
            }

            function convertLessThanOneLakh(num) {
                if (num < 10000) return convertLessThanTenThousand(num);
                return convertLessThanOneHundred(Math.floor(num / 1000)) + " हजार" + (num % 1000 !== 0 ? " " + convertLessThanOneThousand(num % 1000) : "");
            }

            let words = "";
            let remaining = num;

            // Handle numbers greater than or equal to 1 lakh
            if (remaining >= 100000) {
                const lakhs = Math.floor(remaining / 100000);
                remaining = remaining % 100000;
                words += convertLessThanOneHundred(lakhs) + " लाख";
                if (remaining > 0) {
                    words += " " + convertLessThanOneLakh(remaining);
                }
            } 
            // Handle numbers between 1000 and 99999
            else if (remaining >= 1000) {
                words = convertLessThanTenThousand(remaining);
            } 
            // Handle numbers less than 1000
            else {
                words = convertLessThanOneThousand(remaining);
            }

            return words;
        }

        function formatText(formatType) {
            const textarea = document.getElementById("Number_inWords");
            let text = textarea.value;
            
            switch(formatType) {
                case 'sentencecase':
                    text = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
                    break;
                case 'titlecase':
                    text = text.split(' ').map(word => 
                        word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                    ).join(' ');
                    break;
                case 'capitalcase':
                    text = text.split(' ').map(word => 
                        word.charAt(0).toUpperCase() + word.slice(1)
                    ).join(' ');
                    break;
                case 'lowercase':
                    text = text.toLowerCase();
                    break;
                case 'uppercase':
                    text = text.toUpperCase();
                    break;
            }
            
            textarea.value = text;
        }

        function copyToClipboard(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }
    </script>
