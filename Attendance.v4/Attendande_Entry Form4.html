<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Student Data Entry</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        }
        body {
            background: linear-gradient(125deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 24px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1350px;
            margin: 0 auto;
        }
        .main-card {
            background: rgba(255,255,255,0.98);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(105deg, #0f2b4d 0%, #1d4ed8 100%);
            color: white;
            padding: 28px 36px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .header h1 {
            margin: 0 0 6px 0;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            font-weight: 700;
        }
        .header p {
            margin: 0;
            opacity: 0.85;
            font-size: 0.85rem;
        }
        .form-body {
            padding: 32px 36px;
        }
        .auto-default-pavilion {
            background: #fefce8;
            border: 1px solid #fde047;
            border-radius: 32px;
            padding: 16px 26px;
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.1);
        }
        .default-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .default-tile {
            background: white;
            border-radius: 60px;
            padding: 5px 18px 5px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #eferc6;
        }
        .default-tile label {
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #854d0e;
        }
        .smart-select, .smart-input-year {
            background: #fffbeb;
            border: 1px solid #fed7aa;
            border-radius: 40px;
            padding: 8px 28px 8px 16px;
            font-weight: 600;
            color: #b45309;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }
        .smart-input-year {
            background-image: none;
            width: 90px;
            text-align: center;
            appearance: textfield;
        }
        .reset-default-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 20px;
            border-radius: 34px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-default-btn:hover {
            background: #cbd5e1;
        }
        .month-selector-container {
            background: #ffffff;
            border-radius: 28px;
            border: 2px solid #e2e8f0;
            margin: 8px 0 20px 0;
            transition: all 0.2s;
        }
        .month-selector-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: #f8fafc;
            border-radius: 26px 26px 0 0;
            border-bottom: 1px solid #e2e8f0;
            gap: 12px;
        }
        .month-selector-title {
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .month-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            padding: 20px;
            background: #ffffff;
            border-radius: 0 0 28px 28px;
        }
        .month-check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 48px;
            transition: 0.1s;
            cursor: pointer;
        }
        .month-check-item:hover {
            background: #e2e8f0;
        }
        .month-check-item input {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
            accent-color: #1d4ed8;
        }
        .month-check-item label {
            font-weight: 500;
            font-size: 0.85rem;
            color: #0f172a;
            cursor: pointer;
            flex: 1;
        }
        .toggle-all-btn {
            background: #e2e8f0;
            border: none;
            border-radius: 32px;
            padding: 6px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 26px 32px;
            margin-bottom: 32px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field-group label {
            font-weight: 700;
            color: #0f172a;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        input, select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: 0.2s;
            background: #ffffff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
        }
        input[readonly] {
            background: #f1f5f9;
            border-color: #cbd5e1;
            font-weight: 500;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 16px 0 20px 0;
        }
        button {
            border: none;
            border-radius: 48px;
            padding: 11px 28px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-submit {
            background: linear-gradient(95deg, #047857, #10b981);
            color: white;
            box-shadow: 0 5px 12px rgba(4,120,87,0.35);
        }
        .btn-delete {
            background: #b91c1c;
            color: white;
        }
        .btn-reset-form {
            background: #334155;
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.03);
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .spinner {
            width: 55px;
            height: 55px;
            border: 6px solid white;
            border-top-color: #1d4ed8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .info-chip {
            background: #dbeafe;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e40af;
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>
<div class="container">
    <div class="main-card">
        <div class="header">
        </div>
        <div class="form-body">
            <div class="auto-default-pavilion">
                <div class="default-cluster">
                    <div class="default-tile">
                        <label>🏫 DEFAULT CLASS</label>
                        <select id="globalDefaultClass" class="smart-select">
                            <optgroup label="General">
                                <option value="ECD">ECD</option><option value="PG">PG</option>
                                <option value="Nursary">Nursary</option><option value="LKG">LKG</option><option value="UKG">UKG</option>
                            </optgroup>
                            <optgroup label="Grade">
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                                <option value="7">7</option><option value="8" selected>8</option>
                                <option value="9">9</option><option value="10">10</option>
                                <option value="11">11</option><option value="12">12</option>
                            </optgroup>
                            <optgroup label="EM">
                                <option value="1EM">1EM</option><option value="2EM">2EM</option>
                                <option value="3EM">3EM</option><option value="4EM">4EM</option>
                                <option value="5EM">5EM</option><option value="6EM">6EM</option>
                                <option value="7EM">7EM</option><option value="8EM">8EM</option>
                                <option value="9EM">9EM</option><option value="10EM">10EM</option>
                                <option value="11EM">11EM</option><option value="12EM">12EM</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="default-tile">
                        <label>📆 YEAR (BS)</label>
                        <input type="number" id="globalDefaultYear" class="smart-input-year" value="2083" step="1">
                    </div>
                </div>
                <button type="button" id="factoryResetDefaultsBtn" class="reset-default-btn">⟳ RESET DEFAULTS</button>
            </div>

            <div class="month-selector-container">
                <div class="month-selector-header">
                    <div class="month-selector-title">
                        📅 SELECT MONTH <span class="info-chip">SN auto </span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" id="selectAllMonthsBtn" class="toggle-all-btn">✅ All Months</button>
                        <button type="button" id="deselectAllMonthsBtn" class="toggle-all-btn">❌ None</button>
                    </div>
                </div>
                <div id="monthCheckboxGrid" class="month-checkbox-grid"></div>
            </div>

            <form id="masterStudentForm">
                <div class="form-grid">
                    <div class="field-group">
                        <label>📅 ACADEMIC YEAR</label>
                        <input type="text" id="mainYear" placeholder="e.g., 2083" required>
                    </div>
                    <div class="field-group">
                        <label>🔢 SN </label>
                        <input type="text" id="autoSnField" readonly placeholder="Auto from last row">
                    </div>
                    <div class="field-group">
                        <label>📌 ROLL NUMBER </label>
                        <input type="text" id="rollNumber" required placeholder="e.g., 101">
                    </div>
                    <div class="field-group">
                        <label>🏫 CLASS</label>
                        <input type="text" id="classMain" required placeholder="Class">
                    </div>
                    <div class="field-group">
                        <label>👤 FULL NAME</label>
                        <input type="text" id="studentFullName" required placeholder="Full name">
                    </div>
                    <div class="field-group">
                        <label>👨 FATHER'S NAME</label>
                        <input type="text" id="fatherName" placeholder="Father's name">
                    </div>
                    <div class="field-group">
                        <label>👩 MOTHER'S NAME</label>
                        <input type="text" id="motherName" placeholder="Mother's name">
                    </div>
                    <div class="field-group">
                        <label>🎂 DATE OF BIRTH</label>
                        <input type="text" id="dobField" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="field-group">
                        <label>📞 MOBILE NUMBER</label>
                        <input type="tel" id="mobileContact" placeholder="Contact number">
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn-submit">💾 SUBMIT RECORD</button>
                    <button type="button" id="deleteLastRowBtn" class="btn-delete">🗑️ DELETE LAST ROW</button>
                    <button type="button" id="clearFormBtn" class="btn-reset-form">🔄 CLEAR FIELDS</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // ======================== CONFIGURATION ========================
    const SCRIPT_API = "https://script.google.com/macros/s/AKfycbxslJwrgmEweE1jwFGn91yhGCt5SDmSbM652-oRg3Lxl3adH0BO-WqtLVLYMLnAp_2Hdw/exec";
    
    const STORAGE_DEF_CLASS = "att_class_default";
    const STORAGE_DEF_YEAR = "att_year_default";
    const FALLBACK_CLASS = "8";
    const FALLBACK_YEAR = "2083";
    
    const ALL_MONTHS_LIST = [
        "Baisakh", "Jeshtha", "Ashad", "Shrawan", "Bhadra", "Ashwin",
        "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"
    ];
    
    // DOM Elements
    const defaultClassSelect = document.getElementById("globalDefaultClass");
    const defaultYearInput = document.getElementById("globalDefaultYear");
    const mainYear = document.getElementById("mainYear");
    const mainClass = document.getElementById("classMain");
    const autoSnField = document.getElementById("autoSnField");
    const rollNoInput = document.getElementById("rollNumber");
    const studentNameInput = document.getElementById("studentFullName");
    const fatherNameInput = document.getElementById("fatherName");
    const motherNameInput = document.getElementById("motherName");
    const dobInput = document.getElementById("dobField");
    const mobileInput = document.getElementById("mobileContact");
    const monthCheckboxGrid = document.getElementById("monthCheckboxGrid");
    const loadingOverlay = document.getElementById("loadingOverlay");
    
    let selectedMonthsSet = new Set();
    
    function setLoading(show) {
        loadingOverlay.style.display = show ? "flex" : "none";
    }
    
    function renderMonthCheckboxes() {
        monthCheckboxGrid.innerHTML = "";
        ALL_MONTHS_LIST.forEach(month => {
            const div = document.createElement("div");
            div.className = "month-check-item";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.value = month;
            cb.id = `chk_${month}`;
            cb.checked = selectedMonthsSet.has(month);
            cb.addEventListener("change", (e) => {
                if (e.target.checked) selectedMonthsSet.add(month);
                else selectedMonthsSet.delete(month);
                localStorage.setItem("selected_months", JSON.stringify(Array.from(selectedMonthsSet)));
                refreshAutoSN();
            });
            const label = document.createElement("label");
            label.htmlFor = `chk_${month}`;
            label.textContent = month;
            div.appendChild(cb);
            div.appendChild(label);
            monthCheckboxGrid.appendChild(div);
        });
    }
    
    function syncCheckboxUI() {
        ALL_MONTHS_LIST.forEach(month => {
            const cb = document.getElementById(`chk_${month}`);
            if (cb) cb.checked = selectedMonthsSet.has(month);
        });
    }
    
    function selectAllMonths() {
        ALL_MONTHS_LIST.forEach(month => selectedMonthsSet.add(month));
        syncCheckboxUI();
        localStorage.setItem("selected_months", JSON.stringify(Array.from(selectedMonthsSet)));
        refreshAutoSN();
    }
    
    function deselectAllMonths() {
        selectedMonthsSet.clear();
        syncCheckboxUI();
        localStorage.setItem("selected_months", JSON.stringify([]));
        autoSnField.value = "—";
    }
    
    function loadStoredMonthSelections() {
        const stored = localStorage.getItem("selected_months");
        if (stored) {
            try {
                const arr = JSON.parse(stored);
                if (Array.isArray(arr)) {
                    selectedMonthsSet.clear();
                    arr.forEach(m => { if (ALL_MONTHS_LIST.includes(m)) selectedMonthsSet.add(m); });
                }
            } catch(e) {}
        }
        if (selectedMonthsSet.size === 0) selectedMonthsSet.add("Baisakh");
        renderMonthCheckboxes();
    }
    
    function getStoredDefaults() {
        return {
            defClass: localStorage.getItem(STORAGE_DEF_CLASS) ?? FALLBACK_CLASS,
            defYear: localStorage.getItem(STORAGE_DEF_YEAR) ?? FALLBACK_YEAR,
        };
    }
    
    function syncDefaultsToForm() {
        const { defClass, defYear } = getStoredDefaults();
        if ([...defaultClassSelect.options].some(opt => opt.value === defClass)) defaultClassSelect.value = defClass;
        else defaultClassSelect.value = FALLBACK_CLASS;
        defaultYearInput.value = defYear;
        mainYear.value = defYear;
        mainClass.value = defClass;
    }
    
    function updateStoredAndSyncUI(type, value) {
        if (type === 'class') localStorage.setItem(STORAGE_DEF_CLASS, value);
        if (type === 'year') localStorage.setItem(STORAGE_DEF_YEAR, value);
        syncDefaultsToForm();
        refreshAutoSN();
    }
    
    defaultClassSelect.addEventListener("change", (e) => updateStoredAndSyncUI('class', e.target.value));
    defaultYearInput.addEventListener("change", (e) => {
        let yr = e.target.value.trim();
        if (yr === "") yr = FALLBACK_YEAR;
        updateStoredAndSyncUI('year', yr);
    });
    
    // ========== CORE FUNCTIONS ==========
    
    // Fetch all records from a month sheet (including full data to get SN from Column A)
    async function fetchAllRecords(monthSheet, year) {
        try {
            const url = `${SCRIPT_API}?action=getAll&monthSheet=${encodeURIComponent(monthSheet)}&year=${encodeURIComponent(year)}&_=${Date.now()}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data.success && Array.isArray(data.data)) {
                return data.data;
            }
            return [];
        } catch (err) {
            console.error(`Fetch error for ${monthSheet}:`, err);
            return [];
        }
    }
    
    // Get the last SN from Column A (maximum SN value in the sheet)
    async function getLastSNFromColumnA(monthSheet, year) {
        const records = await fetchAllRecords(monthSheet, year);
        let maxSn = 0;
        
        records.forEach(record => {
            // Check SN from Column A (the 'sn' field)
            let snVal = parseInt(record.sn);
            if (!isNaN(snVal) && snVal > maxSn) {
                maxSn = snVal;
            }
        });
        
        // Return next SN (max + 1), or 1 if no records exist
        return maxSn + 1;
    }
    
    // Check duplicate in records - Class + Roll Number combination
    function isDuplicate(records, rollNo, className) {
        const searchRoll = String(rollNo).trim().toLowerCase();
        const searchClass = String(className).trim().toLowerCase();
        
        return records.some(record => {
            const recordRoll = String(record.roll_no || record.roll || record.rollnumber || "").trim().toLowerCase();
            const recordClass = String(record.class || record.class_name || "").trim().toLowerCase();
            return recordRoll === searchRoll && recordClass === searchClass;
        });
    }
    
    async function refreshAutoSN() {
        if (selectedMonthsSet.size === 0) {
            autoSnField.value = "—";
            return;
        }
        const firstMonth = Array.from(selectedMonthsSet)[0];
        const yearVal = mainYear.value.trim() || getStoredDefaults().defYear;
        const nextSN = await getLastSNFromColumnA(firstMonth, yearVal);
        autoSnField.value = nextSN;
    }
    
    // Submit to backend with proper SN from Column A
    async function submitToBackend(payload) {
        try {
            const bodyParams = new URLSearchParams({ action: "addStudent", ...payload });
            const resp = await fetch(SCRIPT_API, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: bodyParams.toString()
            });
            const raw = await resp.text();
            try {
                return JSON.parse(raw);
            } catch (err) {
                return { success: false, message: "Server response error" };
            }
        } catch (err) {
            return { success: false, message: `Network error: ${err.message}` };
        }
    }
    
    // MAIN SUBMIT HANDLER with proper SN increment per month
    document.getElementById("masterStudentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const yearVal = mainYear.value.trim();
        const classVal = mainClass.value.trim();
        const roll = rollNoInput.value.trim();
        const studentName = studentNameInput.value.trim();
        
        if (!yearVal) { alert("Please enter academic year"); return; }
        if (!classVal) { alert("Please enter Class"); return; }
        if (!roll) { alert("Please enter Roll Number"); return; }
        if (!studentName) { alert("Please enter Full Name"); return; }
        
        const selectedMonths = Array.from(selectedMonthsSet);
        if (selectedMonths.length === 0) {
            alert("Please select at least one month sheet");
            return;
        }
        
        setLoading(true);
        
        // Check for duplicates in ALL selected months
        let duplicateFound = false;
        let duplicateMonths = [];
        
        for (const month of selectedMonths) {
            const records = await fetchAllRecords(month, yearVal);
            if (isDuplicate(records, roll, classVal)) {
                duplicateFound = true;
                duplicateMonths.push(month);
            }
        }
        
        if (duplicateFound) {
            setLoading(false);
            const monthList = duplicateMonths.join(", ");
            alert(`This records has already exist! Enter new record\n(Duplicate found in: ${monthList})`);
            return;
        }
        
        // No duplicate found - proceed with submission
        // For EACH month, get the current last SN and increment
        let successMonths = [];
        let failedMonths = [];
        
        for (const month of selectedMonths) {
            // Fetch fresh SN for this specific month (ensures correct increment)
            const freshSN = await getLastSNFromColumnA(month, yearVal);
            
            const payload = {
                sn: freshSN,
                roll_no: roll,
                class: classVal,
                name: studentName,
                father_name: fatherNameInput.value || "",
                mother_name: motherNameInput.value || "",
                dob: dobInput.value || "",
                mobile_no: mobileInput.value || "",
                year: yearVal,
                monthSheet: month
            };
            
            const result = await submitToBackend(payload);
            if (result.success) {
                successMonths.push(month);
            } else {
                failedMonths.push(month);
            }
        }
        
        setLoading(false);
        
        if (successMonths.length === selectedMonths.length) {
            alert(`This record successfully entered.\nAdded to: ${successMonths.join(", ")}\nSN auto-incremented from Column A in each sheet.`);
            // Clear form fields except class/year
            rollNoInput.value = "";
            studentNameInput.value = "";
            fatherNameInput.value = "";
            motherNameInput.value = "";
            dobInput.value = "";
            mobileInput.value = "";
            await refreshAutoSN();
            rollNoInput.focus();
        } else if (successMonths.length > 0) {
            alert(`Partial success.\nAdded to: ${successMonths.join(", ")}\nFailed: ${failedMonths.join(", ")}`);
            await refreshAutoSN();
        } else {
            alert(`Submission failed for all months. Please try again.`);
        }
    });
    
    // Delete last row handler (removes last entry and SN will adjust on next add)
    document.getElementById("deleteLastRowBtn").addEventListener("click", async () => {
        if (selectedMonthsSet.size === 0) {
            alert("Select at least one month to delete from");
            return;
        }
        let monthToDelete = null;
        if (selectedMonthsSet.size === 1) {
            monthToDelete = Array.from(selectedMonthsSet)[0];
        } else {
            monthToDelete = prompt(`Selected months: ${Array.from(selectedMonthsSet).join(", ")}.\nEnter month name to delete last row:`);
            if (!monthToDelete || !ALL_MONTHS_LIST.includes(monthToDelete)) {
                alert("Invalid month name");
                return;
            }
        }
        if (!confirm(`⚠️ Delete LAST record from "${monthToDelete}" sheet?\nThis will remove the last row from Column A.`)) return;
        setLoading(true);
        const yearVal = mainYear.value.trim() || getStoredDefaults().defYear;
        const result = await submitToBackend({ action: "deleteLastRow", monthSheet: monthToDelete, year: yearVal });
        setLoading(false);
        if (result.success) {
            alert(`Last row deleted from ${monthToDelete}\nNext SN will be recalculated from remaining rows.`);
            await refreshAutoSN();
        } else {
            alert(`Delete failed: ${result.message}`);
        }
    });
    
    // Clear form handler
    document.getElementById("clearFormBtn").addEventListener("click", () => {
        rollNoInput.value = "";
        studentNameInput.value = "";
        fatherNameInput.value = "";
        motherNameInput.value = "";
        dobInput.value = "";
        mobileInput.value = "";
        const { defClass, defYear } = getStoredDefaults();
        mainClass.value = defClass;
        mainYear.value = defYear;
        refreshAutoSN();
    });
    
    // Factory reset
    document.getElementById("factoryResetDefaultsBtn").addEventListener("click", () => {
        localStorage.setItem(STORAGE_DEF_CLASS, FALLBACK_CLASS);
        localStorage.setItem(STORAGE_DEF_YEAR, FALLBACK_YEAR);
        syncDefaultsToForm();
        refreshAutoSN();
    });
    
    document.getElementById("selectAllMonthsBtn").addEventListener("click", selectAllMonths);
    document.getElementById("deselectAllMonthsBtn").addEventListener("click", deselectAllMonths);
    
    async function init() {
        loadStoredMonthSelections();
        syncDefaultsToForm();
        await refreshAutoSN();
    }
    
    init();
</script>
</body>
</html>
