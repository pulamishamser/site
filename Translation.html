    <!-- Translation core: dynamic language selectors for source and target -->

<script>
    (function() {
        // DOM elements
        const sourceTextarea = document.getElementById('sourceText');
        const targetTextarea = document.getElementById('targetText');
        const translateBtn = document.getElementById('translateBtn');
        const resetBtn = document.getElementById('resetBtn');
        const copyBtn = document.getElementById('copyBtn');
        const swapBtn = document.getElementById('swapLangBtn');
        const charCountSpan = document.getElementById('charCount');
        
        // language select elements
        const sourceLangSelect = document.getElementById('sourceLangSelect');
        const targetLangSelect = document.getElementById('targetLangSelect');
        const sourceFlagSpan = document.getElementById('sourceFlag');
        const targetFlagSpan = document.getElementById('targetFlag');

        // helper: update flag icons based on selected language
        function updateFlags() {
            const sourceVal = sourceLangSelect.value;
            const targetVal = targetLangSelect.value;
            sourceFlagSpan.textContent = sourceVal === 'en' ? '🇬🇧' : '🇳🇵';
            targetFlagSpan.textContent = targetVal === 'en' ? '🇬🇧' : '🇳🇵';
        }

        // update character counter
        function updateCounter() {
            charCountSpan.innerText = sourceTextarea.value.length;
        }
        sourceTextarea.addEventListener('input', updateCounter);

        // reset fields (clear both textareas)
        function resetFields() {
            sourceTextarea.value = '';
            targetTextarea.value = '';
            updateCounter();
        }

        // Core translation function: respects source & target dropdowns (EN<->NE fully)
        async function translateText() {
            let textToTranslate = sourceTextarea.value.trim();
            if (!textToTranslate) {
                targetTextarea.value = '⚠️ Please enter some text to translate.';
                return;
            }
            
            // get selected languages (ISO codes)
            let sourceLang = sourceLangSelect.value;   // 'en' or 'ne'
            let targetLang = targetLangSelect.value;   // 'en' or 'ne'
            
            // if source and target are same, show warning
            if (sourceLang === targetLang) {
                targetTextarea.value = '⚠️ Source and target languages are the same. Please select different languages or use swap.';
                return;
            }
            
            // show loading state
            targetTextarea.value = '🔄 Translating...';
            
            try {
                // using Google Translate public endpoint (no API key required for basic usage)
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(textToTranslate)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                let translatedText = '';
                if (data && data[0] && Array.isArray(data[0])) {
                    for (let segment of data[0]) {
                        if (segment && segment[0]) translatedText += segment[0];
                    }
                } else {
                    translatedText = '⚠️ Translation result unavailable. Please try again.';
                }
                targetTextarea.value = translatedText || '⚠️ No translation returned.';
            } catch (error) {
                console.error('Translation error:', error);
                targetTextarea.value = '❌ Network error. Please check your connection and try again.';
            }
        }

        // swap languages: exchange source/target dropdown values + exchange text content
        function swapLanguages() {
            // swap selected values between source and target selects
            const currentSourceLang = sourceLangSelect.value;
            const currentTargetLang = targetLangSelect.value;
            sourceLangSelect.value = currentTargetLang;
            targetLangSelect.value = currentSourceLang;
            
            // update flags UI
            updateFlags();
            
            // also swap textarea contents (optional but user-friendly)
            const sourceText = sourceTextarea.value;
            const targetText = targetTextarea.value;
            sourceTextarea.value = targetText;
            targetTextarea.value = sourceText;
            updateCounter();
            
            // update placeholder based on new source language
            updateSourcePlaceholder();
        }
        
        // update placeholder text according to source language selected
        function updateSourcePlaceholder() {
            const srcLang = sourceLangSelect.value;
            if (srcLang === 'en') {
                sourceTextarea.placeholder = 'Type English text here ... (e.g., Where is the temple?)';
            } else {
                sourceTextarea.placeholder = 'नेपालीमा लेख्नुहोस् ... (उदाहरण: तपाईंलाई कस्तो छ?)';
            }
        }
        
        // copy translated text to clipboard
        async function copyTranslation() {
            const translation = targetTextarea.value;
            if (!translation || translation === '' || translation.startsWith('⚠️') || translation.startsWith('🔄')) {
                alert('No valid translation to copy. Translate something first.');
                return;
            }
            try {
                await navigator.clipboard.writeText(translation);
                alert('✅ Translation copied to clipboard!');
            } catch (err) {
                alert('Could not copy. Select text manually.');
            }
        }
        
        // event listeners for language select changes: update flags & placeholder
        sourceLangSelect.addEventListener('change', () => {
            updateFlags();
            updateSourcePlaceholder();
            // optional: clear target when source language changes? preserve but not required
        });
        targetLangSelect.addEventListener('change', updateFlags);
        
        // main button events
        translateBtn.addEventListener('click', translateText);
        resetBtn.addEventListener('click', resetFields);
        copyBtn.addEventListener('click', copyTranslation);
        swapBtn.addEventListener('click', swapLanguages);
        
        // initial char count
        updateCounter();
        updateFlags();
        updateSourcePlaceholder();
        
        // set initial target hint text
        targetTextarea.value = '✨ Translation will appear here.';
        
        // optional: Ctrl+Enter trigger translate
        sourceTextarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                translateText();
            }
        });
        
        // external links (keep header functional)
        const homeLink = document.getElementById('homeLink');
        const typingLink = document.getElementById('typingLink');
        const fontsLink = document.getElementById('fontsLink');
        
        if (homeLink) {
            homeLink.addEventListener('click', (e) => {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
        if (typingLink) {
            typingLink.addEventListener('click', (e) => {
                e.preventDefault();
                window.open('https://www.atoznepal.info/type-nepali', '_blank');
            });
        }
        if (fontsLink) {
            fontsLink.addEventListener('click', (e) => {
                e.preventDefault();
                window.open('https://www.easynepalityping.com/nepali-fonts-download', '_blank');
            });
        }
    })();
</script>
