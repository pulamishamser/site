    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #eef2f7;
            font-family: 'Nirmala UI', 'Segoe UI', 'Times New Roman', serif;
            padding: 20px 16px;
        }
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }
        /* form card */
        .form-card {
            background: white;
            border-radius: 32px;
            padding: 28px 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            margin-bottom: 40px;
        }
        h1 {
            color: #0b3552;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .sub {
            color: #2c5a7a;
            margin-bottom: 24px;
            border-left: 4px solid #2c74b3;
            padding-left: 18px;
        }
        /* dropdown + orientation note row */
        .layout-dropdown-area {
            background: #f0f6fe;
            padding: 10px 14px;
            border-radius: 38px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .dropdown-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .dropdown-group label {
            font-weight: 700;
            color: #0b3552;
            font-size: 0.8rem;
        }
        #layoutSelect {
            background: white;
            border: 2px solid #cbdde9;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            color: #1f6390;
            outline: none;
            transition: 0.2s;
        }
        #layoutSelect:hover {
            border-color: #2c74b3;
        }
        .orientation-badge {
            background: #e6f0fa;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #113855;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* form grids */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field label {
            font-weight: 700;
            color: #1e3a5f;
        }
        input, textarea {
            padding: 12px 16px;
            border: 1.5px solid #d4e0ec;
            border-radius: 28px;
            font-family: inherit;
            transition: 0.15s;
        }
        textarea {
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #2c74b3;
            box-shadow: 0 0 0 3px rgba(44,116,179,0.2);
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary { background: #1f6390; color: white; }
        .btn-primary:hover { background: #0f4b6e; transform: translateY(-2px);}
        .btn-pdf { background: #6a3e8a; color: white; }
        .btn-pdf:hover { background: #4f2c68; transform: translateY(-2px);}
        .btn-print { background: #1e7b4b; color: white; }
        .btn-clear { background: #b13e32; color: white; }
        /* output container */
        #outputContainer {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* ========== LETTER STYLES (A4) ========== */
        /* single letter portrait */
        .page-portrait {
            width: 210mm;
            height: 297mm;
            background: white;
            margin: 0 auto 25px auto;
            padding: 20mm 18mm;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            border-radius: 4px;
            box-sizing: border-box;
            page-break-after: always;
            font-family: 'Times New Roman', 'Nirmala UI', serif;
            display: flex;
            flex-direction: column;
        }
        /* two letters per page (landscape) */
        .page-landscape-two {
            width: 297mm;
            height: 210mm;
            background: white;
            margin: 0 auto 25px auto;
            padding: 12mm 12mm;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            border-radius: 4px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            gap: 12mm;
            page-break-after: always;
        }
        .letter-half {
            width: calc(50% - 6mm);
            height: calc(100% - 0mm);
            display: flex;
            flex-direction: column;
            border-right: 1px dashed #ccc;
            padding-right: 8mm;
            box-sizing: border-box;
        }
        .letter-half:last-child {
            border-right: none;
            padding-right: 0;
        }
        /* four letters per page (landscape) */
        .page-landscape-four {
            width: 297mm;
            height: 210mm;
            background: white;
            margin: 0 auto 25px auto;
            padding: 8mm 8mm;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 6mm;
            page-break-after: always;
        }
        .letter-quarter {
            width: calc(50% - 3mm);
            height: calc(50% - 3mm);
            display: flex;
            flex-direction: column;
            border: 1px solid #e9eef3;
            padding: 5mm 6mm;
            box-sizing: border-box;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        /* shared letter inner styles */
        .letter-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .org-logo {
            max-height: 45px;
            max-width: 70px;
            object-fit: contain;
        }
        .org-name {
            font-weight: 800;
            font-size: 16pt;
            color: #003057;
            line-height: 1.2;
        }
        .address-container {
            text-align: center;
            margin: 3px 0 8px;
            border-bottom: 1px dashed #9bb8da;
            padding-bottom: 4px;
        }
        .address-line1 { font-weight: 600; font-size: 11pt; }
        .address-line2 { font-size: 10pt; color: #2c5a7a; }
        .meta-line {
            display: flex;
            justify-content: space-between;
            font-size: 8pt;
            margin: 5px 0 6px;
            border-bottom: 1px dotted #a4c2dd;
            padding-bottom: 3px;
        }
        .recipient-line {
            font-weight: 700;
            font-size: 10pt;
            margin: 6px 0 4px;
            background: #f4f9ff;
            padding: 6px 10px;
            border-radius: 20px;
            white-space: normal;
            word-break: break-word;
        }
        .subject {
            font-weight: bold;
            border-left: 5px solid #2c74b3;
            padding-left: 10px;
            margin: 8px 0 10px;
            font-size: 10pt;
        }
        .body {
            font-size: 9.5pt;
            line-height: 1.5;
            text-align: justify;
            flex: 1;
            margin: 5px 0 8px;
            overflow-y: auto;
        }
        .signature-area {
            text-align: right;
            margin-top: 8px;
            border-top: 1px dotted #ccc;
            padding-top: 6px;
        }
        .signature-img {
            max-height: 45px;
            max-width: 100px;
        }
        .footer {
            text-align: center;
            font-size: 7.5pt;
            border-top: 1px solid #cbdde9;
            padding-top: 5px;
            margin-top: 6px;
        }
        .footer-content {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        @media print {
            body * { visibility: hidden; }
            #outputContainer, #outputContainer * { visibility: visible; }
            #outputContainer { position: absolute; top: 0; left: 0; width: 100%; }
            .page-portrait, .page-landscape-two, .page-landscape-four {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
            }
        }
        @media (max-width: 700px) {
            .page-portrait { width: 100%; padding: 12mm; }
            .page-landscape-two, .page-landscape-four { width: 100%; flex-direction: column; height: auto; padding: 10mm; }
            .letter-half, .letter-quarter { width: 100%; margin-bottom: 15px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="form-card">

<p >Multi Letter for multi purpose<strong> </p>
           <h1><i class="fas fa-envelope-open-text"></i>Multi Letter generator tool</h1>
        <p class="sub">आवश्यक्ता अनुसारको चिट्ठीपत्र तयार पार्ने टुल<strong> </p>

        <!-- ड्रपडाउन लेआउट चयन -->
        <div class="layout-dropdown-area">
            <div class="dropdown-group">
                <label><i class="fas fa-layer-group"></i> पेज छान्नुहोस्:</label>
                <select id="layoutSelect">
                    <option value="one">One Page</option>
                    <option value="two">two Page</option>
                    <option value="four">Four Page</option>
                </select>
            </div>
        </div>

        <!-- फारम फिल्डहरू -->
        <div class="form-grid">
            <div class="field"><label><i class="fas fa-school"></i> विद्यालय / कार्यालय</label><input type="text" id="org" value="श्री डिम जनता माध्यमिक बिद्यालय"></div>
            <div class="field"><label><i class="fas fa-location-dot"></i> ठेगाना लाइन १</label><input type="text" id="address1" value="लालबन्दी-१६, परवानीपुर"></div>
            <div class="field"><label><i class="fas fa-location-dot"></i> ठेगाना लाइन २</label><input type="text" id="address2" value="सर्लाही, नेपाल"></div>
            <div class="field"><label><i class="fas fa-calendar"></i> मिति</label><input type="text" id="letterDate" value="२०८२-१०-१२"></div>
            <div class="field"><label><i class="fas fa-hashtag"></i> पत्र संख्या</label><input type="text" id="letterNo" value="११/०८१-०८२"></div>

            
            <div class="field"><label><i class="fas fa-qrcode"></i> चलानी सं.</label><input type="text" id="refNo" value="६/२०८२ शिक्षा शाखा"></div>
            <div class="field"><label><i class="fas fa-tag"></i> विषय</label><input type="text" id="subject" value="आमन्त्रण बारे"></div>
            <div class="field"><label><i class="fas fa-envelope"></i> इमेल</label><input type="email" id="email" value="info@djmav.edu.np"></div>
            <div class="field"><label><i class="fas fa-phone-alt"></i> मोबाइल</label><input type="text" id="mobile" value="९८४१२३४५६७"></div>
            <div class="field"><label><i class="fas fa-user-tie"></i> पठाउने व्यक्ति</label><input type="text" id="sender" value="ध्रुवबहादुर भण्डारी"></div>
            <div class="field"><label><i class="fas fa-briefcase"></i> पद</label><input type="text" id="position" value="प्रधानाध्यापक"></div>
            <div class="field"><label><i class="fas fa-cloud-upload-alt"></i> लोगो (फाइल)</label><input type="file" id="logoFile" accept="image/*"></div>
            <div class="field"><label><i class="fas fa-link"></i> लोगो URL</label><input type="url" id="logoUrl" placeholder="https://example.com/logo.png"></div>
            <div class="field"><label><i class="fas fa-signature"></i> हस्ताक्षर (छवि)</label><input type="file" id="signatureFile" accept="image/*"></div>
        </div>

        <div class="form-grid">
            <div class="field"><label><i class="fas fa-users"></i> प्रापकहरू (प्रति लाइन एक व्यक्ति/पद)</label><textarea id="receivers" rows="4">मुख्य निर्वाचन अधिकृत, जिल्ला निर्वाचन कार्यालय सर्लाही
शिक्षा शाखा प्रमुख, लालबन्दी नगरपालिका
बासु अधिकारी, नगर प्रमुख लालबन्दी नपा
राम बहादुर स्याङ्तान, व्यवसाय सदस्य
पुष्पराज पौडेल, प्रअ नारायण जनता माबि जियाजोर
जयराज भट्टराई, प्रअ जनता माबि तिनघरे
कमला देवी, महिला सदस्य</textarea></div>
            <div class="field"><label><i class="fas fa-pen-fancy"></i> पत्रको मुख्य भाग ([नाम] प्रयोग गर्नुहोस्)</label><textarea id="body" rows="5">यस संस्थाको यहि मिति २०८२-१२-१५ का दिन हुने वार्षिकोत्सव कार्यक्रममा [नाम] ज्यूको गरिमामय उपस्थितिको हार्दिक अनुरोध गर्दछौं । मिति: २०८१ चैत १५, बिहान ११ बजे । धन्यवाद ।</textarea></div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="generateBtn"><i class="fas fa-bolt"></i> पत्र जेनेरेट गर्नुहोस्</button>
            <button class="btn btn-pdf" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF डाउनलोड</button>
            <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> प्रिन्ट गर्नुहोस्</button>
            <button class="btn btn-clear" onclick="location.reload()"><i class="fas fa-undo-alt"></i> रिसेट गर्नुहोस्</button>
        </div>
    </div>

    <div id="outputContainer"></div>
</div>

<script>
    // current layout: 'one', 'two', 'four'
    let currentLayout = 'one';   // one = portrait, two/four = landscape
    let logoDataUrl = "";
    let signatureDataUrl = "";

    const layoutSelect = document.getElementById('layoutSelect');
    const orientationHintSpan = document.getElementById('orientationHint');

    function updateOrientationHint() {
        const val = layoutSelect.value;
        if (val === 'one') orientationHintSpan.innerText = 'पोर्ट्रेट (ठाडो) - एक पत्र प्रति पृष्ठ';
        else if (val === 'two') orientationHintSpan.innerText = 'ल्याण्डस्केप (तेर्सो) - दुई पत्र प्रति पृष्ठ';
        else orientationHintSpan.innerText = 'ल्याण्डस्केप (तेर्सो) - चार पत्र प्रति पृष्ठ';
    }

    layoutSelect.addEventListener('change', (e) => {
        currentLayout = e.target.value;
        updateOrientationHint();
        // optionally auto-generate after selection? user can click generate button
    });

    // file upload handlers
    document.getElementById('logoFile').addEventListener('change', (e) => {
        if (e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (ev) => { logoDataUrl = ev.target.result; };
            reader.readAsDataURL(e.target.files[0]);
        } else logoDataUrl = "";
    });
    document.getElementById('signatureFile').addEventListener('change', (e) => {
        if (e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (ev) => { signatureDataUrl = ev.target.result; };
            reader.readAsDataURL(e.target.files[0]);
        } else signatureDataUrl = "";
    });

    function getLogoUrl() {
        if (logoDataUrl) return logoDataUrl;
        const urlInput = document.getElementById('logoUrl').value.trim();
        return urlInput || "";
    }

    // Build single letter HTML (reusable)
    function buildLetterHTML(recipientRaw, idx, org, addr1, addr2, date, letterNo, refNo, subjectTxt, sender, position, email, mobile, bodyTemplate, logo, signature) {
        let personalizedBody = bodyTemplate.replace(/\[नाम\]/g, recipientRaw);
        let displayRecipient = recipientRaw;
        if (recipientRaw.includes(',')) {
            displayRecipient = recipientRaw.split(',').map(p => p.trim()).join(',<br>');
        }
        const logoHtml = logo ? `<img src="${logo}" class="org-logo" alt="logo" onerror="this.style.display='none';">` : '';
        const signatureHtml = signature ? `<img src="${signature}" class="signature-img"><br>` : '';
        return `
            <div style="display:flex; flex-direction:column; height:100%;">
                <div class="letter-header">
                    ${logoHtml}
                    <div class="org-name">${org}</div>
                </div>
                <div class="address-container">
                    <div class="address-line1">${addr1}</div>
                    <div class="address-line2">${addr2}</div>
                </div>
                <div class="meta-line">
                    <div><i class="fas fa-hashtag"></i> पत्र सं. : ${letterNo} &nbsp;| <i class="fas fa-qrcode"></i> चलानी : ${refNo}</div>
                    <div><i class="fas fa-calendar-alt"></i> मिति: ${date}</div>
                </div>
                <div class="recipient-line">${displayRecipient}</div>
                <div class="subject">विषय: ${subjectTxt}</div>
                <div class="body">${personalizedBody.replace(/\n/g, '<br>')}</div>
                <div class="signature-area">
                    ${signatureHtml}
                    <div class="sender-name">${sender}</div>
                    <div class="sender-position">${position}</div>
                </div>
                <div class="footer">
                    <div class="footer-content">
                        <span><i class="fas fa-envelope"></i> ${email}</span>
                        <span><i class="fas fa-phone-alt"></i> ${mobile}</span>
                        <span><i class="fas fa-map-marker-alt"></i> ${addr1}</span>
                    </div>
                </div>
            </div>
        `;
    }

    // main generation function using currentLayout from dropdown
    function generateLetters() {
        const org = document.getElementById("org").value.trim() || "श्री डिम जनता माध्यमिक विद्यालय";
        const address1 = document.getElementById("address1").value.trim() || "लालबन्दी-१६, परवानीपुर";
        const address2 = document.getElementById("address2").value.trim() || "सर्लाही, नेपाल";
        const letterDate = document.getElementById("letterDate").value.trim() || "२०८२-१०-१२";
        const letterNo = document.getElementById("letterNo").value.trim() || "११/०८१-०८२";
        const refNo = document.getElementById("refNo").value.trim() || "६/२०८२";
        const subjectTxt = document.getElementById("subject").value.trim() || "आमन्त्रण";
        const sender = document.getElementById("sender").value.trim() || "ध्रुवबहादुर भण्डारी";
        const position = document.getElementById("position").value.trim() || "प्रधानाध्यापक";
        const email = document.getElementById("email").value.trim() || "info@djmav.edu.np";
        const mobile = document.getElementById("mobile").value.trim() || "९८४१२३४५६७";
        const bodyTemplate = document.getElementById("body").value || "सम्मानित [नाम] ज्यू, कृपया उपस्थित हुनुहोला ।";
        const receiversRaw = document.getElementById("receivers").value;
        let receivers = receiversRaw.split("\n").map(r => r.trim()).filter(r => r !== "");
        if (receivers.length === 0) receivers = ["प्रापकको नाम थप्नुहोस्"];

        const finalLogo = getLogoUrl();
        const finalSignature = signatureDataUrl;

        const outputDiv = document.getElementById("outputContainer");
        outputDiv.innerHTML = "";

        // Layout logic based on currentLayout (one / two / four)
        if (currentLayout === 'one') {
            // PORTRAIT mode: each letter separate A4 portrait page
            receivers.forEach((rec, idx) => {
                const letterHTML = buildLetterHTML(rec, idx, org, address1, address2, letterDate, letterNo, refNo, subjectTxt, sender, position, email, mobile, bodyTemplate, finalLogo, finalSignature);
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-portrait';
                pageDiv.innerHTML = letterHTML;
                outputDiv.appendChild(pageDiv);
            });
        } 
        else if (currentLayout === 'two') {
            // LANDSCAPE two letters per page (half width each)
            const total = receivers.length;
            for (let i = 0; i < total; i += 2) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-landscape-two';
                // first letter
                const firstHTML = buildLetterHTML(receivers[i], i, org, address1, address2, letterDate, letterNo, refNo, subjectTxt, sender, position, email, mobile, bodyTemplate, finalLogo, finalSignature);
                const leftCol = document.createElement('div');
                leftCol.className = 'letter-half';
                leftCol.innerHTML = firstHTML;
                pageDiv.appendChild(leftCol);
                // second letter if exists
                if (i+1 < total) {
                    const secondHTML = buildLetterHTML(receivers[i+1], i+1, org, address1, address2, letterDate, letterNo, refNo, subjectTxt, sender, position, email, mobile, bodyTemplate, finalLogo, finalSignature);
                    const rightCol = document.createElement('div');
                    rightCol.className = 'letter-half';
                    rightCol.innerHTML = secondHTML;
                    pageDiv.appendChild(rightCol);
                } else {
                    // empty placeholder for symmetry
                    const emptyCol = document.createElement('div');
                    emptyCol.className = 'letter-half';
                    emptyCol.style.opacity = '0.3';
                    emptyCol.style.borderRight = 'none';
                    emptyCol.innerHTML = '<div style="text-align:center; margin-top:30%; color:#aaa;"><i class="fas fa-minus-circle"></i> खाली स्थान</div>';
                    pageDiv.appendChild(emptyCol);
                }
                outputDiv.appendChild(pageDiv);
            }
        }
        else if (currentLayout === 'four') {
            // LANDSCAPE four letters per page (2x2 grid)
            const total = receivers.length;
            for (let i = 0; i < total; i += 4) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-landscape-four';
                const slots = [0,1,2,3];
                for (let s = 0; s < 4; s++) {
                    const idx = i + s;
                    const card = document.createElement('div');
                    card.className = 'letter-quarter';
                    if (idx < total) {
                        const letterHtml = buildLetterHTML(receivers[idx], idx, org, address1, address2, letterDate, letterNo, refNo, subjectTxt, sender, position, email, mobile, bodyTemplate, finalLogo, finalSignature);
                        card.innerHTML = letterHtml;
                    } else {
                        // filler for empty slots
                        card.style.background = "#fafcff";
                        card.style.opacity = "0.4";
                        card.style.justifyContent = "center";
                        card.innerHTML = "<div style='text-align:center; color:#8ba0bc;'><i class='fas fa-ban'></i><br/>खाली</div>";
                    }
                    pageDiv.appendChild(card);
                }
                outputDiv.appendChild(pageDiv);
            }
        }
    }

    // PDF generation using html2canvas for all pages (respects orientation)
    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const pages = document.querySelectorAll("#outputContainer .page-portrait, #outputContainer .page-landscape-two, #outputContainer .page-landscape-four");
        if (pages.length === 0) {
            alert("कृपया पहिला पत्र जेनेरेट गर्नुहोस् (Generate बटन) ।");
            return;
        }

        let pdf = null;
        for (let i = 0; i < pages.length; i++) {
            const pageElem = pages[i];
            let orientation = 'p';
            let widthMm = 210, heightMm = 297;
            if (pageElem.classList.contains('page-landscape-two') || pageElem.classList.contains('page-landscape-four')) {
                orientation = 'l';
                widthMm = 297;
                heightMm = 210;
            }
            if (!pdf) {
                pdf = new jsPDF({ orientation: orientation, unit: 'mm', format: [widthMm, heightMm] });
            } else {
                pdf.addPage([widthMm, heightMm], orientation);
            }
            try {
                const canvas = await html2canvas(pageElem, { scale: 2.2, backgroundColor: '#ffffff', useCORS: true, logging: false });
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                pdf.addImage(imgData, 'JPEG', 0, 0, widthMm, heightMm, undefined, 'FAST');
            } catch (err) {
                console.error("Canvas error", err);
            }
        }
        if (pdf) pdf.save("multi_letters.pdf");
        else alert("PDF जेनरेट असफल");
    }

    // event binding
    document.getElementById("generateBtn").addEventListener("click", generateLetters);
    document.getElementById("pdfBtn").addEventListener("click", downloadPDF);
    
    // initial load: set hint and generate demo letters
    window.addEventListener("DOMContentLoaded", () => {
        updateOrientationHint();
        generateLetters();   // default 'one' से डेमो जेनेरेट
    });
</script>
