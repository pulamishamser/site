<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📊 Attendance Reports </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 24px 20px; }
    .dashboard-container { max-width: 1600px; margin: 0 auto; }
    .card { background: white; border-radius: 28px; box-shadow: 0 12px 28px rgba(0,0,0,0.08); padding: 20px 24px 28px; margin-bottom: 28px; }
    h2 { font-size: 1.7rem; font-weight: 600; margin: 0 0 6px 0; background: linear-gradient(135deg, #1e3c72, #2b3b5c); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .subhead { color: #5a6874; margin-bottom: 24px; border-left: 4px solid #3b82f6; padding-left: 14px; font-size: 0.9rem; }
    .school-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: 24px; padding: 16px 24px; margin-bottom: 24px; text-align: center; }
    .school-name { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .school-address { font-size: 0.85rem; opacity: 0.85; }
    .message-area { padding: 12px 20px; border-radius: 60px; margin-bottom: 20px; font-weight: 500; display: none; }
    .message-success { background: #dcfce7; color: #166534; border-left: 5px solid #22c55e; }
    .message-error { background: #fee2e2; color: #991b1b; border-left: 5px solid #ef4444; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; background: #f8fafc; padding: 18px 20px; border-radius: 32px; margin-bottom: 28px; border: 1px solid #e2edf2; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
    .filter-group label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #2c3e66; }
    select, input, button { padding: 10px 14px; border-radius: 60px; border: 1px solid #cbd5e1; background: white; font-size: 0.85rem; outline: none; transition: 0.15s; }
    button { background: #1e293b; color: white; font-weight: 600; border: none; cursor: pointer; padding: 10px 28px; }
    button:hover { background: #0f172a; transform: translateY(-1px); }
    .action-buttons { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
    .btn-print { background: #2c5f2d; }
    .btn-pdf { background: #b22234; }
    .btn-update { background: #0f5c6b; }
    .btn-update-all { background: #8b5cf6; }
    .table-wrapper { overflow-x: auto; border-radius: 20px; border: 1px solid #e9eef3; background: white; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #f1f5f9; color: #0f2b3d; font-weight: 700; padding: 14px 12px; border-bottom: 1px solid #dce5ec; text-align: left; }
    td { padding: 12px 12px; border-bottom: 1px solid #ecf3f9; }
    tr:hover td { background-color: #fafcff; }
    .present-badge { background: #d1fae5; color: #065f46; font-weight: 600; padding: 4px 12px; border-radius: 40px; display: inline-block; font-size: 0.75rem; }
    .absent-badge { background: #ffe4e2; color: #9b2c1d; font-weight: 600; padding: 4px 12px; border-radius: 40px; display: inline-block; font-size: 0.75rem; }
    .holiday-badge { background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 40px; display: inline-block; font-size: 0.75rem; }
    .stats-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 24px; border-radius: 20px; margin-bottom: 20px; }
    .error-message { background: #fff1f0; border-left: 6px solid #e11d48; color: #b91c1c; padding: 14px 20px; border-radius: 24px; font-weight: 500; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media print { .filter-bar, .action-buttons, button, .no-print { display: none !important; } }
    @media (max-width: 780px) { .filter-bar { flex-direction: column; } .action-buttons { margin-left: 0; flex-direction: column; } }
    .family-detail { font-size: 0.7rem; color: #5a6874; margin-top: 2px; }
  </style>
</head>
<body>
<div class="dashboard-container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
      <div><h2>📋 Attendance Reports</h2><div class="subhead"></div></div>
      <div style="background: #e6f0ff; border-radius: 30px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600;">📞 Data from Col E-H</div>
    </div>
    <div id="globalMessage" class="message-area"></div>

    <div class="filter-bar">
      <div class="filter-group"><label>REPORT TYPE</label><select id="reportTypeSelect"><option value="daily">Daily</option><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select></div>
      <div class="filter-group"><label>SCOPE</label><select id="scopeSelect"><option value="whole">Whole Class</option><option value="individual">Individual</option></select></div>
      <div class="filter-group"><label>YEAR</label><input type="number" id="yearSelect" value="2081"></div>
      <select id="classSelect" class="filter-group">
        <optgroup label="General"><option value="ECD">ECD</option><option value="PG">PG</option><option value="Nursary">Nursary</option><option value="LKG">LKG</option><option value="UKG">UKG</option></optgroup>
        <optgroup label="Grade"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option><option value="9">9</option><option value="10">10</option></optgroup>
        <optgroup label="English Medium"><option value="1EM">1EM</option><option value="2EM">2EM</option><option value="3EM">3EM</option><option value="4EM">4EM</option><option value="5EM">5EM</option><option value="6EM">6EM</option><option value="7EM">7EM</option><option value="8EM">8EM</option><option value="9EM">9EM</option><option value="10EM">10EM</option></optgroup>
      </select>
      <div class="filter-group" id="individualRollGroup" style="display:none"><label>Roll No</label><input type="text" id="rollNoInput" placeholder="Roll No"></div>
      <div class="filter-group" id="monthGroup"><label>MONTH</label><select id="monthSelect"><option value="Baisakh">Baisakh</option><option value="Jeshtha">Jeshtha</option><option value="Ashad">Ashad</option><option value="Shrawan">Shrawan</option><option value="Bhadra">Bhadra</option><option value="Ashwin">Ashwin</option><option value="Kartik">Kartik</option><option value="Mangsir">Mangsir</option><option value="Poush">Poush</option><option value="Magh">Magh</option><option value="Falgun">Falgun</option><option value="Chaitra">Chaitra</option></select></div>
      <div class="filter-group" id="dailyDateGroup"><label>DAY</label><input type="number" id="dailyDayInput" value="1" min="1" max="32"></div>
      <div class="filter-group" id="weeklyStartGroup" style="display:none"><label>START DAY</label><input type="number" id="startDayInput" value="1"></div>
      <div class="filter-group" id="weeklyEndGroup" style="display:none"><label>END DAY</label><input type="number" id="endDayInput" value="7"></div>
      <div class="filter-group"><button id="generateBtn">⟳ Generate</button><button id="resetBtn">🔄 Reset</button></div>
      <div class="action-buttons"><button id="printReportBtn" class="btn-print">🖨️ Print</button><button id="downloadPdfBtn" class="btn-pdf">📄 PDF</button></div>
    </div>
    <div id="reportContainer"><div class="stats-card" style="text-align:center;">📋 Select filters & click Generate</div></div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby62jfVZtdToZ4WWMM-YLucneFpN8K_JN77-OBpmgGn52urnExBhS99oouHVuY-qMdPdA/exec"; // UPDATE THIS
  let currentSchoolInfo = { schoolName: "", schoolAddress: "" };
  let lastGeneratedHTML = "";
  let lastReportTitle = "";
  let studentDetailsCache = new Map();

  function showMessage(msg, type) {
    const div = document.getElementById('globalMessage');
    div.textContent = msg;
    div.className = `message-area message-${type}`;
    div.style.display = "block";
    setTimeout(() => div.style.display = "none", 4000);
  }

  async function callAPI(action, payload, timeout = 15000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const params = new URLSearchParams({ action, ...payload }).toString();
      const res = await fetch(APPS_SCRIPT_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params,
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch(err) {
      clearTimeout(timeoutId);
      throw err;
    }
  }

  function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

  async function fetchStudentDetails(classVal, year) {
    const cacheKey = `${classVal}_${year}`;
    if (studentDetailsCache.has(cacheKey)) return studentDetailsCache.get(cacheKey);
    try {
      const result = await callAPI('getStudentExtendedList', { year, class: classVal }, 8000);
      const map = new Map();
      if (result.success && result.data) {
        result.data.forEach(s => map.set(String(s.rollNo), s));
      }
      studentDetailsCache.set(cacheKey, map);
      return map;
    } catch(e) {
      console.warn("Failed to fetch student details:", e);
      return new Map();
    }
  }

  function enrichWithFamilyDetails(rows, detailsMap) {
    if (!rows) return rows;
    return rows.map(row => {
      const roll = String(row.rollNo || row.SBL_No || '');
      const info = detailsMap.get(roll) || {};
      return { ...row, fatherName: info.fatherName || '', motherName: info.motherName || '', dob: info.dob || '', mobile: info.mobile || '' };
    });
  }

  function buildDailyHTML(data, filters, detailsMap) {
    let report = data.report || [];
    if (!report.length) return '<div class="error-message">⚠️ No data found</div>';
    const enriched = enrichWithFamilyDetails(report, detailsMap);
    let html = `<div class="stats-card"><strong>📅 Daily Report</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>${filters.month} Day ${filters.dayNum} | ${filters.year} | Class: ${filters.class}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>SN</th><th>Roll</th><th>Name</th><th>👨 Father</th><th>👩 Mother</th><th>🎂 DOB</th><th>📞 Mobile</th><th>Status</th></tr></thead><tbody>`;
    enriched.forEach(r => {
      let status = r.status || 'अनुपस्थित';
      let cls = status === 'उपस्थित' ? 'present-badge' : (status === 'सार्वजनिक बिदा' ? 'holiday-badge' : 'absent-badge');
      html += `<tr><td>${r.sn}</td><td>${r.rollNo}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.fatherName)}</td><td>${escapeHtml(r.motherName)}</td><td>${escapeHtml(r.dob)}</td><td>${escapeHtml(r.mobile)}</td><td><span class="${cls}">${status}</span></td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  function buildMonthlyHTML(data, filters, detailsMap) {
    let report = data.report || [];
    if (!report.length) return '<div class="error-message">⚠️ No data found</div>';
    const enriched = enrichWithFamilyDetails(report, detailsMap);
    let html = `<div class="stats-card"><strong>📊 Monthly Report</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>${filters.month} ${filters.year} | Class: ${filters.class}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>SN</th><th>Roll</th><th>Name</th><th>Father</th><th>Mother</th><th>DOB</th><th>Mobile</th><th>Present</th><th>Absent</th><th>Closed</th></tr></thead><tbody>`;
    enriched.forEach(r => {
      html += `<tr><td>${r.sn}</td><td>${r.rollNo}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.fatherName)}</td><td>${escapeHtml(r.motherName)}</td><td>${escapeHtml(r.dob)}</td><td>${escapeHtml(r.mobile)}</td><td><strong>${r.totalPresent}</strong></td><td>${r.totalAbsent}</td><td>${r.totalClosed}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  function buildWeeklyHTML(data, filters, detailsMap) {
    let report = data.report || [];
    const enriched = enrichWithFamilyDetails(report, detailsMap);
    let html = `<div class="stats-card"><strong>📆 Weekly Report</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>${filters.month} Days ${filters.startDay}-${filters.endDay}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>SN</th><th>Roll</th><th>Name</th><th>Father</th><th>Mother</th><th>DOB</th><th>Mobile</th><th>Present</th><th>Absent</th><th>Closed</th></tr></thead><tbody>`;
    enriched.forEach(r => {
      html += `<tr><td>${r.sn}</td><td>${r.rollNo}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.fatherName)}</td><td>${escapeHtml(r.motherName)}</td><td>${escapeHtml(r.dob)}</td><td>${escapeHtml(r.mobile)}</td><td><strong>${r.totalPresent}</strong></td><td>${r.totalAbsent}</td><td>${r.totalClosed}</td></tr>`;
    });
    html += `</tbody><tr></div>`;
    return html;
  }

  async function generateReport() {
    const rType = document.getElementById('reportTypeSelect').value;
    const scope = document.getElementById('scopeSelect').value;
    const month = document.getElementById('monthSelect').value;
    const rollNo = document.getElementById('rollNoInput').value.trim();
    const year = document.getElementById('yearSelect').value.trim();
    const classVal = document.getElementById('classSelect').value.trim();
    const container = document.getElementById('reportContainer');
    
    container.innerHTML = `<div class="stats-card" style="text-align:center;"><span class="loading-spinner"></span> Loading report with parent details...</div>`;
    document.getElementById('generateBtn').disabled = true;
    
    try {
      const detailsMap = await fetchStudentDetails(classVal, year);
      currentSchoolInfo.schoolName = "Shree Janakalyan Secondary School";
      currentSchoolInfo.schoolAddress = "Nepal";
      
      let result, html = "";
      const filters = { year, class: classVal, month };
      
      if (rType === 'daily') {
        const dayNum = parseInt(document.getElementById('dailyDayInput').value);
        let payload = { year, class: classVal, month, date: `${month} ${dayNum}` };
        if (scope === 'individual' && rollNo) payload.rollNo = rollNo;
        result = await callAPI('getDailyReport', payload, 10000);
        html = buildDailyHTML(result.data, { ...filters, dayNum }, detailsMap);
        lastReportTitle = `Daily_${month}_${dayNum}`;
      }
      else if (rType === 'monthly') {
        let payload = { year, class: classVal, month };
        if (scope === 'individual' && rollNo) payload.rollNo = rollNo;
        result = await callAPI('getMonthlyReport', payload, 10000);
        html = buildMonthlyHTML(result.data, filters, detailsMap);
        lastReportTitle = `Monthly_${month}`;
      }
      else if (rType === 'weekly') {
        const startDay = parseInt(document.getElementById('startDayInput').value);
        const endDay = parseInt(document.getElementById('endDayInput').value);
        let payload = { year, class: classVal, month, startDate: `${month} ${startDay}`, endDate: `${month} ${endDay}` };
        if (scope === 'individual' && rollNo) payload.rollNo = rollNo;
        result = await callAPI('getWeeklyReport', payload, 10000);
        html = buildWeeklyHTML(result.data, { ...filters, startDay, endDay }, detailsMap);
        lastReportTitle = `Weekly_${month}_${startDay}-${endDay}`;
      }
      else if (rType === 'yearly') {
        if (scope === 'individual' && rollNo) {
          result = await callAPI('getYearlyReport', { year, class: classVal, rollNo }, 10000);
          if (result.success) {
            const info = detailsMap.get(String(rollNo)) || {};
            html = `<div class="stats-card"><strong>📅 Yearly Report</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>Roll: ${rollNo} | ${result.data.studentName || info.name}<br>👨 Father: ${escapeHtml(info.fatherName)} | 👩 Mother: ${escapeHtml(info.motherName)}<br>🎂 DOB: ${escapeHtml(info.dob)} | 📞 Mobile: ${escapeHtml(info.mobile)}</div>`;
            html += `<div class="table-wrapper"><table><thead><tr><th>Month</th><th>Present</th><th>Absent</th><th>Closed</th></tr></thead><tbody>`;
            (result.data.yearlyData || []).forEach(d => {
              html += `<tr><td><strong>${d.month}</strong></td><td>${d.totalPresent}</td><td>${d.totalAbsent}</td><td>${d.totalClosed}</td></tr>`;
            });
            html += `<tr style="background:#f3f4f6;"><td><strong>TOTAL</strong></td><td><strong>${result.data.totalPresent}</strong></td><td><strong>${result.data.totalAbsent}</strong></td><td><strong>${result.data.totalClosed}</strong></td></tr>`;
            html += `</tbody></table></div>`;
          }
        } else {
          html = `<div class="stats-card"><strong>📈 Yearly Class Summary</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>Year: ${year} | Class: ${classVal}</div>
          <div class="table-wrapper"><table><thead><tr><th>Roll</th><th>Name</th><th>Father</th><th>Mother</th><th>DOB</th><th>Mobile</th></tr></thead><tbody>`;
          for (let [roll, info] of detailsMap) {
            html += `<tr><td>${escapeHtml(roll)}</td><td>${escapeHtml(info.name)}</td><td>${escapeHtml(info.fatherName)}</td><td>${escapeHtml(info.motherName)}</td><td>${escapeHtml(info.dob)}</td><td>${escapeHtml(info.mobile)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }
        lastReportTitle = `Yearly_${classVal}`;
      }
      
      container.innerHTML = `<div class="school-header no-print"><div class="school-name">${escapeHtml(currentSchoolInfo.schoolName)}</div><div class="school-address">📞 Data Source: Column E (Father), F (Mother), G (DOB), H (Mobile)</div></div>${html}`;
      lastGeneratedHTML = container.innerHTML;
      showMessage("✅ Report generated with parent details from columns E-H", "success");
    } catch(err) {
      container.innerHTML = `<div class="error-message">❌ ${err.message}</div>`;
      showMessage(err.message, "error");
    } finally {
      document.getElementById('generateBtn').disabled = false;
    }
  }

  function printReport() {
    if (!lastGeneratedHTML) { showMessage("Generate report first", "error"); return; }
    const win = window.open('', '_blank');
    win.document.write(`<html><head><title>Attendance Report</title><style>${document.querySelector('style').innerHTML} .filter-bar, .action-buttons, button, .no-print { display: none !important; }</style></head><body>${lastGeneratedHTML}</body></html>`);
    win.document.close();
    win.print();
  }

  async function downloadPDF() {
    if (!lastGeneratedHTML) { showMessage("Generate report first", "error"); return; }
    const container = document.createElement('div');
    container.innerHTML = lastGeneratedHTML;
    const opt = { margin: [0.5,0.5,0.5,0.5], filename: `${lastReportTitle}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
    try { await html2pdf().set(opt).from(container).save(); showMessage("PDF saved", "success"); } 
    catch(e) { showMessage("PDF error", "error"); }
  }

  function updateDynamicFields() {
    const rType = document.getElementById('reportTypeSelect').value;
    const scope = document.getElementById('scopeSelect').value;
    document.getElementById('monthGroup').style.display = rType === 'yearly' ? 'none' : 'flex';
    document.getElementById('individualRollGroup').style.display = scope === 'individual' ? 'flex' : 'none';
    document.getElementById('dailyDateGroup').style.display = rType === 'daily' ? 'flex' : 'none';
    const weeklyVis = rType === 'weekly';
    document.getElementById('weeklyStartGroup').style.display = weeklyVis ? 'flex' : 'none';
    document.getElementById('weeklyEndGroup').style.display = weeklyVis ? 'flex' : 'none';
  }

  document.getElementById('reportTypeSelect').addEventListener('change', updateDynamicFields);
  document.getElementById('scopeSelect').addEventListener('change', updateDynamicFields);
  document.getElementById('generateBtn').addEventListener('click', generateReport);
  document.getElementById('printReportBtn').addEventListener('click', printReport);
  document.getElementById('downloadPdfBtn').addEventListener('click', downloadPDF);
  document.getElementById('resetBtn').addEventListener('click', () => location.reload());
  
  updateDynamicFields();
  generateReport();
</script>
</body>
</html>
