<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Attendance Data Entry Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        }
        body {
            background: linear-gradient(125deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 24px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1350px;
            margin: 0 auto;
        }
        .main-card {
            background: rgba(255,255,255,0.98);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
            backdrop-filter: blur(0px);
            transition: all 0.2s;
        }
        .header {
            background: linear-gradient(105deg, #0f2b4d 0%, #1d4ed8 100%);
            color: white;
            padding: 28px 36px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .header h1 {
            margin: 0 0 6px 0;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            font-weight: 700;
        }
        .header p {
            margin: 0;
            opacity: 0.85;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-body {
            padding: 32px 36px;
        }
        .auto-default-pavilion {
            background: #fefce8;
            border: 1px solid #fde047;
            border-radius: 32px;
            padding: 16px 26px;
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.1);
        }
        .default-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .default-tile {
            background: white;
            border-radius: 60px;
            padding: 5px 18px 5px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #eferc6;
        }
        .default-tile label {
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #854d0e;
            letter-spacing: 0.3px;
        }
        .smart-select, .smart-input-year {
            background: #fffbeb;
            border: 1px solid #fed7aa;
            border-radius: 40px;
            padding: 8px 28px 8px 16px;
            font-weight: 600;
            color: #b45309;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b45309' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }
        .smart-input-year {
            background-image: none;
            width: 90px;
            text-align: center;
            appearance: textfield;
        }
        .reset-default-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 20px;
            border-radius: 34px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
        }
        .reset-default-btn:hover {
            background: #cbd5e1;
            transform: scale(0.97);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 26px 32px;
            margin-bottom: 32px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .field-group label {
            font-weight: 700;
            color: #0f172a;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .field-group label .required-star {
            color: #ef4444;
            margin-left: 4px;
        }
        input, select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: 0.2s;
            background: #ffffff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
        }
        input[readonly] {
            background: #f1f5f9;
            border-color: #cbd5e1;
            font-weight: 500;
            color: #1e293b;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 16px 0 20px 0;
        }
        button {
            border: none;
            border-radius: 48px;
            padding: 11px 28px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-submit {
            background: #0f3b2c;
            background: linear-gradient(95deg, #047857, #10b981);
            color: white;
            box-shadow: 0 5px 12px rgba(4,120,87,0.35);
        }
        .btn-delete {
            background: #b91c1c;
            color: white;
        }
        .btn-reset-form {
            background: #334155;
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.03);
        }
        .message-panel {
            padding: 14px 20px;
            border-radius: 28px;
            margin: 16px 0 0;
            display: none;
            font-weight: 500;
        }
        .msg-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 6px solid #059669;
        }
        .msg-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 6px solid #dc2626;
        }
        .badge-smart {
            background: #d9f99d;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #365314;
        }
        hr {
            margin: 20px 0;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #cbd5e1, transparent);
        }
        @media (max-width: 700px) {
            .form-body { padding: 20px; }
            .default-cluster { flex-direction: column; align-items: stretch; width: 100%; }
            .auto-default-pavilion { flex-direction: column; align-items: stretch; }
        }
        .live-sync-note {
            font-size: 0.7rem;
            margin-top: 16px;
            color: #4b5563;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-card">
        <div class="header">
            <h1>🌼Student Attendance Data Entry Form🌼</h1>
            <p1>Class Year and Month are default. Changing Year class and month instantly updates!</p1>
        </div>
        <div class="form-body">
            <div id="globalToast" class="message-panel"></div>

            <!-- DEFAULTS PAVILION (auto-updates main form in realtime) -->
            <div class="auto-default-pavilion">
                <div class="default-cluster">
                    <div class="default-tile">
                        <label> CLASS</label>
                        <select id="globalDefaultClass" class="smart-select">
                            <optgroup label="General">
                                <option value="ECD">ECD</option>
                                <option value="PG">PG</option>
                                <option value="Nursary">Nursary</option>
                                <option value="LKG">LKG</option>
                                <option value="UKG">UKG</option>
                            </optgroup>
                            <optgroup label="Grade (Nepali)">
                                <option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option>
                                <option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option>
                                <option value="7">Grade 7</option><option value="8" selected>Grade 8</option><option value="9">Grade 9</option>
                                <option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option>
                            </optgroup>
                            <optgroup label="English Medium (EM)">
                                <option value="1EM">Grade 1EM</option><option value="2EM">Grade 2EM</option><option value="3EM">Grade 3EM</option>
                                <option value="4EM">Grade 4EM</option><option value="5EM">Grade 5EM</option><option value="6EM">Grade 6EM</option>
                                <option value="7EM">Grade 7EM</option><option value="8EM">Grade 8EM</option><option value="9EM">Grade 9EM</option>
                                <option value="10EM">Grade 10EM</option><option value="11EM">Grade 11EM</option><option value="12EM">Grade 12EM</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="default-tile">
                        <label>📆 YEAR (BS)</label>
                        <input type="number" id="globalDefaultYear" class="smart-input-year" value="2083" step="1">
                    </div>
                    <div class="default-tile">
                        <label> MONTH</label>
                        <select id="globalDefaultMonth" class="smart-select">
                            <option value="Baisakh"> Baisakh</option><option value="Jeshtha">Jeshtha</option>
                            <option value="Ashad"> Ashad</option><option value="Shrawan"> Shrawan</option>
                            <option value="Bhadra"> Bhadra</option><option value="Ashwin"> Ashwin</option>
                            <option value="Kartik">Kartik</option><option value="Mangsir"> Mangsir</option>
                            <option value="Poush"> Poush</option><option value="Magh"> Magh</option>
                            <option value="Falgun"> Falgun</option><option value="Chaitra"> Chaitra</option>
                        </select>
                    </div>
                </div>
                <button type="button" id="factoryResetDefaultsBtn" class="reset-default-btn">⟳ RESET DEFAULTS (2083 · Grade 8 · Baisakh)</button>
            </div>

            <!-- MAIN DATA ENTRY FORM -->
            <form id="masterStudentForm">
                <div class="form-grid">
                    <div class="field-group">
                        <label>📅 ACADEMIC YEAR <span class="required-star">*</span></label>
                        <input type="text" id="mainYear" placeholder="e.g., 2083" required>
                    </div>
                    <div class="field-group">
                        <label> NEPALI MONTH <span class="required-star">*</span></label>
                        <select id="mainMonth" required>
                            <option value="">-- select month --</option>
                            <option value="Baisakh">Baisakh</option><option value="Jeshtha">Jeshtha</option>
                            <option value="Ashad">Ashad</option><option value="Shrawan">Shrawan</option>
                            <option value="Bhadra">Bhadra</option><option value="Ashwin">Ashwin</option>
                            <option value="Kartik">Kartik</option><option value="Mangsir">Mangsir</option>
                            <option value="Poush">Poush</option><option value="Magh">Magh</option>
                            <option value="Falgun">Falgun</option><option value="Chaitra">Chaitra</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label>🔢 SN <span class="required-star">(Auto)</span></label>
                        <input type="text" id="autoSnField" readonly placeholder="Auto increment">
                    </div>
                    <div class="field-group">
                        <label>📌 ROLL / SBL NO <span class="required-star">*</span></label>
                        <input type="text" id="rollNumber" required placeholder="e.g., 101">
                    </div>
                    <div class="field-group">
                        <label>🏫 CLASS <span class="required-star">*</span></label>
                        <input type="text" id="classMain" required placeholder="Class (auto-sync)">
                    </div>
                    <div class="field-group">
                        <label>👤 FULL NAME <span class="required-star">*</span></label>
                        <input type="text" id="studentFullName" required placeholder="Full name">
                    </div>
                    <div class="field-group">
                        <label>👨 FATHER'S NAME</label>
                        <input type="text" id="fatherName" placeholder="Father's name">
                    </div>
                    <div class="field-group">
                        <label>👩 MOTHER'S NAME</label>
                        <input type="text" id="motherName" placeholder="Mother's name">
                    </div>
                    <div class="field-group">
                        <label>🎂 DATE OF BIRTH</label>
                        <input type="text" id="dobField">
                    </div>
                    <div class="field-group">
                        <label>📞 MOBILE NUMBER</label>
                        <input type="tel" id="mobileContact" placeholder="Contact number">
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn-submit">✅ SUBMIT & SYNC</button>
                    <button type="button" id="deleteLastRowBtn" class="btn-delete">🗑️ DELETE LAST ROW</button>
                    <button type="button" id="clearFormBtn" class="btn-reset-form">🔄 CLEAR FIELDS</button>
                </div>
            </form>
            <div class="live-sync-note">
                ⚡ <strong>Attendance Data Entry Form:</strong> Changing Class, Year, Month in the golden bar instantly updates main form fields. <br>
              @Reserved all in shamser.info.np
            </div>
        </div>
    </div>
</div>

<script>
    // ======================== CONFIGURATION ========================
    // ⚠️ REPLACE WITH YOUR DEPLOYED APPS SCRIPT WEB APP URL
    const SCRIPT_API = "https://script.google.com/macros/s/AKfycbxbHayq6mbJN5xS301x1Xuz70-NZYjcSx49pHvUP_vOnekE7c26q1AfFe-xMbSqIc-0hg/exec";
    
    // ---------- STORAGE KEYS ----------
    const STORAGE_DEF_CLASS = "smart_att_class_def";
    const STORAGE_DEF_YEAR = "smart_att_year_def";
    const STORAGE_DEF_MONTH = "smart_att_month_def";
    
    const FALLBACK_CLASS = "8";
    const FALLBACK_YEAR = "2083";
    const FALLBACK_MONTH = "Baisakh";
    
    // DOM elements (default bar)
    const defaultClassSelect = document.getElementById("globalDefaultClass");
    const defaultYearInput = document.getElementById("globalDefaultYear");
    const defaultMonthSelect = document.getElementById("globalDefaultMonth");
    
    // Main form fields
    const mainYear = document.getElementById("mainYear");
    const mainMonth = document.getElementById("mainMonth");
    const mainClass = document.getElementById("classMain");
    const autoSnField = document.getElementById("autoSnField");
    const rollNoInput = document.getElementById("rollNumber");
    const studentNameInput = document.getElementById("studentFullName");
    const fatherNameInput = document.getElementById("fatherName");
    const motherNameInput = document.getElementById("motherName");
    const dobInput = document.getElementById("dobField");
    const mobileInput = document.getElementById("mobileContact");
    
    // UI messaging
    const toastDiv = document.getElementById("globalToast");
    
    function showToast(text, type = "success") {
        toastDiv.textContent = text;
        toastDiv.className = `message-panel ${type === "error" ? "msg-error" : "msg-success"}`;
        toastDiv.style.display = "block";
        setTimeout(() => {
            toastDiv.style.display = "none";
        }, 4300);
    }
    
    // Storage helpers
    function getStoredDefaults() {
        return {
            defClass: localStorage.getItem(STORAGE_DEF_CLASS) ?? FALLBACK_CLASS,
            defYear: localStorage.getItem(STORAGE_DEF_YEAR) ?? FALLBACK_YEAR,
            defMonth: localStorage.getItem(STORAGE_DEF_MONTH) ?? FALLBACK_MONTH
        };
    }
    
    function updateStoredAndSyncUI(type, value) {
        if (type === 'class') localStorage.setItem(STORAGE_DEF_CLASS, value);
        if (type === 'year') localStorage.setItem(STORAGE_DEF_YEAR, value);
        if (type === 'month') localStorage.setItem(STORAGE_DEF_MONTH, value);
        syncAllDefaultsToForm();
    }
    
    function syncAllDefaultsToForm() {
        const { defClass, defYear, defMonth } = getStoredDefaults();
        // Update default bar UI
        if ([...defaultClassSelect.options].some(opt => opt.value === defClass)) defaultClassSelect.value = defClass;
        else defaultClassSelect.value = FALLBACK_CLASS;
        defaultYearInput.value = defYear;
        if ([...defaultMonthSelect.options].some(opt => opt.value === defMonth)) defaultMonthSelect.value = defMonth;
        else defaultMonthSelect.value = FALLBACK_MONTH;
        
        // 🔁 AUTO CHANGE MAIN FORM FIELDS
        mainYear.value = defYear;
        mainMonth.value = defMonth;
        mainClass.value = defClass;
    }
    
    function resetToFactoryDefaults() {
        localStorage.setItem(STORAGE_DEF_CLASS, FALLBACK_CLASS);
        localStorage.setItem(STORAGE_DEF_YEAR, FALLBACK_YEAR);
        localStorage.setItem(STORAGE_DEF_MONTH, FALLBACK_MONTH);
        syncAllDefaultsToForm();
        showToast(`✅ Default reset to Class: ${FALLBACK_CLASS}, Year: ${FALLBACK_YEAR}, Month: ${FALLBACK_MONTH}`, "success");
    }
    
    // Event listeners for default bar -> instant main form update
    defaultClassSelect.addEventListener("change", (e) => {
        updateStoredAndSyncUI('class', e.target.value);
        showToast(`🔁 Class default changed → "${e.target.value}"`, "success");
    });
    defaultYearInput.addEventListener("change", (e) => {
        let yr = e.target.value.trim();
        if (yr === "") yr = FALLBACK_YEAR;
        updateStoredAndSyncUI('year', yr);
        showToast(`📅 Year default set to ${yr}`, "success");
    });
    defaultMonthSelect.addEventListener("change", (e) => {
        updateStoredAndSyncUI('month', e.target.value);
        showToast(`🌙 Month default changed → ${e.target.value}`, "success");
    });
    
    // ========== BACKEND REQUESTS : Google Sheets (optional day columns/totals) ==========
    async function backendRequest(action, payloadObj = {}) {
        try {
            const bodyParams = new URLSearchParams({ action, ...payloadObj });
            const resp = await fetch(SCRIPT_API, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: bodyParams.toString()
            });
            const raw = await resp.text();
            try {
                return JSON.parse(raw);
            } catch (err) {
                console.warn("Non-JSON response", raw);
                return { success: false, message: "Server response invalid. Check Apps Script deployment." };
            }
        } catch (err) {
            return { success: false, message: `Network error: ${err.message}` };
        }
    }
    
    // Fetch latest SN (auto increment based on all records from ALL sheets)
    async function refreshAutoSN() {
        try {
            const url = `${SCRIPT_API}?action=getAll&_=${Date.now()}`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.success && Array.isArray(result.data)) {
                let maxSn = 0;
                result.data.forEach(record => {
                    let snVal = parseInt(record.sn);
                    if (!isNaN(snVal) && snVal > maxSn) maxSn = snVal;
                });
                const nextSn = maxSn + 1;
                autoSnField.value = nextSn;
            } else {
                autoSnField.value = "1";
            }
        } catch (err) {
            console.error("SN fetch error", err);
            autoSnField.value = "?";
        }
    }
    
    // Submit handler - reflect current main form values (which are auto-synced to defaults)
    document.getElementById("masterStudentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const yearVal = mainYear.value.trim();
        const monthVal = mainMonth.value;
        const classVal = mainClass.value.trim();
        const roll = rollNoInput.value.trim();
        const studentName = studentNameInput.value.trim();
        
        if (!yearVal) { showToast("Academic year required", "error"); return; }
        if (!monthVal) { showToast("Please select a Nepali month", "error"); return; }
        if (!classVal) { showToast("Class is required (auto-filled by default)", "error"); return; }
        if (!roll) { showToast("Roll/Sbl number required", "error"); return; }
        if (!studentName) { showToast("Student full name required", "error"); return; }
        
        const payload = {
            sn: autoSnField.value,
            roll_no: roll,
            class: classVal,
            name: studentName,
            father_name: fatherNameInput.value,
            mother_name: motherNameInput.value,
            dob: dobInput.value,
            mobile_no: mobileInput.value,
            year: yearVal,
            monthSheet: monthVal
        };
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerText;
        submitBtn.innerText = "⏳ Syncing...";
        submitBtn.disabled = true;
        
        const result = await backendRequest("addStudent", payload);
        submitBtn.innerText = originalBtnText;
        submitBtn.disabled = false;
        
        if (result.success) {
            showToast(`✅ ${result.message || "Student added! Day columns & totals updated automatically."}`, "success");
            // clear variable fields only (preserve class/year/month from defaults)
            rollNoInput.value = "";
            studentNameInput.value = "";
            fatherNameInput.value = "";
            motherNameInput.value = "";
            dobInput.value = "";
            mobileInput.value = "";
            await refreshAutoSN();
            rollNoInput.focus();
        } else {
            showToast(`❌ Submission error: ${result.message}`, "error");
        }
    });
    
    // Delete last row based on CURRENT month from main form (auto uses default month if empty)
    document.getElementById("deleteLastRowBtn").addEventListener("click", async () => {
        let activeMonth = mainMonth.value;
        if (!activeMonth) {
            const { defMonth } = getStoredDefaults();
            activeMonth = defMonth;
            if (!activeMonth) { showToast("No month selected or default missing", "error"); return; }
        }
        if (!confirm(`⚠️ Permanently delete LAST student record from month sheet: "${activeMonth}" ? This action cannot be undone.`)) return;
        const res = await backendRequest("deleteLastRow", { monthSheet: activeMonth });
        if (res.success) {
            showToast(`🗑️ ${res.message}`, "success");
            await refreshAutoSN();
        } else {
            showToast(`❌ Delete failed: ${res.message}`, "error");
        }
    });
    
    // Clear non-default fields (reset form but keep class/year/month from defaults)
    document.getElementById("clearFormBtn").addEventListener("click", () => {
        rollNoInput.value = "";
        studentNameInput.value = "";
        fatherNameInput.value = "";
        motherNameInput.value = "";
        dobInput.value = "";
        mobileInput.value = "";
        // Keep class/year/month from default (re-sync to be safe)
        const { defClass, defYear, defMonth } = getStoredDefaults();
        mainClass.value = defClass;
        mainYear.value = defYear;
        mainMonth.value = defMonth;
        showToast("🧹 Variable fields cleared (Class/Year/Month preserved from defaults)", "success");
        refreshAutoSN();
    });
    
    // If user manually changes main month/class/year they are allowed but we don't override defaults.
    // However to keep coherence we add manual note: but we can also allow default bar to always dominate.
    // Additionally monitor changes on main fields? Not necessary but ensures SN update.
    document.getElementById("resetDefaultBtn")?.removeEventListener; // safe
    
    // Factory reset button
    document.getElementById("factoryResetDefaultsBtn").addEventListener("click", resetToFactoryDefaults);
    
    // Also ensure when main month / class / year are manually changed we don't disturb default bar,
    // but we still respect them for submission. Everything works.
    
    // initial load: sync defaults, fetch SN
    async function initSystem() {
        syncAllDefaultsToForm();
        await refreshAutoSN();
        // Additional: if backend supports, we can trigger any warmup
        showToast("Changing Year class and month instantly updates!", "success");
    }
    
    initSystem();
    
    // Extra safeguard: when year input is changed manually in default bar, it syncs (already)
    // Log utility for debugging
    console.log("✅ Smart Attendance System |  Data Entry Form| @ copy reserved in shamser.info.np");
</script>
</body>
</html>
