<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>UpadteAll</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 24px 20px; }
    .dashboard-container { max-width: 1600px; margin: 0 auto; }
    .card { background: white; border-radius: 28px; box-shadow: 0 12px 28px rgba(0,0,0,0.08); padding: 20px 24px 28px; margin-bottom: 28px; }
    h2 { font-size: 1.7rem; font-weight: 600; margin: 0 0 6px 0; background: linear-gradient(135deg, #1e3c72, #2b3b5c); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .subhead { color: #5a6874; margin-bottom: 24px; border-left: 4px solid #3b82f6; padding-left: 14px; font-size: 0.9rem; }
    .school-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: 24px; padding: 16px 24px; margin-bottom: 24px; text-align: center; }
    .school-name { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .school-address { font-size: 0.85rem; opacity: 0.85; }
    .message-area { padding: 12px 20px; border-radius: 60px; margin-bottom: 20px; font-weight: 500; display: none; }
    .message-success { background: #dcfce7; color: #166534; border-left: 5px solid #22c55e; }
    .message-error { background: #fee2e2; color: #991b1b; border-left: 5px solid #ef4444; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; background: #f8fafc; padding: 18px 20px; border-radius: 32px; margin-bottom: 28px; border: 1px solid #e2edf2; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
    .filter-group label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #2c3e66; }
    select, input, button { padding: 10px 14px; border-radius: 60px; border: 1px solid #cbd5e1; background: white; font-size: 0.85rem; outline: none; }
    select:focus, input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
    button { background: #1e293b; color: white; font-weight: 600; border: none; cursor: pointer; padding: 10px 28px; transition: all 0.2s; }
    button:hover { background: #0f172a; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .action-buttons { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
    .btn-print { background: #2c5f2d; }
    .btn-pdf { background: #b22234; }
    .table-wrapper { overflow-x: auto; border-radius: 20px; border: 1px solid #e9eef3; background: white; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 900px; }
    th { background: #f1f5f9; color: #0f2b3d; font-weight: 700; padding: 14px 12px; border-bottom: 1px solid #dce5ec; text-align: left; }
    td { padding: 12px 12px; border-bottom: 1px solid #ecf3f9; }
    tr:hover td { background-color: #fafcff; }
    .present-badge { background: #d1fae5; color: #065f46; font-weight: 600; padding: 4px 12px; border-radius: 40px; display: inline-block; font-size: 0.75rem; }
    .absent-badge { background: #ffe4e2; color: #9b2c1d; font-weight: 600; padding: 4px 12px; border-radius: 40px; display: inline-block; font-size: 0.75rem; }
    .stats-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 24px; border-radius: 20px; margin-bottom: 20px; }
    .error-message { background: #fff1f0; border-left: 6px solid #e11d48; color: #b91c1c; padding: 14px 20px; border-radius: 24px; font-weight: 500; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media print { .filter-bar, .action-buttons, button, .no-print { display: none !important; } }
    @media (max-width: 780px) { .filter-bar { flex-direction: column; } .action-buttons { margin-left: 0; flex-direction: column; } }
  </style>
</head>
<body>
<div class="dashboard-container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
      <div><h2>📋 Upatate Attendance </h2></div>
      <div style="background: #e6f0ff; border-radius: 30px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600;">SHAMSER.INFO.NP</div>
    </div>
    <div id="globalMessage" class="message-area"></div>

    <div class="filter-bar">
      <div class="filter-group"><label>📋 REPORT TYPE</label><select id="reportTypeSelect"><option value="daily">📅 Daily</option><option value="monthly"> Monthly</option><option value="weekly"> Weekly</option><option value="yearly">📈Yearly Matrix</option></select></div>
      <div class="filter-group"><label>🎯 SCOPE</label><select id="scopeSelect"><option value="whole">Whole Class</option><option value="individual">Individual Student</option></select></div>
      <div class="filter-group"><label>📅 YEAR</label><input type="number" id="yearSelect" value="2081"></div>
      <select id="classSelect" class="filter-group">
        <optgroup label="General"><option value="ECD">ECD</option><option value="PG">PG</option><option value="Nursary">Nursary</option><option value="LKG">LKG</option><option value="UKG">UKG</option></optgroup>
        <optgroup label="Grade (Nepali)"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></optgroup>
        <optgroup label="English Medium"><option value="1EM">1EM</option><option value="2EM">2EM</option><option value="3EM">3EM</option><option value="4EM">4EM</option><option value="5EM">5EM</option><option value="6EM">6EM</option><option value="7EM">7EM</option><option value="8EM">8EM</option><option value="9EM">9EM</option><option value="10EM">10EM</option></optgroup>
      </select>
      <div class="filter-group" id="individualRollGroup" style="display:none"><label>🔢 ROLL NUMBER</label><input type="text" id="rollNoInput" placeholder="e.g., 101"></div>
      <div class="filter-group" id="monthGroup"><label>📆 MONTH</label><select id="monthSelect"><option value="Baisakh">Baisakh</option><option value="Jeshtha">Jeshtha</option><option value="Ashad">Ashad</option><option value="Shrawan">Shrawan</option><option value="Bhadra">Bhadra</option><option value="Ashwin">Ashwin</option><option value="Kartik">Kartik</option><option value="Mangsir">Mangsir</option><option value="Poush">Poush</option><option value="Magh">Magh</option><option value="Falgun">Falgun</option><option value="Chaitra">Chaitra</option></select></div>
      <div class="filter-group" id="dailyDateGroup"><label>📌 DAY NUMBER</label><input type="number" id="dailyDayInput" value="1" min="1" max="32"></div>
      <div class="filter-group" id="weeklyStartGroup"><label>START DAY</label><input type="number" id="startDayInput" value="1" min="1" max="32"></div>
      <div class="filter-group" id="weeklyEndGroup"><label>END DAY</label><input type="number" id="endDayInput" value="7" min="1" max="32"></div>
      <div class="filter-group"><button id="generateBtn">⟳ GENERATE</button><button id="resetBtn">🔄 RESET</button></div>
      <div class="action-buttons"><button id="printReportBtn" class="btn-print">🖨️ PRINT</button><button id="downloadPdfBtn" class="btn-pdf">📄 PDF</button></div>
    </div>
    <div id="reportContainer"><div class="stats-card" style="text-align:center;">📋 Select filters & click GENERATE </div></div>
  </div>
</div>

<script>
  // ======================= CONFIGURATION =======================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxslJwrgmEweE1jwFGn91yhGCt5SDmSbM652-oRg3Lxl3adH0BO-WqtLVLYMLnAp_2Hdw/exec";
  const MONTHS_LIST = ['Baisakh', 'Jeshtha', 'Ashad', 'Shrawan', 'Bhadra', 'Ashwin', 'Kartik', 'Mangsir', 'Poush', 'Magh', 'Falgun', 'Chaitra'];
  
  let currentSchoolInfo = { schoolName: "Shree Janakalyan Secondary School", schoolAddress: "Nepal" };
  let lastGeneratedHTML = "";
  let lastReportTitle = "";
  let familyDetailsCache = new Map();
  
  function formatDate(dateValue) {
    if (!dateValue) return '';
    if (typeof dateValue === 'string') {
      try {
        const date = new Date(dateValue);
        if (!isNaN(date.getTime())) {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        }
      } catch(e) {}
      return dateValue.split('T')[0];
    }
    if (dateValue instanceof Date) {
      const year = dateValue.getFullYear();
      const month = String(dateValue.getMonth() + 1).padStart(2, '0');
      const day = String(dateValue.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
    return String(dateValue);
  }
  
  function showMessage(msg, type) {
    const div = document.getElementById('globalMessage');
    div.textContent = msg;
    div.className = `message-area message-${type}`;
    div.style.display = "block";
    setTimeout(() => div.style.display = "none", 5000);
  }
  
  async function callAPI(action, payload, timeout = 15000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const params = new URLSearchParams({ action, ...payload }).toString();
      const res = await fetch(APPS_SCRIPT_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params,
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      return json;
    } catch(err) {
      clearTimeout(timeoutId);
      if(err.name === 'AbortError') throw new Error('Request timeout');
      throw err;
    }
  }
  
  function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
  
  async function fetchFamilyDetails(classVal, year) {
    const cacheKey = `${classVal}_${year}`;
    if (familyDetailsCache.has(cacheKey)) return familyDetailsCache.get(cacheKey);
    
    const detailsMap = new Map();
    try {
      const response = await callAPI('getStudentExtendedList', { class: classVal, year: year }, 10000);
      if (response && response.success && Array.isArray(response.data)) {
        response.data.forEach(student => {
          const rollKey = String(student.rollNo || student.rollNumber || '');
          detailsMap.set(rollKey, {
            fatherName: student.fatherName || student.father || '',
            motherName: student.motherName || student.mother || '',
            dob: formatDate(student.dob || student.DOB || ''),
            mobile: student.mobile || student.mobileNo || '',
            name: student.name || ''
          });
        });
      } else {
        const summaryRes = await callAPI('getWholeYearlySummary', { year: year, class: classVal }, 10000);
        if (summaryRes.success && summaryRes.data && summaryRes.data.studentsSummary) {
          summaryRes.data.studentsSummary.forEach(s => {
            const rollKey = String(s.rollNo);
            detailsMap.set(rollKey, {
              fatherName: s.fatherName || '',
              motherName: s.motherName || '',
              dob: formatDate(s.dob || ''),
              mobile: s.mobile || '',
              name: s.name || ''
            });
          });
        }
      }
    } catch(e) {
      console.warn("Failed to fetch family details:", e);
    }
    familyDetailsCache.set(cacheKey, detailsMap);
    return detailsMap;
  }
  
  function enrichWithFamily(rows, detailsMap, rollField = 'rollNo') {
    if (!rows || !Array.isArray(rows)) return rows;
    return rows.map(row => {
      const rollKey = String(row[rollField] || row.rollNo || '');
      const info = detailsMap.get(rollKey) || {};
      return { 
        ...row, 
        fatherName: info.fatherName || '', 
        motherName: info.motherName || '', 
        dob: info.dob || '', 
        mobile: info.mobile || '' 
      };
    });
  }
  
  // ========== CORRECTED WEEKLY REPORT BUILDER ==========
  // Each student appears ONCE with aggregated totals for the week
  function buildWeeklyHTML(data, filters, detailsMap) {
    let report = data.report || [];
    if (!report.length) return '<div class="error-message">⚠️ No weekly data found for this period.</div>';
    
    // Report should already be aggregated by student from backend
    // Each row has: sn, rollNo, name, totalPresent, totalAbsent, totalClosed
    const enriched = enrichWithFamily(report, detailsMap, 'rollNo');
    
    let html = `<div class="stats-card"><strong>📆 WEEKLY ATTENDANCE SUMMARY</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>${filters.month} | Days ${filters.startDay} - ${filters.endDay} | Year: ${filters.year} | Class: ${filters.class}<br>👥 Total Students: ${enriched.length}</div>`;
    html += `<div class="table-wrapper">`;
    html += `<table>
      <thead>
        <tr>
          <th>SN</th><th>Roll No</th><th>Student Name</th><th>👨 Father's Name</th><th>👩 Mother's Name</th><th>🎂 DOB</th><th>📞 Mobile No</th><th>Present</th><th>Absent</th><th>Closed</th>
        </tr>
      </thead>
      <tbody>`;
    
    enriched.forEach(r => {
      html += `<tr>
        <td>${r.sn}</td>
        <td>${escapeHtml(r.rollNo)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.fatherName)}</td>
        <td>${escapeHtml(r.motherName)}</td>
        <td>${escapeHtml(r.dob)}</td>
        <td>${escapeHtml(r.mobile)}</td>
        <td><strong>${r.totalPresent || 0}</strong></td>
        <td>${r.totalAbsent || 0}</td>
        <td>${r.totalClosed || 0}</td>
      </tr>`;
    });
    
    // Add summary row
    const totalPresent = enriched.reduce((sum, r) => sum + (r.totalPresent || 0), 0);
    const totalAbsent = enriched.reduce((sum, r) => sum + (r.totalAbsent || 0), 0);
    const totalClosed = enriched.reduce((sum, r) => sum + (r.totalClosed || 0), 0);
    
    html += `<tr style="background: #eef2ff; font-weight: bold;">
      <td colspan="7" style="text-align: right;">📊 TOTAL →</td>
      <td>${totalPresent}</td>
      <td>${totalAbsent}</td>
      <td>${totalClosed}</td>
    </tr>`;
    
    html += `</tbody></table></div>`;
    return html;
  }
  
  function buildDailyHTML(data, filters, detailsMap) {
    let report = data.report || [];
    if (!report.length) return '<div class="error-message">⚠️ No attendance data found for this day.</div>';
    const enriched = enrichWithFamily(report, detailsMap, 'rollNo');
    let html = `<div class="stats-card"><strong>📅 DAILY ATTENDANCE REPORT</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>${filters.month} Day ${filters.dayNum} | Year: ${filters.year} | Class: ${filters.class}<br>👥 Total Students: ${enriched.length}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>SN</th><th>Roll No</th><th>Student Name</th><th>👨 Father's Name</th><th>👩 Mother's Name</th><th>🎂 DOB</th><th>📞 Mobile No</th><th>Status</th></tr></thead><tbody>`;
    enriched.forEach(r => {
      let status = r.status || 'अनुपस्थित';
      let cls = status === 'उपस्थित' ? 'present-badge' : (status === 'सार्वजनिक बिदा' ? 'holiday-badge' : 'absent-badge');
      html += `<tr><td>${r.sn}</td><td>${escapeHtml(r.rollNo)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.fatherName)}</td><td>${escapeHtml(r.motherName)}</td><td>${escapeHtml(r.dob)}</td><td>${escapeHtml(r.mobile)}</td><td><span class="${cls}">${status}</span></td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }
  
  function buildMonthlyHTML(data, filters, detailsMap) {
    let report = data.report || [];
    if (!report.length) return '<div class="error-message">⚠️ No monthly summary found.</div>';
    const enriched = enrichWithFamily(report, detailsMap, 'rollNo');
    let html = `<div class="stats-card"><strong>📊 MONTHLY SUMMARY REPORT</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>${filters.month} ${filters.year} | Class: ${filters.class}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>SN</th><th>Roll No</th><th>Name</th><th>👨 Father</th><th>👩 Mother</th><th>🎂 DOB</th><th>📞 Mobile</th><th>Present</th><th>Absent</th><th>Closed</th></tr></thead><tbody>`;
    enriched.forEach(r => {
      html += `<tr><td>${r.sn}</td><td>${escapeHtml(r.rollNo)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.fatherName)}</td><td>${escapeHtml(r.motherName)}</td><td>${escapeHtml(r.dob)}</td><td>${escapeHtml(r.mobile)}</td><td><strong>${r.totalPresent}</strong></td><td>${r.totalAbsent}</td><td>${r.totalClosed}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }
  
  function buildYearlyIndividualHTML(data, filters, detailsMap) {
    let yearlyData = data.yearlyData || [];
    const rollKey = String(filters.rollNo);
    const info = detailsMap.get(rollKey) || {};
    let html = `<div class="stats-card"><strong>📅 YEARLY REPORT (INDIVIDUAL)</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>Roll No: ${filters.rollNo} | Student: ${escapeHtml(data.studentName || info.name)}<br><span style="background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:20px; display:inline-block; margin-top:6px;">👨 Father: ${escapeHtml(info.fatherName)} &nbsp; | &nbsp; 👩 Mother: ${escapeHtml(info.motherName)} &nbsp; | &nbsp; 🎂 DOB: ${escapeHtml(info.dob)} &nbsp; | &nbsp; 📞 Mobile: ${escapeHtml(info.mobile)}</span><br>Year: ${filters.year} | Class: ${filters.class}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>#</th><th>Month</th><th>Present</th><th>Absent</th><th>Closed</th></tr></thead><tbody>`;
    yearlyData.forEach((d, idx) => {
      html += `<tr><td>${idx+1}</td><td><strong>${d.month}</strong></td><td>${d.totalPresent}</td><td>${d.totalAbsent}</td><td>${d.totalClosed}</td></tr>`;
    });
    html += `<tr style="background:#f3f4f6;"><td colspan="2"><strong>GRAND TOTAL</strong></td><td><strong>${data.totalPresent}</strong></td><td><strong>${data.totalAbsent}</strong></td><td><strong>${data.totalClosed}</strong></td></tr>`;
    html += `</tbody></table></div>`;
    return html;
  }
  
  async function buildYearlyMatrix(classVal, year, detailsMap) {
    const summaryRes = await callAPI('getWholeYearlySummary', { year: year, class: classVal }, 15000);
    if (!summaryRes.success) throw new Error(summaryRes.message);
    const students = summaryRes.data.studentsSummary || [];
    if (students.length === 0) return '<div class="error-message">No students found</div>';
    
    let html = `<div class="stats-card"><strong>📈 YEARLY ATTENDANCE MATRIX</strong><br>${escapeHtml(currentSchoolInfo.schoolName)}<br>Year: ${year} | Class: ${classVal} | Total Students: ${students.length}</div>`;
    html += `<div class="table-wrapper"><table><thead><tr><th>SN</th><th>Roll</th><th>Name</th><th>👨 Father</th><th>👩 Mother</th><th>🎂 DOB</th><th>📞 Mobile</th><th>Total P</th><th>Total A</th><th>%</th></tr></thead><tbody>`;
    
    for (let s of students) {
      const ext = detailsMap.get(String(s.rollNo)) || {};
      let percent = (s.totalPresent + s.totalAbsent) > 0 ? ((s.totalPresent / (s.totalPresent + s.totalAbsent)) * 100).toFixed(1) : 0;
      html += `<tr><td>${s.sn}</td><td>${escapeHtml(s.rollNo)}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(ext.fatherName)}</td><td>${escapeHtml(ext.motherName)}</td><td>${escapeHtml(ext.dob)}</td><td>${escapeHtml(ext.mobile)}</td><td><strong>${s.totalPresent}</strong></td><td>${s.totalAbsent}</td><td>${percent}%</td></tr>`;
    }
    html += `</tbody></table></div>`;
    return html;
  }
  
  // ========== MAIN GENERATE FUNCTION ==========
  async function generateReport() {
    const rType = document.getElementById('reportTypeSelect').value;
    const scope = document.getElementById('scopeSelect').value;
    const month = document.getElementById('monthSelect').value;
    const rollNo = document.getElementById('rollNoInput').value.trim();
    const year = document.getElementById('yearSelect').value.trim();
    const classVal = document.getElementById('classSelect').value.trim();
    const container = document.getElementById('reportContainer');
    
    if (!year || !classVal) { showMessage("Year and Class required", "error"); return; }
    container.innerHTML = `<div class="stats-card" style="text-align:center;"><span class="loading-spinner"></span> Loading attendance with family details...</div>`;
    document.getElementById('generateBtn').disabled = true;
    
    try {
      const schoolRes = await callAPI('getSchoolInfo', {}, 5000);
      if (schoolRes.success && schoolRes.data) {
        if (schoolRes.data.schoolName) currentSchoolInfo.schoolName = schoolRes.data.schoolName;
        if (schoolRes.data.schoolAddress) currentSchoolInfo.schoolAddress = schoolRes.data.schoolAddress;
      }
      
      const detailsMap = await fetchFamilyDetails(classVal, year);
      
      let html = "";
      let result = null;
      
      if (rType === 'daily') {
        const dayNum = parseInt(document.getElementById('dailyDayInput').value);
        if (isNaN(dayNum)) throw new Error("Invalid day");
        let payload = { year, class: classVal, month, date: `${month} ${dayNum}` };
        if (scope === 'individual' && rollNo) payload.rollNo = rollNo;
        result = await callAPI('getDailyReport', payload, 10000);
        if (!result.success) throw new Error(result.message);
        html = buildDailyHTML(result.data, { year, class: classVal, month, dayNum }, detailsMap);
        lastReportTitle = `Daily_${month}_${dayNum}_${classVal}`;
      } 
      else if (rType === 'monthly') {
        let payload = { year, class: classVal, month };
        if (scope === 'individual' && rollNo) payload.rollNo = rollNo;
        result = await callAPI('getMonthlyReport', payload, 10000);
        if (!result.success) throw new Error(result.message);
        html = buildMonthlyHTML(result.data, { year, class: classVal, month }, detailsMap);
        lastReportTitle = `Monthly_${month}_${classVal}`;
      }
      else if (rType === 'weekly') {
        const startDay = parseInt(document.getElementById('startDayInput').value);
        const endDay = parseInt(document.getElementById('endDayInput').value);
        if (isNaN(startDay) || isNaN(endDay)) throw new Error("Invalid week range");
        let payload = { year, class: classVal, month, startDate: `${month} ${startDay}`, endDate: `${month} ${endDay}` };
        if (scope === 'individual' && rollNo) payload.rollNo = rollNo;
        result = await callAPI('getWeeklyReport', payload, 10000);
        if (!result.success) throw new Error(result.message);
        html = buildWeeklyHTML(result.data, { year, class: classVal, month, startDay, endDay }, detailsMap);
        lastReportTitle = `Weekly_${month}_${startDay}-${endDay}_${classVal}`;
      }
      else if (rType === 'yearly') {
        if (scope === 'individual') {
          if (!rollNo) throw new Error("Roll number required");
          result = await callAPI('getYearlyReport', { year, class: classVal, rollNo }, 10000);
          if (!result.success) throw new Error(result.message);
          html = buildYearlyIndividualHTML(result.data, { year, class: classVal, rollNo }, detailsMap);
          lastReportTitle = `Yearly_${rollNo}_${classVal}`;
        } else {
          html = await buildYearlyMatrix(classVal, year, detailsMap);
          lastReportTitle = `YearlyMatrix_${classVal}_${year}`;
        }
      }
      
      const finalHtml = `<div class="school-header no-print"><div class="school-name">${escapeHtml(currentSchoolInfo.schoolName)}</div><div class="school-address">📍 ${escapeHtml(currentSchoolInfo.schoolAddress)} &nbsp;|&nbsp; 📋 Data: Col E (Father) · F (Mother) · G (DOB) · H (Mobile)</div></div>${html}`;
      container.innerHTML = finalHtml;
      lastGeneratedHTML = finalHtml;
      showMessage("✅ Report generated successfully", "success");
    } catch(err) {
      console.error(err);
      container.innerHTML = `<div class="error-message">❌ ${escapeHtml(err.message)}</div>`;
      showMessage(err.message, "error");
    } finally {
      document.getElementById('generateBtn').disabled = false;
    }
  }
  
  function printReport() {
    if (!lastGeneratedHTML) { showMessage("Generate report first", "error"); return; }
    const win = window.open('', '_blank');
    win.document.write(`<html><head><title>Attendance Report</title><style>${document.querySelector('style').innerHTML} .filter-bar, .action-buttons, button, .no-print { display: none !important; }</style></head><body><div class="dashboard-container">${lastGeneratedHTML}</div></body></html>`);
    win.document.close();
    win.print();
  }
  
  async function downloadPDF() {
    if (!lastGeneratedHTML) { showMessage("Generate report first", "error"); return; }
    showMessage("Preparing PDF...", "success");
    const container = document.createElement('div');
    container.style.padding = "20px";
    container.style.background = "white";
    container.innerHTML = `<h3 style="text-align:center;">Attendance Report</h3>${lastGeneratedHTML}`;
    const opt = { margin: [0.5,0.5,0.5,0.5], filename: `${lastReportTitle.replace(/[^a-z0-9]/gi,'_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
    try { await html2pdf().set(opt).from(container).save(); showMessage("PDF downloaded", "success"); } 
    catch(e) { showMessage("PDF error: "+e.message, "error"); }
  }
  
  function updateDynamicFields() {
    const rType = document.getElementById('reportTypeSelect').value;
    const scope = document.getElementById('scopeSelect').value;
    document.getElementById('monthGroup').style.display = rType === 'yearly' ? 'none' : 'flex';
    document.getElementById('individualRollGroup').style.display = scope === 'individual' ? 'flex' : 'none';
    document.getElementById('dailyDateGroup').style.display = rType === 'daily' ? 'flex' : 'none';
    const weeklyVis = rType === 'weekly';
    document.getElementById('weeklyStartGroup').style.display = weeklyVis ? 'flex' : 'none';
    document.getElementById('weeklyEndGroup').style.display = weeklyVis ? 'flex' : 'none';
  }
  
  document.getElementById('reportTypeSelect').addEventListener('change', updateDynamicFields);
  document.getElementById('scopeSelect').addEventListener('change', updateDynamicFields);
  document.getElementById('generateBtn').addEventListener('click', generateReport);
  document.getElementById('printReportBtn').addEventListener('click', printReport);
  document.getElementById('downloadPdfBtn').addEventListener('click', downloadPDF);
  document.getElementById('resetBtn').addEventListener('click', () => location.reload());
  
  updateDynamicFields();
  generateReport();
</script>
</body>
</html>
