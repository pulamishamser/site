<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shamser Social | Share Your Moments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            color: white;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .logo span {
            color: #ffcc00;
        }

        .tagline {
            font-weight: 300;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 20px;
        }

        .upload-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .feed-section {
            flex: 2;
            min-width: 300px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
        }

        .upload-area {
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.3s;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        .upload-area:hover {
            background-color: #e3f2fd;
            border-color: #2980b9;
        }

        .upload-icon {
            font-size: 4rem;
            color: #3498db;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .btn:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-upload {
            background: #2ecc71;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }

        .btn-upload:hover {
            background: #27ae60;
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            transition: border 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .post-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .post-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-10px);
        }

        .post-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .post-content {
            padding: 20px;
        }

        .post-caption {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #444;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .like-btn {
            color: #e74c3c;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .like-btn:hover {
            transform: scale(1.2);
        }

        .liked {
            color: #e74c3c;
        }

        .share-options {
            display: flex;
            gap: 12px;
        }

        .share-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .share-icon:hover {
            transform: translateY(-3px);
        }

        .facebook {
            background: #3b5998;
        }

        .twitter {
            background: #1da1f2;
        }

        .instagram {
            background: #e1306c;
        }

        .whatsapp {
            background: #25d366;
        }

        .post-time {
            font-size: 0.9rem;
            color: #95a5a6;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: white;
            margin-top: 50px;
            font-size: 1rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .upload-section, .feed-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-camera-retro"></i> Shamser<span>Social</span>
            </div>
            <p class="tagline">Share your moments with the world</p>
        </header>

        <div class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <h2 class="section-title">Create New Post</h2>
                
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <p class="upload-text">Click to upload an image or drag & drop</p>
                    <p>PNG, JPG, GIF up to 5MB</p>
                </div>
                
                <div class="preview-container" id="previewContainer">
                    <img src="" alt="Preview" class="image-preview" id="imagePreview">
                </div>
                
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                
                <div class="form-group">
                    <label for="caption">Write a caption:</label>
                    <textarea id="caption" placeholder="What's on your mind?"></textarea>
                </div>
                
                <button class="btn btn-upload" id="publishBtn">
                    <i class="fas fa-paper-plane"></i> Publish to Shamser
                </button>
            </section>
            
            <!-- Feed Section -->
            <section class="feed-section">
                <h2 class="section-title">Recent Posts</h2>
                
                <div class="post-feed" id="postFeed">
                    <!-- Posts will be dynamically added here -->
                </div>
            </section>
        </div>
        
        <footer>
            <p>© 2023 Shamser Social | Share your moments with the world</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('previewContainer');
        const captionInput = document.getElementById('caption');
        const publishBtn = document.getElementById('publishBtn');
        const postFeed = document.getElementById('postFeed');
        
        // Event Listeners
        uploadArea.addEventListener('click', () => imageUpload.click());
        imageUpload.addEventListener('change', handleImageUpload);
        publishBtn.addEventListener('click', publishPost);
        
        // Handle image upload and preview
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    previewContainer.style.display = 'block';
                }
                
                reader.readAsDataURL(file);
            }
        }
        
        // Publish new post
        function publishPost() {
            const imageSrc = imagePreview.src;
            const caption = captionInput.value.trim();
            
            if (!imageSrc || imageSrc === window.location.href) {
                alert('Please upload an image first!');
                return;
            }
            
            if (!caption) {
                alert('Please write a caption for your image!');
                return;
            }
            
            // Create new post element
            const postElement = document.createElement('div');
            postElement.className = 'post-card';
            postElement.innerHTML = `
                <img src="${imageSrc}" alt="Post image" class="post-image">
                <div class="post-content">
                    <p class="post-caption">${caption}</p>
                    <div class="post-meta">
                        <div class="like-btn" onclick="toggleLike(this)">
                            <i class="far fa-heart"></i>
                        </div>
                        <div class="share-options">
                            <div class="share-icon facebook" onclick="shareToFacebook('${imageSrc}', '${caption}')">
                                <i class="fab fa-facebook-f"></i>
                            </div>
                            <div class="share-icon twitter" onclick="shareToTwitter('${caption}')">
                                <i class="fab fa-twitter"></i>
                            </div>
                            <div class="share-icon instagram">
                                <i class="fab fa-instagram"></i>
                            </div>
                            <div class="share-icon whatsapp" onclick="shareToWhatsApp('${imageSrc}', '${caption}')">
                                <i class="fab fa-whatsapp"></i>
                            </div>
                        </div>
                        <span class="post-time">Just now</span>
                    </div>
                </div>
            `;
            
            // Add to the top of the feed
            postFeed.insertBefore(postElement, postFeed.firstChild);
            
            // Reset form
            imagePreview.src = '';
            previewContainer.style.display = 'none';
            captionInput.value = '';
            imageUpload.value = '';
            
            alert('Your post has been published successfully!');
        }
        
        // Toggle like button
        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('far')) {
                icon.classList.remove('far');
                icon.classList.add('fas', 'liked');
                btn.classList.add('liked');
            } else {
                icon.classList.remove('fas', 'liked');
                icon.classList.add('far');
                btn.classList.remove('liked');
            }
        }
        
        // Social sharing functions
        function shareToFacebook(image, caption) {
            const url = encodeURIComponent(window.location.href);
            const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
            window.open(shareUrl, '_blank', 'width=600,height=400');
        }
        
        function shareToTwitter(caption) {
            const text = encodeURIComponent(caption);
            const url = encodeURIComponent(window.location.href);
            const shareUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            window.open(shareUrl, '_blank', 'width=600,height=400');
        }
        
        function shareToWhatsApp(image, caption) {
            const text = encodeURIComponent(`${caption} - Check out this post on Shamser!`);
            const shareUrl = `https://wa.me/?text=${text}`;
            window.open(shareUrl, '_blank', 'width=600,height=400');
        }
        
        // Initialize with some sample posts
        window.onload = function() {
            const samplePosts = [
                {
                    image: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80',
                    caption: 'Beautiful sunrise over the mountains today! Nature never ceases to amaze me.',
                    time: '2 hours ago'
                },
                {
                    image: 'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1200&q=80',
                    caption: 'Exploring new places and finding hidden gems in the city. Adventure awaits around every corner!',
                    time: '5 hours ago'
                }
            ];
            
            samplePosts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post-card';
                postElement.innerHTML = `
                    <img src="${post.image}" alt="Post image" class="post-image">
                    <div class="post-content">
                        <p class="post-caption">${post.caption}</p>
                        <div class="post-meta">
                            <div class="like-btn" onclick="toggleLike(this)">
                                <i class="far fa-heart"></i>
                            </div>
                            <div class="share-options">
                                <div class="share-icon facebook" onclick="shareToFacebook('${post.image}', '${post.caption}')">
                                    <i class="fab fa-facebook-f"></i>
                                </div>
                                <div class="share-icon twitter" onclick="shareToTwitter('${post.caption}')">
                                    <i class="fab fa-twitter"></i>
                                </div>
                                <div class="share-icon instagram">
                                    <i class="fab fa-instagram"></i>
                                </div>
                                <div class="share-icon whatsapp" onclick="shareToWhatsApp('${post.image}', '${post.caption}')">
                                    <i class="fab fa-whatsapp"></i>
                                </div>
                            </div>
                            <span class="post-time">${post.time}</span>
                        </div>
                    </div>
                `;
                postFeed.appendChild(postElement);
            });
        };
    </script>
</body>
</html>
