      "य्य":"¯","ल्ल":"°","व्व":"±","श्श":"²","ष्ष":"³",
      "स्स":"´","ह्ह":"µ"
    };

    static _special3 = {
      "र्ष":"if{","र्व":"j{","र्म":"d{","र्ग":"u{","र्न":"g{","र्छ":"5{",
      "र्द":"b{","र्श":"z{","र्थ":"y{","र्स":";{","र्ह":"x{","र्क":"s{",
      "र्ख":"v{","र्घ":"3{","र्च":"r{","र्ज":"h{","र्झ":"´{","र्ट":"6{",
      "र्ठ":"7{","र्ड":"8{","र्ढ":"9{","र्ण":"0f{","र्त":"t{","र्ध":"w{",
      "र्प":"k{","र्फ":"km{","र्ब":"a{","र्भ":"e{","र्य":"o{","र्ल":"n{",

      "न्र":"g|","व्र":"j|","ट्र":"6|","ठ्र":"7|","ड्र":"8|",

      "स्ड":":8","स्ढ":":9","स्ण":":0f","स्द":":b","स्ध":":w",
      "स्ब":":a","स्भ":":e","स्र":":/","स्ल":":n","स्श":":z"
    };

    static _halfFormMap = {
      "क":"S","ख":"V","ग":"U","घ":"3","ङ":"ª",
      "च":"R","छ":"5","ज":"H","झ":"´","ञ":"`",
      "ट":"6","ठ":"7","ड":"8","ढ":"9","ण":"0f",
      "त":"T","थ":"Y","द":"B","ध":"W","न":"G",
      "प":"K","फ":"Km","ब":"A","भ":"E","म":"D",
      "य":"O","र":"/","ल":"N","व":"J",
      "श":"Z","ष":"i","स":":","ह":"X"
    };

    static _isConsonant(c) {
      return "कखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह".includes(c);
    }

    static _preprocessShortI(text) {
      let result = '';
      let i = 0;
      const len = text.length;
      while (i < len) {
        const c = text[i];
        if (c === 'ि') {
          let clusterStart = result.length;
          let j = result.length - 1;
          let cluster = '';
          if (j >= 0 && this._isConsonant(result[j])) {
            cluster = result[j];
            j--;
            while (j >= 1 && result[j] === '्' && this._isConsonant(result[j-1])) {
              cluster = result[j-1] + '्' + cluster;
              j -= 2;
            }
            clusterStart = j + 1;
          }
          if (cluster.length > 0 && this._isConsonant(cluster[0])) {
            result = result.slice(0, clusterStart) + 'l' + cluster;
          } else {
            result += 'l';
          }
          i++;
          continue;
        }
        result += c;
        i++;
      }
      return result;
    }

    static _normalize(text) {
      const pre = this._preprocessShortI(text);
      let out = '';
      let i = 0;
      const len = pre.length;
      while (i < len) {
        if (i + 2 < len) {
          const tri = pre.substring(i, i + 3);
          if (this._special3[tri] !== undefined) {
            out += this._special3[tri];
            i += 3;
            continue;
          }
        }
        if (i + 1 < len) {
          const two = pre.substring(i, i + 2);
          if (this._special2[two] !== undefined) {
            out += this._special2[two];
            i += 2;
            continue;
          }
        }
        if (pre[i] === 'र' && pre[i+1] === '्' && i + 2 < len) {
          const nc = pre[i+2];
          if (this._map[nc] && nc !== 'र') {
            out += this._map[nc] + "{";
            i += 3;
            continue;
          }
        }
        if (pre[i] !== 'र' && pre[i+1] === '्') {
          const nc = i + 2 < len ? pre[i+2] : '';
          if (nc !== 'र' && nc !== '' && nc !== ' ' && nc !== '।' && nc !== ',') {
            if (this._halfFormMap[pre[i]]) {
              out += this._halfFormMap[pre[i]];
              i += 2;
              continue;
            }
            if (pre[i] === 'स') { out += ":"; i += 2; continue; }
            if (pre[i] === 'ष') { out += "i"; i += 2; continue; }
          }
        }
        if (i > 0 && pre[i-1] !== 'र' && pre[i] === '्' && pre[i+1] === 'र') {
          const p = pre[i-1];
          if (p !== 'ट' && p !== 'ठ' && p !== 'ड') {
            out += '|'; i += 2; continue;
          } else {
            out += '«'; i += 2; continue;
          }
        }
        out += pre[i];
        i++;
      }
      return out.replaceAll("त|", "q");
    }

    static convert(text) {
      const norm = this._normalize(text);
      let out = '';
      for (let i = 0; i < norm.length; i++) {
        const c = norm[i];
        if (c === '\ufeff') continue;
        out += (this._map[c] !== undefined) ? this._map[c] : c;
      }

      let f = out;

      f = f.replaceAll("Si", "I");
      f = f.replaceAll("H`", "1");
      f = f.replaceAll("b\\\\w", "4");
      f = f.replaceAll("z|", ">");
      f = f.replaceAll("/'", "?");
      f = f.replaceAll("Tt", "Q");
      f = f.replaceAll("b\\\\lj", "lå");
      f = f.replaceAll("b\\\\\\j", "å");
      f = f.replaceAll("0f\\", "0");
      f = f.replaceAll("`\\", "~");
      f = f.replace(/(.)[l][|]/g, (m, p1) => "l" + p1 + "|");
      f = f.replace(/[k][l][m][|]/g, "lk|m");

      f = f.replaceAll("x/\"", "x¿");
      f = f.replaceAll("x/'", "x¿");
      f = f.replaceAll("x/", "x¿");
      f = f.replaceAll("/\"", "?");

      const refPairs = [
        ["{s","s{"],["{v","v{"],["{u","u{"],["{3","3{"],
        ["{r","r{"],["{5","5{"],["{h","h{"],["{´","´{"],
        ["{`","`{"],["{6","6{"],["{7","7{"],["{8","8{"],
        ["{9","9{"],["{0f","0f{"],["{t","t{"],["{y","y{"],
        ["{b","b{"],["{w","w{"],["{g","g{"],["{k","k{"],
        ["{km","km{"],["{a","a{"],["{e","e{"],["{d","d{"],
        ["{o","o{"],["{n","n{"],["{j","j{"],["{;",";{"],
        ["{z","z{"],["{if","if{"],["{x","x{"]
      ];
      refPairs.sort((a, b) => b[0].length - a[0].length);
      for (const [bad, good] of refPairs) {
        f = f.replaceAll(bad, good);
      }

      f = f.replaceAll("ljBfy{L", "ljBfyL{");
      f = f.replaceAll("ljBfyoL", "ljBfyL");
      f = f.replaceAll("ljBfyL", "ljBfyL");

      f = f.replaceAll("ul5{g\\", "u5{g\\");
      f = f.replaceAll("ul5{g", "u5{g");
      f = f.replaceAll("k%fl%{g\\", "k%5{g\\");
      f = f.replaceAll("k%fl%{g", "k%5{g");
      f = f.replaceAll("k%5{g\\", "k%5{g\\");

      f = f.replace(/([a-zA-Z%´])l([0-9]*)5\{/g, "$1$2 5{");
      f = f.replaceAll("l5{g", "5{g");

      f = f.replaceAll("bu'{b", "bu'b{");
      f = f.replaceAll("bu'b}{", "bu'b}{");

      f = f.replaceAll("al;0f'", "lji0f'");
      f = f.replaceAll("ali0f'", "lji0f'");
      f = f.replaceAll("alIf0f'", "lji0f'");
      f = f.replaceAll("al0f'", "lji0f'");

      f = f.replaceAll("nSIfo", "nIo");
      f = f.replaceAll("SIfo", "Io");
      f = f.replaceAll("nSIf", "nIo");

      f = f.replaceAll("Bw", "4");
      f = f.replaceAll("Bo", "B");

      f = f.replaceAll("ljBof", "ljBf");
      f = f.replaceAll("ljBofno", "ljBfno");

      f = f.replaceAll("eljIfo", "eljio");

      f = f.replaceAll("lg{df0f", "lgdf{0f");

      f = f.replaceAll("Myfgdf", ":yfgdf");
      f = f.replaceAll("Myfg", ":yfg");
      f = f.replaceAll("Mylt", ":ylt");

      f = f.replaceAll("oMt}", "o:t}");
      f = f.replaceAll("Mt}", ":t}");

      f = f.replaceAll("df{ub{zs", "dfu{bz{s");

      f = f.replaceAll(";f{j", ";fj{");
      f = f.replaceAll("cf{j", "cfj{");
      f = f.replaceAll("sf{j", "sfj{");
      f = f.replaceAll("gf{j", "gfj{");
      f = f.replaceAll("tf{j", "tfj{");
      f = f.replaceAll("df{j", "dfj{");
      f = f.replaceAll("af{j", "afj{");
      f = f.replaceAll("kf{j", "kfj{");
      f = f.replaceAll("bf{j", "bfj{");
      f = f.replaceAll("vf{j", "vfj{");
      f = f.replaceAll("yf{j", "yfj{");
      f = f.replaceAll("nf{j", "nfj{");
      f = f.replaceAll("hf{j", "hfj{");
      f = f.replaceAll("0f{j", "0fj{");
      f = f.replaceAll(":f{j", ":fj{");
      f = f.replaceAll("zf{j", "zfj{");

      f = f.replaceAll("u{g'", "ug'{");
      f = f.replaceAll("u{gf", "ugf{");
      f = f.replaceAll("u{g]", "ug]{");

      f = f.replaceAll("cfzL{jfb", "cflzjf{b");

      f = f.replaceAll("cfKmgf]", "cfˆgf]");
      f = f.replaceAll("cfKmgf", "cfˆgf");
      f = f.replaceAll("cfKmg}", "cfˆg}");
      f = f.replaceAll("cfKmg", "cfˆg");

      f = f.replaceAll("k\"{0f", "k\"0f{");

      f = f.replace(/\s+:\s+/g, " M ");
      f = f.replace(/\s+:/g, " M");
      f = f.replace(/^:/g, "M");

      f = f.replaceAll(".", " .");
      f = f.replaceAll("  .", " .");
      f = f.replaceAll("   .", " .");

      f = f.replaceAll(" .", "\u0001DOT\u0001");

      f = f.replace(/\\/g, (match, offset, str) => {
        const next = str[offset + 1];
        if (next === undefined || next === ' ' || next === '\n' || next === '\t') {
          return '';
        }
        return '\\';
      });

      f = f.replaceAll("\u0001DOT\u0001", " .");

      f = f.replaceAll("sxl", "slx");
      f = f.replaceAll("k7g]", "p7\\g]");
      f = f.replaceAll("s7lg", "sl7g");
      f = f.replaceAll("gl/Gt/", "lg/Gt/");
      f = f.replaceAll("JoStlsf]", "JolStsf]");
      f = f.replaceAll("b]vlg]", "b]lvg]");
      f = f.replaceAll(" blg", " lbg");
      f = f.replaceAll("oyf{ydf", "oyfy{df");
      f = f.replaceAll("k/l0ft", "kl/0ft");

      return f;
    }
  }

  // ============================================================
  // UI Initialization
  // ============================================================
  (function() {
    const u = document.getElementById('u');
    const p = document.getElementById('p');
    p.style.fontFamily = "'Preeti', 'Segoe UI', 'Noto Sans Devanagari', sans-serif";

    function run() {
      try {
        p.value = UnicodeToPreeti.convert(u.value);
        p.style.fontFamily = "'Preeti', 'Segoe UI', 'Noto Sans Devanagari', sans-serif";
      } catch (e) {
        p.value = '⚠️ त्रुटि: ' + e.message;
      }
    }

    u.addEventListener('input', run);
    run();
  })();
</script>
