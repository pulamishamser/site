        return false;

    document.addEventListener('keydown', function(e){
        if(e.key === 'F12' || e.keyCode === 123){
            e.preventDefault();
            return false;
        }
        if(e.ctrlKey && e.shiftKey && ['I','J','C'].indexOf(e.key.toUpperCase()) > -1){
            e.preventDefault();
            return false;
        }
        if(e.ctrlKey && e.shiftKey && [73,74,67].indexOf(e.keyCode) > -1){
            e.preventDefault();
            return false;
        }
        if(e.ctrlKey && e.key.toUpperCase() === 'U'){
            e.preventDefault();
            return false;
        }
        if(e.ctrlKey && e.key.toUpperCase() === 'S'){
            e.preventDefault();
            return false;
        }

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const html5QrCode = new Html5Qrcode("reader");
        let scannedText = "";

        // File Scan Handler
        function scanImage(input) {
            if (input.files && input.files[0]) {
                const imageFile = input.files[0];
                html5QrCode.scanFile(imageFile, true)
                    .then(decodedText => {
                        showResult(decodedText);
                    })
                    .catch(err => {
                        showResult("QR Code not found or unreadable.", true);
                    });
            }
        }

        // Camera Scan Handler
        function startCamera() {
            // If already scanning, stop first (prevents double start)
            if (html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    startCamera();
                }).catch(err => {
                    console.warn("Stop before restart failed", err);
                });
                return;
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    showResult(decodedText);
                    html5QrCode.stop();
                },
                (errorMessage) => { /* scanning... */ }
            ).catch(err => {
                showResult("Camera access denied or unavailable.", true);
            });
        }

        function showResult(text, isError = false) {
            const resultBox = document.getElementById("result-box");
            const copyBtn = document.getElementById("copy-btn");
            if(isError) {
                resultBox.innerHTML = `<span class="text-danger">${text}</span>`;
                copyBtn.disabled = true;
                scannedText = "";
            } else {
                scannedText = text;
                resultBox.innerText = text;
                copyBtn.disabled = false;
            }
        }

        function copyResult() {
            if(scannedText) {
                navigator.clipboard.writeText(scannedText).then(() => {
                    alert("Copied to clipboard!");
                }).catch(() => {
                    // fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = scannedText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert("Copied to clipboard!");
                });
            }
        }

        // When tab switches away from camera, stop scanning
        document.addEventListener('DOMContentLoaded', function() {
            const camTab = document.getElementById('cam-tab');
            const imgTab = document.getElementById('img-tab');
            
            // Stop camera when switching to image tab
            imgTab.addEventListener('shown.bs.tab', function () {
                if (html5QrCode.isScanning) {
                    html5QrCode.stop().catch(err => console.log("Stop error:", err));
                }
            });

            // Optional: stop camera when switching away from cam tab
            camTab.addEventListener('hidden.bs.tab', function () {
                if (html5QrCode.isScanning) {
                    html5QrCode.stop().catch(err => console.log("Stop error:", err));
                }
            });
        });
    </script>
