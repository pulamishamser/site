Copy
<!-- Bottom Navigation Widgets -->
<div class="widget-container">
  
  <!-- Calendar Widget -->
  <div id="calendar-widget" class="widget">
    <h3><i class="fa fa-calendar-alt"></i> पात्रो</h3>
    <div class="calendar-content">
      <!-- Calendar content will be loaded here -->
    </div>
  </div>

  <!-- Games Widget -->
  <div id="games-widget" class="widget">
    <h3><i class="fa fa-gamepad"></i> गेम्स</h3>
    <div class="games-list">
      <a href="#">स्नेक गेम</a>
      <a href="#">पजल गेम</a>
      <a href="#">क्विज गेम</a>
    </div>
  </div>

  <!-- Radio Widget -->
  <div id="radio-widget" class="widget">
    <h3><i class="fa fa-broadcast-tower"></i> रेडियो</h3>
    <div class="radio-player">
      <audio controls>
        <source src="radio-stream.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
      <div class="radio-stations">
        <button>रेडियो नेपाल</button>
        <button>कान्तिपुर FM</button>
      </div>
    </div>
  </div>

  <!-- Date Conversion Widget -->
  <div id="date-conversion-widget" class="widget">
    <h3><i class="fa fa-calendar-day"></i> मिति रूपान्तरण</h3>
    <div class="date-converter">
      <select id="from-calendar">
        <option value="AD">ईस्वी (AD)</option>
        <option value="BS">बिक्रम सम्बत (BS)</option>
      </select>
      <input type="text" id="date-input" placeholder="YYYY-MM-DD">
      <button id="convert-date">रूपान्तरण गर्नुहोस्</button>
      <div id="conversion-result"></div>
    </div>
  </div>

  <!-- Unicode Widget -->
  <div id="unicode-widget" class="widget">
    <h3><i class="fa fa-keyboard"></i> युनिकोड</h3>
    <div class="unicode-converter">
      <textarea placeholder="Preeti/Roman text here..."></textarea>
      <button>युनिकोडमा रूपान्तरण गर्नुहोस्</button>
      <div class="unicode-output"></div>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <a href="#" onclick="showWidget('calendar-widget')"><i class="fa fa-calendar-alt"></i>पात्रो</a>
  <a href="#" onclick="showWidget('games-widget')"><i class="fa fa-gamepad"></i>गेम्स</a>
  <a href="#" onclick="showWidget('radio-widget')"><i class="fa fa-broadcast-tower"></i>रेडियो</a>
  <a href="#" onclick="showWidget('date-conversion-widget')"><i class="fa fa-calendar-day"></i>मिति रूपान्तरण</a>
  <a href="#" onclick="showWidget('unicode-widget')"><i class="fa fa-keyboard"></i>युनिकोड</a>
</div>


<script>
  function showWidget(widgetId) {
    // First show the widget container if hidden
    document.querySelector('.widget-container').style.display = 'block';
    
    // Hide all widgets
    document.querySelectorAll('.widget').forEach(widget => {
      widget.classList.remove('active');
    });
    
    // Show the selected widget
    document.getElementById(widgetId).classList.add('active');
    
    // Prevent default anchor behavior
    return false;
  }
  
  // Optional: Add functionality for each widget
  document.addEventListener('DOMContentLoaded', function() {
    // You can add initialization code for each widget here
  });
</script>

    .bottom-nav {
      position: fixed;

      width: 100%;
      display: flex;
      justify-content: space-around;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 8px 0;
    }

    .bottom-nav a {
      text-align: center;
      flex-grow: 1;
      color: #c8102e;
      font-size: 12px;
      text-decoration: none;
    }

    .bottom-nav a i {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }
  </style>
