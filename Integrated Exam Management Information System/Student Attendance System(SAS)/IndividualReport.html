<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🎓 Individual Attendance Report - Print & PDF</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #eef2ff;
      margin: 0;
      padding: 28px 20px;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-card {
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      transition: all 0.2s;
    }

    .header-area {
      padding: 28px 32px 12px 32px;
      border-bottom: 1px solid #e9ecf2;
      background: #ffffff;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      background: linear-gradient(130deg, #0b2b5c, #1e4a76);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .sub {
      color: #4b5b6c;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .individual-badge {
      background: #e9f0ff;
      color: #1e40af;
      border-radius: 40px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .filter-panel {
      background: #fafbff;
      border-radius: 28px;
      margin: 20px 32px 24px 32px;
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-end;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02), inset 0 1px 0 white;
      border: 1px solid #e6edf2;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 140px;
    }

    .filter-group label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #2c3e66;
    }

    select, input {
      background: white;
      border: 1px solid #cfdee9;
      border-radius: 48px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
      outline: none;
    }

    select:focus, input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    button {
      background: #0f2b45;
      border: none;
      border-radius: 48px;
      padding: 10px 32px;
      font-weight: 600;
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    button:hover {
      background: #123a60;
      transform: translateY(-1px);
      box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.15);
    }

    button:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }

    /* Action Buttons Group */
    .action-buttons {
      display: flex;
      gap: 14px;
      margin-left: auto;
    }
    .print-pdf-btn {
      background: #2c5f8a;
      padding: 8px 20px;
      font-size: 0.8rem;
    }
    .print-pdf-btn:hover {
      background: #1e4668;
    }
    .print-pdf-btn.pdf {
      background: #b91c1c;
    }
    .print-pdf-btn.pdf:hover {
      background: #911515;
    }

    .message-strip {
      margin: 0 32px 20px 32px;
      padding: 12px 20px;
      border-radius: 60px;
      font-weight: 500;
      display: none;
    }

    .message-success {
      background: #e0f2e9;
      color: #0b4f2e;
      border-left: 5px solid #2b9348;
    }

    .message-error {
      background: #ffe9e7;
      color: #b91c1c;
      border-left: 5px solid #e53e3e;
    }

    .report-area {
      padding: 8px 32px 38px 32px;
    }

    .stats-hero {
      background: linear-gradient(115deg, #0f2b45, #e53e3e);
      border-radius: 28px;
      padding: 22px 28px;
      color: white;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .stats-hero h3 {
      margin: 0 0 6px 0;
      font-weight: 600;
      font-size: 1.4rem;
    }

    .stats-hero p {
      margin: 0;
      opacity: 0.8;
      font-size: 0.85rem;
    }

    .att-circle {
      background: #2dd4bf20;
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 20px;
      border: 1px solid #ecf3fa;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      background: #f8fafd;
      padding: 14px 12px;
      font-weight: 700;
      color: #0f2b44;
      border-bottom: 1px solid #e2edf5;
      text-align: left;
    }

    td {
      padding: 12px 12px;
      border-bottom: 1px solid #f0f4fa;
      vertical-align: middle;
    }

    .present-badge {
      background: #c8f0e1;
      color: #0b5e42;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 40px;
      display: inline-block;
      font-size: 0.75rem;
    }

    .absent-badge {
      background: #ffdedb;
      color: #ac2c1a;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 40px;
    }

    .holiday-badge {
      background: #ffefcc;
      color: #b45309;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 40px;
    }

    .total-row {
      background: #f1f5f9;
      font-weight: 800;
      border-top: 2px solid #cfdfed;
    }

    .empty-state {
      background: #fefce8;
      border-radius: 28px;
      padding: 48px 20px;
      text-align: center;
      color: #6c757d;
    }

    @media (max-width: 780px) {
      .filter-panel {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-group {
        width: 100%;
      }
      button {
        width: 100%;
      }
      .header-area {
        padding: 20px;
      }
      .report-area {
        padding: 20px;
      }
      .action-buttons {
        margin-left: 0;
        margin-top: 12px;
        width: 100%;
      }
    }

    /* ========== PRINT STYLES (A4 optimized) ========== */
    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }
      .filter-panel, .action-buttons, .print-pdf-btn, .individual-badge, .sub button, #generateBtn, .message-strip {
        display: none !important;
      }
      .main-card {
        box-shadow: none;
        border-radius: 0;
        margin: 0;
        padding: 0;
      }
      .header-area {
        padding: 12px 20px 4px 20px;
        border-bottom: 1px solid #ccc;
      }
      .report-area {
        padding: 12px 20px 20px 20px;
      }
      .stats-hero {
        background: #0f2b45;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        break-inside: avoid;
      }
      .table-wrapper {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      table {
        font-size: 0.75rem;
      }
      .present-badge, .absent-badge, .holiday-badge {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body, .dashboard {
        margin: 0;
        padding: 0;
      }
      @page {
        size: A4;
        margin: 1.2cm;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <div class="main-card">
    <div class="header-area">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div>
          <h1>Individual Attendance Report</h1>
          <div class="sub">
            <span>🔍 Focus: Individual student performance</span>
            <span class="individual-badge"> Roll‑Number filter · Year + Class scope</span>
          </div>
        </div>
        <div class="action-buttons">
          <button id="printReportBtn" class="print-pdf-btn">🖨️ Print Report</button>
          <button id="downloadPdfBtn" class="print-pdf-btn pdf">📄 Download as PDF</button>
        </div>
      </div>
    </div>

    <div id="globalToast" class="message-strip"></div>

    <!-- FILTER PANEL (individual only) -->
    <div class="filter-panel">
     
      <div class="filter-group">
        <label>📆 ACADEMIC YEAR</label>
        <select id="yearSelect">
          <option value="2080">2080</option>
          <option value="2081" selected>2081</option>
          <option value="2082">2082</option>
          <option value="2083">2083</option>
        </select>
      </div>

      <div class="filter-group" id="monthGroup">
        <label>MONTH </label>
        <select id="monthSelect">
          <option value="Baisakh">Baisakh</option>
          <option value="Jeshtha">Jeshtha</option>
          <option value="Ashad">Ashad</option>
          <option value="Shrawan">Shrawan</option>
          <option value="Bhadra">Bhadra</option>
          <option value="Ashwin">Ashwin</option>
          <option value="Kartik">Kartik</option>
          <option value="Mangsir">Mangsir</option>
          <option value="Poush">Poush</option>
          <option value="Magh">Magh</option>
          <option value="Falgun">Falgun</option>
          <option value="Chaitra">Chaitra</option>
        </select>
      </div>

      <div class="filter-group" id="dailyDateGroup">
        <label> DAY (1-32 गते)</label>
        <input type="number" id="dailyDay" value="15" min="1" max="32" step="1">
      </div>

      <div class="filter-group">
        <label> CLASS</label>
        <select id="classSelect">
          <option value="all"> All Classes</option>
          <option value="1">Grade 1</option><option value="2">Grade 2</option><option value="3">Grade 3</option>
          <option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option>
          <option value="7">Grade 7</option><option value="8">Grade 8</option><option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
        </select>
      </div>

      <div class="filter-group">
        <label>ROLL NUMBER</label>
        <input type="text" id="rollNumberInput" placeholder="e.g., 5, 12, 101" value="7">
      </div>

 <div class="filter-group">
        <label>REPORT TYPE</label>
        <select id="reportModeSelect">
          <option value="daily">Daily Status</option>
          <option value="monthly">Monthly Summary</option>
          <option value="weekly">Weekly Overview</option>
          <option value="yearly">Yearly Master Report</option>
        </select>
      </div>

      <div class="filter-group" id="weeklyRangeGroup" style="display: none;">
        <label> START DAY</label>
        <input type="number" id="weekStart" value="1" min="1" max="32" style="width: 100px;">
        <label style="margin-top: 4px;">➡ END DAY</label>
        <input type="number" id="weekEnd" value="7" min="1" max="32" style="width: 100px;">
      </div>








      <div class="filter-group">
        <button id="generateBtn">⟳ Generate Individual Report</button>
      </div>
    </div>

    <!-- OUTPUT CONTAINER -->
    <div class="report-area" id="reportContainer">
      <div class="stats-hero" style="justify-content: center; text-align: center;">
        <div>
          <span style="font-size: 2.5rem;"></span>
          <h3 style="margin-top: 8px;">Ready for individual analytics</h3>
          <p>Select year, class, roll number & report type → get precise attendance data</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ========================= CONFIGURATION =========================
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxbHayq6mbJN5xS301x1Xuz70-NZYjcSx49pHvUP_vOnekE7c26q1AfFe-xMbSqIc-0hg/exec";

  // DOM references
  const yearSelect = document.getElementById('yearSelect');
  const classSelect = document.getElementById('classSelect');
  const rollInput = document.getElementById('rollNumberInput');
  const reportMode = document.getElementById('reportModeSelect');
  const monthSelect = document.getElementById('monthSelect');
  const dailyDateGroup = document.getElementById('dailyDateGroup');
  const weeklyRangeGroup = document.getElementById('weeklyRangeGroup');
  const dailyDayInput = document.getElementById('dailyDay');
  const weekStartInput = document.getElementById('weekStart');
  const weekEndInput = document.getElementById('weekEnd');
  const generateBtn = document.getElementById('generateBtn');
  const reportContainer = document.getElementById('reportContainer');
  const toastDiv = document.getElementById('globalToast');
  const printBtn = document.getElementById('printReportBtn');
  const downloadPdfBtn = document.getElementById('downloadPdfBtn');

  // Helper: show toast message
  function showMessage(msg, type = "success") {
    toastDiv.textContent = msg;
    toastDiv.className = `message-strip ${type === "error" ? "message-error" : "message-success"}`;
    toastDiv.style.display = "block";
    setTimeout(() => {
      toastDiv.style.display = "none";
    }, 4800);
  }

  // Dynamic UI: toggle day/week fields based on report type
  function updateDynamicFields() {
    const type = reportMode.value;
    if (type === "daily") {
      dailyDateGroup.style.display = "flex";
      weeklyRangeGroup.style.display = "none";
    } else if (type === "weekly") {
      dailyDateGroup.style.display = "none";
      weeklyRangeGroup.style.display = "flex";
    } else {
      dailyDateGroup.style.display = "none";
      weeklyRangeGroup.style.display = "none";
    }
  }

  reportMode.addEventListener('change', updateDynamicFields);
  updateDynamicFields();

  // ---------- BACKEND CALLER ----------
  async function callBackend(action, payloadObj) {
    const params = new URLSearchParams({ action: action, ...payloadObj }).toString();
    try {
      const response = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params,
        mode: 'cors'
      });
      if (!response.ok) throw new Error(`HTTP ${response.status} – server error`);
      const json = await response.json();
      console.log(`[${action}] response:`, json);
      return json;
    } catch (err) {
      console.error("Fetch error:", err);
      throw new Error(`Network / CORS issue: ${err.message}. Check Apps Script deployment.`);
    }
  }

  // ======= MAIN GENERATION (ONLY INDIVIDUAL SCOPE) =======
  let lastRenderedData = null;     // store last successful render data for print/pdf
  let lastFilters = null;

  async function generateIndividualReport() {
    const year = yearSelect.value;
    const classFilter = classSelect.value;
    const rollNo = rollInput.value.trim();
    const reportType = reportMode.value;
    const month = monthSelect.value;

    if (!rollNo) {
      showMessage("❌ Please enter a Roll Number for individual report", "error");
      return;
    }
    if (!/^\d+$/.test(rollNo)) {
      showMessage("❌ Roll number must contain only digits", "error");
      return;
    }

    reportContainer.innerHTML = `<div class="stats-hero" style="justify-content:center;"><span>⏳ Generating individual report for Roll #${rollNo} ...</span></div>`;
    generateBtn.disabled = true;
    generateBtn.textContent = "⟳ Processing...";

    try {
      let result = null;
      const basePayload = { year: year, class: classFilter, rollNo: rollNo };
      let renderPayload = null;

      if (reportType === "daily") {
        let dayRaw = dailyDayInput.value;
        if (!dayRaw) dayRaw = "15";
        const dayNum = parseInt(dayRaw, 10);
        if (isNaN(dayNum) || dayNum < 1 || dayNum > 32) throw new Error("Invalid day (1–32)");
        const dateStr = `${month} ${dayNum}`;
        const payload = { ...basePayload, month: month, date: dateStr };
        result = await callBackend("getDailyReport", payload);
        if (result && result.success) {
          renderPayload = { type: 'daily', data: result.data, filters: { year, classFilter, rollNo, month, dayNum } };
          renderDailyIndividual(result.data, renderPayload.filters);
          showMessage(`✅ Daily record for Roll ${rollNo} loaded`, "success");
        } else throw new Error(result?.message || "Daily data not found");
      }
      else if (reportType === "monthly") {
        const payload = { ...basePayload, month: month };
        result = await callBackend("getMonthlyReport", payload);
        if (result && result.success) {
          renderPayload = { type: 'monthly', data: result.data, filters: { year, classFilter, rollNo, month } };
          renderMonthlyIndividual(result.data, renderPayload.filters);
          showMessage(`📆 Monthly summary for Roll ${rollNo}`, "success");
        } else throw new Error(result?.message || "Monthly summary failed");
      }
      else if (reportType === "weekly") {
        let startDay = weekStartInput.value.trim() || "1";
        let endDay = weekEndInput.value.trim() || "7";
        const sDay = parseInt(startDay, 10);
        const eDay = parseInt(endDay, 10);
        if (isNaN(sDay) || isNaN(eDay) || sDay < 1 || eDay > 32 || sDay > eDay) throw new Error("Week range must be 1–32 and start ≤ end");
        const startDate = `${month} ${sDay}`;
        const endDate = `${month} ${eDay}`;
        const payload = { ...basePayload, month: month, startDate: startDate, endDate: endDate };
        result = await callBackend("getWeeklyReport", payload);
        if (result && result.success) {
          renderPayload = { type: 'weekly', data: result.data, filters: { year, classFilter, rollNo, month, sDay, eDay } };
          renderWeeklyIndividual(result.data, renderPayload.filters);
          showMessage(`🗓️ Weekly report (${sDay}-${eDay}) for Roll ${rollNo}`, "success");
        } else throw new Error(result?.message || "Weekly data error");
      }
      else if (reportType === "yearly") {
        const payload = { ...basePayload };
        result = await callBackend("getYearlyReport", payload);
        if (result && result.success) {
          renderPayload = { type: 'yearly', data: result.data, filters: { year, classFilter, rollNo } };
          renderYearlyIndividual(result.data, renderPayload.filters);
          showMessage(`📈 Yearly master report for Roll ${rollNo} (${year})`, "success");
        } else throw new Error(result?.message || "Yearly individual not available");
      }
      if (renderPayload) {
        lastRenderedData = renderPayload;
        lastFilters = renderPayload.filters;
      }
    } catch (err) {
      console.error(err);
      reportContainer.innerHTML = `<div class="empty-state" style="background: #fee9e6;">❌ Failed: ${err.message}<br><span style="font-size:0.8rem;">Please verify backend script or network.</span></div>`;
      showMessage(err.message, "error");
      lastRenderedData = null;
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "⟳ Generate Individual Report";
    }
  }

  // ---------- RENDER FUNCTIONS (unchanged but store for print) ----------
  function renderDailyIndividual(data, filters) {
    const report = data?.report || [];
    if (!report.length) {
      reportContainer.innerHTML = `<div class="empty-state">⚠️ No attendance record for Roll #${filters.rollNo} on ${filters.month} ${filters.dayNum}.</div>`;
      return;
    }
    const student = report[0];
    let statusHtml = `<span class="absent-badge">${student.status || 'अनुपस्थित'}</span>`;
    if (student.status === 'उपस्थित') statusHtml = `<span class="present-badge">उपस्थित (Present)</span>`;
    else if (student.status === 'सार्वजनिक बिदा') statusHtml = `<span class="holiday-badge">सार्वजनिक बिदा (Holiday)</span>`;

    const html = `
      <div class="stats-hero">
        <div><h3>📅 Daily Attendance · Individual</h3>
        <p><strong>${student.name}</strong> | Roll: ${student.rollNo} | Class: ${student.class}</p>
        <p>📆 Date: ${data.month || filters.month} ${filters.dayNum}, Year ${filters.year}</p></div>
        <div class="att-circle">${statusHtml}</div>
      </div>
      <div class="table-wrapper"><table><thead><tr><th>Roll No</th><th>Name</th><th>Class</th><th>Status</th><th>Remarks</th></tr></thead><tbody>
        <tr><td>${student.rollNo}</td><td>${student.name}</td><td>${student.class}</td><td>${statusHtml}</td><td>${student.remarks || '—'}</td></tr>
      </tbody></table></div>`;
    reportContainer.innerHTML = html;
  }

  function renderMonthlyIndividual(data, filters) {
    const studentData = data?.report?.[0];
    if (!studentData) { reportContainer.innerHTML = `<div class="empty-state">📭 No monthly data for Roll ${filters.rollNo}</div>`; return; }
    const html = `<div class="stats-hero"><div><h3>Monthly Summary (Individual)</h3><p>${studentData.name} | Roll ${studentData.rollNo} | Class ${studentData.class}</p><p>Month: ${data.month || filters.month} | Year ${filters.year}</p></div><div class="att-circle"> ${studentData.percentage}%</div></div>
      <div class="table-wrapper"><table><thead><tr><th>Roll</th><th>Student</th><th>Present</th><th>Total Days</th><th>Teaching Days</th><th>Attendance %</th></tr></thead>
      <tbody><tr><td>${studentData.rollNo}</td><td>${studentData.name}</td><td><strong>${studentData.present}</strong></td><td>${studentData.totalOpened}</td><td>${studentData.teachingDays}</td><td><span class="present-badge">${studentData.percentage}%</span></td></tr></tbody></table></div>`;
    reportContainer.innerHTML = html;
  }

  function renderWeeklyIndividual(data, filters) {
    const record = data?.report?.[0];
    if (!record) { reportContainer.innerHTML = `<div class="empty-state">📅 No weekly data for Roll ${filters.rollNo}</div>`; return; }
    const html = `<div class="stats-hero"><div><h3>Weekly Attendance Snapshot</h3><p>${record.name} | Roll ${record.rollNo} | Grade ${record.class}</p><p> Week: ${filters.month} ${filters.sDay} – ${filters.eDay} (Year ${filters.year})</p></div><div class="att-circle">⭐ ${record.percentage}%</div></div>
      <div class="table-wrapper"><table><thead><tr><th>Roll</th><th>Name</th><th>Present</th><th>Absent</th><th>Total Days</th><th>Percentage</th></tr></thead>
      <tbody><tr><td>${record.rollNo}</td><td>${record.name}</td><td><strong>${record.present}</strong></td><td>${record.absent}</td><td>${record.total}</td><td><span class="present-badge">${record.percentage}%</span></td></tr></tbody></table></div>`;
    reportContainer.innerHTML = html;
  }

  function renderYearlyIndividual(data, filters) {
    const monthlyBreakdown = data?.yearlyData || [];
    if (!monthlyBreakdown.length) { reportContainer.innerHTML = `<div class="empty-state">📭 No yearly data found for Roll ${filters.rollNo}</div>`; return; }
    let rows = "";
    monthlyBreakdown.forEach(m => {
      rows += `<tr><td><strong>${m.month}</strong></td><td>${m.present}</td><td>${m.totalOpened}</td><td>${m.teachingDays}</td><td><span class="${m.percentage >= 75 ? 'present-badge' : 'absent-badge'}">${m.percentage}%</span></td></tr>`;
    });
    const totalPresent = data.totalPresent || 0;
    const totalDays = data.totalDays || 0;
    const yearlyPercent = data.yearlyPercentage || 0;
    const overallClassLabel = filters.classFilter === 'all' ? 'All Classes' : `Grade ${filters.classFilter}`;
    const html = `<div class="stats-hero"><div><h3>Yearly Report · Individual</h3><p>Roll No: ${filters.rollNo} | ${data.studentName || 'Student'} | Class: ${overallClassLabel}</p><p>🎓 Academic Year ${filters.year}</p></div><div class="att-circle"> Yearly: ${yearlyPercent}%</div></div>
      <div class="table-wrapper"><table><thead><tr><th>Month (Nepali)</th><th>Present</th><th>Total Opened Days</th><th>Teaching Days</th><th>Attendance %</th></tr></thead>
      <tbody>${rows}<tr class="total-row"><td><strong>📌 TOTAL / AVERAGE</strong></td><td><strong>${totalPresent}</strong></td><td><strong>${totalDays}</strong></td><td>—</td><td><strong>${yearlyPercent}%</strong></td></tr></tbody></table></div>`;
    reportContainer.innerHTML = html;
  }

  // ---------- PRINT & PDF (A4 fixed format) ----------
  function printReport() {
    if (!lastRenderedData) {
      showMessage("⚠️ Please generate a report first before printing.", "error");
      return;
    }
    window.print();
  }

  function downloadAsPDF() {
    if (!lastRenderedData) {
      showMessage("⚠️ Please generate a report first before downloading PDF.", "error");
      return;
    }
    // Clone the entire report section and style for print preview + PDF
    const originalTitle = document.title;
    document.title = `Attendance_Roll_${lastFilters?.rollNo || 'student'}_${new Date().toISOString().slice(0,19)}`;
    
    // Create a hidden iframe or use browser print media? We'll use window.print with custom PDF settings.
    // For high-fidelity A4 PDF we trigger print and user can "Save as PDF". This is standard cross-browser.
    // To improve UX, notify about "Save as PDF" option in print dialog.
    showMessage("📄 In print dialog, select 'Save as PDF' as destination → A4 format", "success");
    setTimeout(() => {
      window.print();
    }, 200);
  }

  // Attach print & PDF download events
  printBtn.addEventListener('click', printReport);
  downloadPdfBtn.addEventListener('click', downloadAsPDF);

  // Auto restore last render if any after print or ensure dynamic
  generateBtn.addEventListener('click', generateIndividualReport);
  window.addEventListener('DOMContentLoaded', () => {
    if (!rollInput.value) rollInput.value = "7";
    updateDynamicFields();
    generateIndividualReport();
  });
</script>
</body>
</html>
